[book]
title = "Goldberry"
description = "A fast and modern UI toolkit for Java"
authors = ["digitalsmile"]
language = "en"
src = "src"

[output.html]
# The two themes are the landing page's: Nord on a near-white page, and Nord
# dark. `theme/goldberry.css` recolours mdBook's `light` and `navy` to match and
# hides the other three. The decision log under src/adr is not
# listed in SUMMARY.md and is therefore not built: it is read on GitHub.
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/goldberry.css"]
# The landing page's header, built into the menu bar at load.
additional-js = ["theme/goldberry.js"]
git-repository-url = "https://github.com/DigitalSmile/goldberry"
# Each page links to its own source on GitHub.
edit-url-template = "https://github.com/DigitalSmile/goldberry/edit/master/book/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 20
heading-split-level = 2
boost-title = 3
boost-hierarchy = 2
