plugins {
    id 'goldberry.java-conventions'
    // Published to Maven Central as goldberry-core (ADR-0334).
    id 'goldberry.publish'
    // docs/testing.md §1.5. On :core only for now: this is where the hot seams
    // are -- shaping, the paragraph cache, the cascade -- and a benchmark source
    // set in every module would be five empty ones.
    alias(libs.plugins.jmh)
    // GoldenImage, TestFrames and RendererRequirement are shared with :widgets,
    // which needs the same rasterizer guard and the same golden comparison.
    // Fixtures rather than a copy: two golden comparators would drift on the
    // tolerance, and the tolerance is the whole argument of ADR-0050.
    id 'java-test-fixtures'
}

description = 'Goldberry core: widgets, style, layout, text, paint, and the backend SPI'

// The toolkit version is generated into a resource rather than duplicated in
// Java source, so `Goldberry.version()` cannot drift from the published
// artifact version.
def buildInfoDir = layout.buildDirectory.dir('generated/build-info')

def generateBuildInfo = tasks.register('generateBuildInfo', WriteProperties) {
    group = 'build'
    description = 'Generates build-info.properties consumed by Goldberry.version().'
    destinationFile = buildInfoDir.map {
        it.file('io/github/digitalsmile/goldberry/build-info.properties')
    }
    comment = 'Generated by the Gradle build -- do not edit.'
    property('version', project.version.toString())
}

// Deriving the source directory from the task provider is what carries the task
// dependency to every consumer -- processResources and sourcesJar alike.
sourceSets {
    main {
        resources.srcDir(generateBuildInfo.map { buildInfoDir.get() })
    }
}

// :core requires :natives for the sdl3 backend. The module graph is what keeps
// that honest: :natives exports only its wrapper packages, so nothing here can
// reach a MemorySegment even by accident (ADR-0007, §3.1).
dependencies {
    api project(':natives')

    // Named here rather than taken through :natives. Logging is not the native
    // layer's to lend, and the build should say so as plainly as module-info
    // does (ADR-0174).
    api project(':common')
}

// ============================================================================
// Bundled assets (§6.1, §6.2, §6.3, ADR-0033)
//
// Inter and JetBrains Mono are the embedded UI and code faces, OpenMoji is the
// emoji slot, and Lucide is the icon set. The work is done by :assets — an
// ordinary Java tool with its own tests — and only invoked here.
//
// The archives are cached under ~/.gradle rather than in the project's build
// directory: they total 90 MB, they are pinned by checksum so they cannot go
// stale, and a `clean` should not mean downloading them again.
// ============================================================================

def assetCache = layout.settingsDirectory.dir('.gradle/assets')
def assetResources = layout.buildDirectory.dir('generated/assets')

// A configuration rather than a reach into :assets' source sets. Resolving
// another project's classpath directly is unsafe and Gradle refuses it; this
// asks for the same thing through the dependency graph, which also carries the
// build dependency on :assets.
configurations {
    assetTool
}

dependencies {
    assetTool project(':assets')
}

def prepareAssets = tasks.register('prepareAssets', JavaExec) {
    group = 'assets'
    description = 'Fetches the pinned fonts and icon set and prepares them as resources.'

    classpath = configurations.assetTool
    mainClass = 'io.github.digitalsmile.goldberry.assets.PrepareAssets'
    args assetCache.asFile.absolutePath, assetResources.get().asFile.absolutePath

    // The tool is the input: change the manifest — a version, a checksum, the
    // list of entries — and this reruns. The cache directory deliberately is
    // not, or an unrelated archive landing in it would redo all the work.
    inputs.files configurations.assetTool
    outputs.dir assetResources
}

// Deriving the source directory from the task provider carries the dependency to
// processResources and sourcesJar alike, the same way generateBuildInfo does.
sourceSets.main.resources.srcDir(prepareAssets.map { assetResources.get() })

/// Vendors the verbatim upstream licence texts into licenses/.
///
/// Run by hand and committed, not wired into `build`: ADR-0015 wants those texts
/// in the repository so it is self-describing, and a generated file inside a
/// tracked directory that nobody committed is worse than no file at all.
tasks.register('vendorLicences', JavaExec) {
    group = 'assets'
    description = 'Copies the upstream asset licences into licenses/ from the pinned archives.'

    classpath = configurations.assetTool
    mainClass = 'io.github.digitalsmile.goldberry.assets.PrepareAssets'
    args assetCache.asFile.absolutePath,
            assetResources.get().asFile.absolutePath,
            rootProject.layout.projectDirectory.dir('licenses').asFile.absolutePath
}

// Frame rasterizes through Blend2D (ADR-0031), so the tests that paint need a
// real libgoldberry. They abort cleanly without one, the same way :natives' do
// — a Java-only contributor should not need a C++ toolchain to run them.
//
// The default is :natives' own host library, taken from that project rather
// than re-derived here: the host-target detection lives in one place, so adding
// a target cannot leave :core testing a different library than the one that was
// just built. An explicitly supplied path still wins, which is how CI verifies a
// downloaded artifact (ADR-0016).
// The fixtures are JUnit-facing: RendererRequirement aborts a test and
// GoldenImage raises an AssertionFailedError, so they need the same JUnit the
// tests do.
dependencies {
    testFixturesImplementation platform(libs.junit.bom)
    testFixturesImplementation libs.junit.jupiter
}

evaluationDependsOn(':natives')

def hostNativeLibrary = project(':natives').ext.hostNativeLibrary

// Every Test task, not just `test`: `benchmark` is one too, and it needs the
// same native library and the same JEP 472 grant to measure anything at all.
tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    // Forwarded to the forked test JVM, because that is where the tests run.
    // Without this the flag reaches the Gradle daemon and stops there, and
    // `-Dgoldberry.golden.update=true` looks like it does nothing -- which is
    // exactly how it behaved the first time it was tried.
    ['goldberry.golden.update', 'goldberry.golden.scales',
     'goldberry.golden.scales.report', 'goldberry.native.required'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }

    // Set unconditionally, existence decided at execution time -- testing for
    // the file here would read the filesystem during configuration, before
    // cmakeBuild has had a chance to run. RendererRequirement is what turns a
    // missing library into a skip.
    systemProperty 'goldberry.native.library',
            providers.systemProperty('goldberry.native.library')
                    .orElse(hostNativeLibrary.map { it.asFile.absolutePath })
                    .get()

    // And an input, so a rebuilt library re-runs the tests that paint through
    // it. `dependsOn` only orders them: without this, bumping an upstream left
    // every rendering test UP-TO-DATE and green against a library they had not
    // seen. :natives makes the same declaration for the same reason.
    inputs.files(providers.provider {
        var library = file(providers.systemProperty('goldberry.native.library')
                .orElse(hostNativeLibrary.map { it.asFile.absolutePath })
                .get())
        library.isFile() ? [library] : []
    }).withPropertyName('nativeLibrary').optional()
}

// `./gradlew build` should exercise the frame path, not just compile it. Same
// bargain :natives makes, and the same escape hatch: -Pgoldberry.skipNative=true
// for a Java-only build, which leaves the rendering tests skipping.
def skipNative = providers.gradleProperty('goldberry.skipNative')
        .map { Boolean.parseBoolean(it) }
        .getOrElse(false)
def externalLibrary = providers.systemProperty('goldberry.native.library').isPresent()

if (!skipNative && !externalLibrary) {
    tasks.withType(Test).configureEach { dependsOn ':natives:cmakeBuild' }
}

// ============================================================================
// Coverage floor (docs/testing.md §3)
//
// A ratchet, not a target. Each number is a little under what the suite reaches
// today, so the gate catches a change that *drops* coverage and never blocks one
// that merely fails to raise it. Raising a floor is a deliberate edit.
//
// The module figure is deliberately modest, because more than half of :core is
// painters and §0.2 is explicit that line coverage proves reachability there
// rather than correctness -- the goldens carry that. The packages below are the
// other kind: a cascade either resolves a declaration or it does not, and there
// is no picture to fall back on.
// ============================================================================
tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 0.80 }
            limit { counter = 'BRANCH'; minimum = 0.68 }
        }
        rule {
            element = 'PACKAGE'
            includes = [
                    'io.github.digitalsmile.goldberry.css*',
                    'io.github.digitalsmile.goldberry.kdl',
                    'io.github.digitalsmile.goldberry.bind*',
            ]
            // 0.70 and not higher because `bind.registry` sits at 0.71 today --
            // measured, not guessed. A floor above what the suite reaches is a
            // broken build on the first commit rather than a ratchet.
            limit { counter = 'LINE'; minimum = 0.70 }
        }
    }
}
