plugins {
    id 'application'
}

description = 'Goldberry showcase: what the toolkit looks like from an application'

group = 'io.github.digitalsmile.example'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Read from the toolkit rather than duplicated, so the two cannot drift. The
// composite substitutes the local build for these coordinates whatever the
// version says, but a version is still required to write the dependency -- and
// stating the real one keeps this file honest if the composite is ever removed.
def goldberryVersion = {
    var properties = new Properties()
    var file = file('../gradle.properties')
    if (file.isFile()) {
        file.withInputStream { properties.load(it) }
    }
    return properties.getProperty('goldberryVersion', '0.1.0-SNAPSHOT')
}()

dependencies {
    // Coordinates, not `project(':core')`. The composite build in settings.gradle
    // substitutes the local source tree, so this is the same line an application
    // outside this repository would write.
    implementation "io.github.digitalsmile:goldberry-core:${goldberryVersion}"
}

// Where a locally built libgoldberry lives, for a run straight from the source
// tree. A released application gets the library from a classifier jar instead
// and needs none of this.
def hostTarget = {
    def os = System.getProperty('os.name', '').toLowerCase()
    def arch = System.getProperty('os.arch', '').toLowerCase()
    def osToken = os.contains('mac') || os.contains('darwin') ? 'macos'
            : os.contains('windows') ? 'windows' : 'linux'
    def archToken = arch in ['aarch64', 'arm64'] ? 'aarch64' : 'x64'
    return "${osToken}-${archToken}"
}()

def hostLibrary = {
    def name = hostTarget.startsWith('windows') ? 'goldberry.dll'
            : hostTarget.startsWith('macos') ? 'libgoldberry.dylib' : 'libgoldberry.so'
    return file("../natives/build/native/${hostTarget}/install/lib/${name}")
}()

application {
    mainClass = 'io.github.digitalsmile.goldberry.example.Showcase'
    mainModule = 'io.github.digitalsmile.goldberry.example'

    // JEP 472: the natives module is the one that touches native code, so it is
    // the one named here. Naming it rather than ALL-UNNAMED is what the module
    // descriptors in the toolkit exist for (ADR-0007).
    applicationDefaultJvmArgs = [
            '--enable-native-access=io.github.digitalsmile.goldberry.natives',
    ]
}

tasks.named('run') {
    // An explicitly supplied path wins, so CI can point at a downloaded
    // artifact. Otherwise fall back to whatever the local superbuild produced.
    def explicit = providers.systemProperty('goldberry.native.library')
            .orElse(providers.gradleProperty('goldberry.native.library'))
    if (explicit.present) {
        systemProperty 'goldberry.native.library', explicit.get()
    } else if (hostLibrary.isFile()) {
        systemProperty 'goldberry.native.library', hostLibrary.absolutePath
    }

    // Lets CI open a window, confirm it, and exit without a human closing it.
    def frames = providers.gradleProperty('goldberry.example.frames')
    if (frames.present) {
        args = ['--frames=' + frames.get()]
    }

    doFirst {
        if (!explicit.present && !hostLibrary.isFile()) {
            logger.warn("""
                No libgoldberry found at ${hostLibrary}.
                Build it first:  (cd .. && ./gradlew :natives:cmakeBuild)
                Or point at one: ./gradlew run -Pgoldberry.native.library=<path>
                """.stripIndent())
        }
    }
}
