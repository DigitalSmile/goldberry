import io.github.digitalsmile.goldberry.build.nativeimage.GraalVmRelease
import io.github.digitalsmile.goldberry.build.nativeimage.TraceVideoDriver

plugins {
    id 'goldberry.java-conventions'
    // Does nothing to an ordinary build of this module -- the showcase ships no
    // @Markup widgets, so the catalog half has nothing to collect, and the model
    // half only runs for an image. It is here because `nativeImage` below depends
    // on `weaveModels`, and a module that cannot be woven cannot be imaged
    // (ADR-0155).
    id 'goldberry.weave'
    id 'application'
}

description = 'Goldberry showcase: what the toolkit looks like from an application'

dependencies {
    implementation project(':core')
    implementation project(':widgets')

    // The first content module, and the showcase is where an application opts
    // into one (ADR-0190). It buys two things on the Panels screen: the
    // `markdown-view` node, which `panels.kdl` names without this file being
    // mentioned anywhere in it -- the catalog arrives through a `uses`, which is
    // ADR-0131's promise about a second widget module -- and the stylesheet
    // `Showcase.stylesheets()` adds beside the toolkit's own.
    implementation project(':html')

    // The golden-image harness and the renderer requirement, so the gallery can
    // be checked as pictures the way the catalog is (§14, ADR-0110).
    testImplementation testFixtures(project(':core'))

    // On the *test* classpath as well as the runtime one, for
    // `SupportedPropertyTest`: it asserts what the cascade reported about the
    // toolkit's own stylesheets, and capturing that means attaching an appender.
    testImplementation libs.logback.classic

    // Logback only here, and only at runtime. The toolkit binds no SLF4J
    // provider, so choosing one is the application's call -- this is what making
    // that call looks like (ADR-0023).
    runtimeOnly libs.logback.classic
}

// Where a locally built libgoldberry lives, for a run straight from the source
// tree. A released application gets the library from a classifier jar instead
// and needs none of this.
//
// Taken from :natives rather than derived again here. This file used to carry
// its own copy of the host-target detection -- a looser one, which guessed
// `linux` for anything it did not recognise where :natives raises. Three copies
// of that logic is two too many, and the failure mode is silent: the showcase
// would look for a library in a directory the superbuild never writes to.
evaluationDependsOn(':natives')

def hostTarget = project(':natives').ext.hostNativeTargetId
def hostLibrary = project(':natives').ext.hostNativeLibrary.get().asFile

application {
    mainClass = 'io.github.digitalsmile.goldberry.example.Showcase'
    mainModule = 'io.github.digitalsmile.goldberry.example'

    // JEP 472: the natives module is the one that touches native code, so it is
    // the one named here. Naming a module rather than ALL-UNNAMED is what the
    // module descriptors in the toolkit exist for (ADR-0007), and running the
    // showcase on the module path is what proves they are right.
    applicationDefaultJvmArgs = [
            '--enable-native-access=io.github.digitalsmile.goldberry.natives',
    ]

    // macOS drives AppKit from the process's first thread, and the java launcher
    // runs main on a secondary one unless told otherwise. Without this, SDL's
    // Cocoa driver cannot create a device and SDL_Init fails with "No available
    // video device" -- which mentions neither threads nor this flag (ADR-0039).
    //
    // Harmless nowhere else, but only macOS needs it, so only macOS gets it.
    if (hostTarget.startsWith('macos')) {
        applicationDefaultJvmArgs += '-XstartOnFirstThread'
    }
}

// The jar is not published: it is a demonstration, not an artifact (§15). What
// ships is the native image below, attached to a release by `showcase.yml`
// (ADR-0340). There is no jlink image any more: ADR-0048's runtime image was a
// second way to package the same showcase, and the native image is the one that
// is one file (ADR-0159).

// The application module, which is what `--module` names for the image and
// what JEP 472's `--enable-native-access` is granted to.
def appModule = 'io.github.digitalsmile.goldberry.example'

tasks.named('test') {
    def explicit = providers.systemProperty('goldberry.native.library')
            .orElse(providers.gradleProperty('goldberry.native.library'))
    if (explicit.present) {
        systemProperty 'goldberry.native.library', explicit.get()
    } else if (hostLibrary.isFile()) {
        systemProperty 'goldberry.native.library', hostLibrary.absolutePath
    }

    // Forwarded for the same reason the run task forwards it: a golden that has
    // to be rewritten is rewritten by a property, and one that stopped at the
    // Gradle daemon would look like a test that refuses to update. The scale
    // settings ride along for ADR-0162's second half, which is a property too.
    // `goldberry.trace.frames` rides along for the same reason: it is read into a
    // `static final` when the renderer's classes initialise, so a property that
    // stopped at the Gradle daemon would silently trace nothing -- and the two
    // defects that probe exists for (ADR-0142, ADR-0149) were both found from a
    // test rather than from a window.
    ['goldberry.golden.update', 'goldberry.golden.scales',
     'goldberry.golden.scales.report', 'goldberry.trace.frames'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }
}

tasks.named('run') {
    // An explicitly supplied path wins, so CI can point at a downloaded
    // artifact. Otherwise fall back to whatever the local superbuild produced.
    def explicit = providers.systemProperty('goldberry.native.library')
            .orElse(providers.gradleProperty('goldberry.native.library'))
    if (explicit.present) {
        systemProperty 'goldberry.native.library', explicit.get()
    } else if (hostLibrary.isFile()) {
        systemProperty 'goldberry.native.library', hostLibrary.absolutePath
    }

    // Forwarded to the forked JVM, because that is where the application runs.
    // `logback.xml` documents `-Dgoldberry.log.level=TRACE` as the way to see
    // the start-up timeline and per-frame timings (ADR-0028), and without this
    // that property reached the Gradle daemon and stopped there -- the flag
    // appeared to do nothing at all.
    def logLevel = providers.systemProperty('goldberry.log.level')
            .orElse(providers.gradleProperty('goldberry.log.level'))
    if (logLevel.present) {
        systemProperty 'goldberry.log.level', logLevel.get()
    }

    // Same forwarding, for the paint knobs. Without it these reach the Gradle
    // daemon and stop there.
    //
    // `goldberry.backend.videoDriver` is on this list for a reason worth writing
    // down: it is the *only* way to run the showcase without touching the real
    // compositor, and without the forwarding it silently did nothing. Reaching
    // for `SDL_VIDEODRIVER=dummy` in the environment instead does not work
    // either -- a JavaExec fork inherits the **daemon's** environment, not the
    // one the `gradlew` client was invoked with, so the setting applies or does
    // not depending on how the daemon happened to be started. Both of the
    // obvious ways to ask for a headless run were therefore unreliable, which is
    // how a run intended to be headless opened a real Wayland surface and took
    // GNOME Shell down with it (see book/src/status.md).
    ['goldberry.paint.threads', 'goldberry.backend.vsync', 'goldberry.frame.rate',
     'goldberry.backend.videoDriver', 'goldberry.trace.frames',
     'goldberry.trace.input'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }

    // Lets CI open a window, confirm it, and exit without a human closing it.
    var showcaseArgs = []
    var frames = providers.gradleProperty('goldberry.example.frames')
    if (frames.present) {
        showcaseArgs += '--frames=' + frames.get()
    }
    var size = providers.gradleProperty('goldberry.example.size')
    if (size.present) {
        showcaseArgs += '--size=' + size.get()
    }
    if (!showcaseArgs.isEmpty()) {
        args = showcaseArgs
    }

    doFirst {
        if (!explicit.present && !hostLibrary.isFile()) {
            logger.warn("""
                No libgoldberry found at ${hostLibrary}.
                Build it first:  ./gradlew :natives:cmakeBuild
                Or point at one: ./gradlew run -Pgoldberry.native.library=<path>
                """.stripIndent())
        }
    }
}

// --- GraalVM native image (ADR-0127, ADR-0156) ---------------------------
//
// The artifact ADR-0127's whole design was for: a closed world, no class
// loading, no reflection on the binding path, and a start-up measured against
// the process rather than against the JVM.
//
// Two tasks, because an image of this application needs two things and only one
// of them is a compiler invocation:
//
//   nativeImageMetadata  runs the showcase under GraalVM's tracing agent and
//                        writes what it observed into src/main/resources. FFM
//                        descriptors, resources, and the reflection logback
//                        does -- traced rather than hand-written (ADR-0156).
//   nativeImage          runs `native-image` over the woven jar and that
//                        metadata.
//
// Both need a GraalVM. There is none in this repository's toolchain, so neither
// task is wired into `build`; `showcase.yml` installs one and runs both on every
// platform, on a release tag or by hand (ADR-0337, ADR-0340). See
// book/src/native.md.

def graalvmHome = providers.gradleProperty('graalvm.home')
        .orElse(providers.environmentVariable('GRAALVM_HOME'))

// Extra arguments for `native-image`, space-separated. An escape hatch for the
// things that are a property of the *machine* rather than of this application:
// `-Ob` for a quick build while iterating, a `-H:NativeLinkerOption` for a
// toolchain that needs one. Nothing the showcase itself requires belongs here --
// that goes in the task below, where it is reviewed.
def graalvmArgs = providers.gradleProperty('graalvm.args')
        .map { it.split(' ').findAll { arg -> !arg.isEmpty() } as List }
        .getOrElse([])

def windows = hostTarget.startsWith('windows')

/// The GraalVM tool named, or a failure that says how to point at one.
///
/// Resolved inside the task rather than at configuration time, so a build that
/// is not making an image does not need a GraalVM to configure.
def graalTool = { String tool ->
    if (!graalvmHome.present) {
        throw new GradleException("""
            No GraalVM found. ${tool} ships with the GraalVM distribution, not with a stock JDK.

              ./gradlew :example:nativeImage -Pgraalvm.home=/path/to/graalvm
              GRAALVM_HOME=/path/to/graalvm ./gradlew :example:nativeImage

            GraalVM for JDK ${java.toolchain.languageVersion.get().asInt()} or newer: https://www.graalvm.org/downloads/
            """.stripIndent())
    }
    // On Windows `java` is an `.exe` and `native-image` a `.cmd` launcher, so
    // both are tried; asking for `java.cmd` alone found nothing there.
    def executable = (windows ? ['.exe', '.cmd'] : [''])
            .collect { new File(graalvmHome.get(), "bin/${tool}${it}") }
            .find { it.isFile() } ?: new File(graalvmHome.get(), "bin/${tool}")
    if (!executable.isFile()) {
        throw new GradleException(
                "${graalvmHome.get()} has no bin/${tool}. That is a JDK but not a GraalVM"
                        + " -- native-image and the tracing agent ship only with the latter.")
    }
    // CI builds with one GraalVM line (GraalVmRelease.CI_LINE, ADR-0337). Another
    // one here is allowed and worth a line in the log: since 25.1 GraalVM versions
    // apart from its JDK, and two lines can disagree about what an image needs.
    def releaseFile = new File(graalvmHome.get(), 'release')
    if (releaseFile.isFile()) {
        GraalVmRelease.fromReleaseFile(releaseFile.text).flatMap { it.mismatchWarning() }
                .ifPresent { logger.warn("WARNING: ${it}") }
    }
    executable.absolutePath
}

// Beside the code, because it is source: the agent produces it, a human reads
// the diff, and it is packaged into the jar like any other resource so that a
// downstream image build finds it without being told (ADR-0156).
def metadataDir = layout.projectDirectory
        .dir('src/main/resources/META-INF/native-image/io.github.digitalsmile/goldberry-example')

// An `Exec` and not a `JavaExec`: JavaExec takes its launcher from the project's
// toolchain convention, and setting `executable` to a different JDK is a conflict
// it refuses outright ("Toolchain from `executable` property does not match
// toolchain from `javaLauncher` property"). The agent ships with GraalVM and the
// build compiles with whatever the toolchain resolved, so those two JDKs are
// deliberately different and there is nothing to reconcile.
tasks.register('nativeImageMetadata', Exec) {
    group = 'distribution'
    description = 'Runs the showcase under GraalVM\'s agent and records what an image will need'

    // The same two, in the same order, as `nativeImage` -- the trace has to be of
    // the artifact the image is built from. Tracing an unwoven run would record
    // the reflection ADR-0155's runtime binding does and the image never will.
    dependsOn tasks.named('weaveModels')
    dependsOn tasks.named('jar')

    def runtimeClasspath = configurations.runtimeClasspath
    def appJar = tasks.named('jar').flatMap { it.archiveFile }
    def macos = hostTarget.startsWith('macos')

    // `dummy` unless asked otherwise: headless, so this runs on a build machine.
    // Every binding and every sweep still happens; only the compositor does not.
    // The macOS leg of showcase.yml asks for `cocoa`, because SDL's status-bar
    // tray cannot exist without a Cocoa application and the trace should record
    // it (TraceVideoDriver, ADR-0338).
    def videoDriver = TraceVideoDriver.choose(
            providers.gradleProperty(TraceVideoDriver.PROPERTY).getOrNull())
    inputs.property 'videoDriver', videoDriver

    outputs.dir(metadataDir)
    outputs.upToDateWhen { false }

    doFirst {
        if (!hostLibrary.isFile()) {
            throw new GradleException(
                    "no libgoldberry at ${hostLibrary}. Build it first: ./gradlew :natives:cmakeBuild")
        }
        metadataDir.asFile.mkdirs()
        def modulePath = (runtimeClasspath.files.toList() + [appJar.get().asFile])
                .collect { it.absolutePath }
                .join(File.pathSeparator)

        def command = [graalTool('java'),
                       '--enable-native-access=io.github.digitalsmile.goldberry.natives',
                       "-agentlib:native-image-agent=config-output-dir=${metadataDir.asFile.absolutePath}",
                       "-Dgoldberry.backend.videoDriver=${videoDriver}",
                       "-Dgoldberry.native.library=${hostLibrary.absolutePath}"]
        if (macos) {
            command += '-XstartOnFirstThread'  // ADR-0039
        }
        // A real run, and that is the point: the agent records what this window
        // actually did. A screen the run never reaches contributes nothing, which
        // is why the frame count is high enough to open the menu and the HUD and
        // why ADR-0156 says the trace is checked in and reviewed rather than
        // trusted.
        command += ['--module-path', modulePath,
                    '--module', "${appModule}/io.github.digitalsmile.goldberry.example.Showcase",
                    '--frames=120']
        commandLine command
    }
}

def imageDirNative = layout.buildDirectory.dir('native')
def imageName = "goldberry-showcase-${hostTarget}"

// The classifier jar holding libgoldberry, which is what makes the image one
// file instead of two (ADR-0159).
//
// `:natives` already packages the library at exactly the resource path
// `NativeLibrary.resourcePath()` looks for -- that is the released-application
// path, and an image is simply an application. So the jar goes on the image's
// **classpath** (not its module path: nothing `requires` it, so module
// resolution would leave it out) and `NativeLibrary` finds it there with the
// code it already has.
def nativesTaskSuffix = hostTarget.split('-').collect { it.capitalize() }.join('')
def nativesJarTask = ":natives:nativeJar${nativesTaskSuffix}"

// The jar packages whatever is in :natives' artifacts directory, which CI fills
// by downloading each platform's build (ADR-0012). Locally nothing fills it
// unless `stageHostArtifact` runs, so an image built from a source tree asks for
// both -- and in that order, which `dependsOn` alone does not promise.
//
// The ordering is declared from here rather than by making `nativeJar` depend on
// staging, because that dependency would be wrong in CI: the Linux legs build
// inside the manylinux container and download the result, and a `cmakeBuild` on
// the runner would produce a different binary against a different glibc.
def nativesStageTask = ':natives:stageHostArtifact'
project(':natives').tasks.named("nativeJar${nativesTaskSuffix}").configure {
    mustRunAfter nativesStageTask
}

tasks.register('nativeImage', Exec) {
    group = 'distribution'
    description = 'Builds a GraalVM native image of the showcase'

    // Both, and in this order -- see `mustRunAfter` in goldberry.weave.gradle.
    // An image built from a model bound at run time would be an image that binds
    // by reflection, which is the one thing ADR-0155 says an image never does.
    dependsOn tasks.named('weaveModels')
    dependsOn tasks.named('jar')
    // And the library, staged out of this machine's build and packaged as the
    // resource the image will carry.
    dependsOn nativesStageTask
    dependsOn nativesJarTask

    def runtimeClasspath = configurations.runtimeClasspath
    def appJar = tasks.named('jar').flatMap { it.archiveFile }
    def nativesJar = project(':natives').tasks.named(
            "nativeJar${nativesTaskSuffix}").flatMap { it.archiveFile }
    def target = imageDirNative

    inputs.files(nativesJar)
    inputs.files(runtimeClasspath).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(appJar)
    // A FileTree and not `inputs.dir`, because an image can be built before the
    // agent has ever run -- worse, without the metadata, but `native-image` is
    // what should say so rather than Gradle refusing to configure the task.
    inputs.files(fileTree(metadataDir)).withPropertyName('reachabilityMetadata')
    // Without this the task is UP-TO-DATE across a change of arguments, which is
    // exactly when somebody is iterating on them and least expects to be handed
    // the previous image.
    inputs.property('graalvmArgs', graalvmArgs)
    outputs.dir(target)

    doFirst {
        target.get().asFile.mkdirs()
        def modulePath = (runtimeClasspath.files.toList() + [appJar.get().asFile])
                .collect { it.absolutePath }
                .join(File.pathSeparator)

        commandLine graalTool('native-image'),
                '--module-path', modulePath,
                // The library, as a resource rather than a module. On the module
                // path nothing would `require` it and resolution would drop it;
                // on the class path it is exactly what a released application
                // sees, which is the arrangement NativeLibrary was written for.
                '-cp', nativesJar.get().asFile.absolutePath,
                '--module', "${appModule}/io.github.digitalsmile.goldberry.example.Showcase",
                '-o', new File(target.get().asFile, imageName).absolutePath,
                // JEP 472, the same module the jar names (ADR-0007).
                '--enable-native-access=io.github.digitalsmile.goldberry.natives',
                // No `--no-fallback`. It was here because a fallback image is a
                // JVM in a trench coat, and GraalVM 25.3 -- the line CI pins --
                // has no fallback images left to refuse: the flag reports
                // "deprecated ... No effect, no replacement" and was both of the
                // build's two warnings. Failing is still what happens (ADR-0337).
                // Names the class and the trace that reached it rather than a
                // stack in the builder.
                '-H:+ReportExceptionStackTraces'
                // Nothing about class initialisation is passed here any more.
                // `:natives` ships its own META-INF/native-image/.../
                // native-image.properties naming the two classes that have an
                // opinion -- NativeLibrary, which dlopens and so must wait for
                // run time, and Downcalls, which must NOT wait if the image is
                // to make foreign calls at the speed the JVM does (ADR-0161).
                // Both travel in the jar, so an application building its own
                // image gets them without knowing they exist (ADR-0160).
        if (!graalvmArgs.isEmpty()) {
            logger.lifecycle("native-image: extra arguments ${graalvmArgs}")
            args graalvmArgs
        }
    }

    doLast {
        // No library beside the binary and no launcher script to point at one:
        // libgoldberry is *inside* the image, and NativeLibrary unpacks it to a
        // temporary file on first use exactly as it does from a classifier jar
        // (ADR-0159). One file is the whole point.
        logger.lifecycle("native image: {}",
                new File(target.get().asFile, imageName).absolutePath)
    }
}
