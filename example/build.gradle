plugins {
    id 'goldberry.java-conventions'
    // Does nothing to an ordinary build of this module -- the showcase ships no
    // @Markup widgets, so the catalog half has nothing to collect, and the model
    // half only runs for an image. It is here because `nativeImage` below depends
    // on `weaveModels`, and a module that cannot be woven cannot be imaged
    // (ADR-0155).
    id 'goldberry.weave'
    id 'application'
}

description = 'Goldberry showcase: what the toolkit looks like from an application'

dependencies {
    implementation project(':core')
    implementation project(':widgets')

    // The golden-image harness and the renderer requirement, so the gallery can
    // be checked as pictures the way the catalog is (§14, ADR-0110).
    testImplementation testFixtures(project(':core'))

    // Logback only here, and only at runtime. The toolkit binds no SLF4J
    // provider, so choosing one is the application's call -- this is what making
    // that call looks like (ADR-0023).
    runtimeOnly libs.logback.classic
}

// Where a locally built libgoldberry lives, for a run straight from the source
// tree. A released application gets the library from a classifier jar instead
// and needs none of this.
//
// Taken from :natives rather than derived again here. This file used to carry
// its own copy of the host-target detection -- a looser one, which guessed
// `linux` for anything it did not recognise where :natives raises. Three copies
// of that logic is two too many, and the failure mode is silent: the showcase
// would look for a library in a directory the superbuild never writes to.
evaluationDependsOn(':natives')

def hostTarget = project(':natives').ext.hostNativeTargetId
def hostLibrary = project(':natives').ext.hostNativeLibrary.get().asFile

application {
    mainClass = 'io.github.digitalsmile.goldberry.example.Showcase'
    mainModule = 'io.github.digitalsmile.goldberry.example'

    // JEP 472: the natives module is the one that touches native code, so it is
    // the one named here. Naming a module rather than ALL-UNNAMED is what the
    // module descriptors in the toolkit exist for (ADR-0007), and running the
    // showcase on the module path is what proves they are right.
    applicationDefaultJvmArgs = [
            '--enable-native-access=io.github.digitalsmile.goldberry.natives',
    ]

    // macOS drives AppKit from the process's first thread, and the java launcher
    // runs main on a secondary one unless told otherwise. Without this, SDL's
    // Cocoa driver cannot create a device and SDL_Init fails with "No available
    // video device" -- which mentions neither threads nor this flag (ADR-0039).
    //
    // Harmless nowhere else, but only macOS needs it, so only macOS gets it.
    if (hostTarget.startsWith('macos')) {
        applicationDefaultJvmArgs += '-XstartOnFirstThread'
    }
}

// Not published: it is a demonstration, not an artifact (§15).
tasks.withType(PublishToMavenRepository).configureEach { enabled = false }

// --- Runnable image (ADR-0048) -------------------------------------------
//
// A self-contained showcase: a trimmed JDK from jlink, the application modules,
// libgoldberry, and a launcher. No JDK on the machine, no Gradle, no arguments
// to remember.
//
// jlink and not jpackage: jpackage produces a .deb/.dmg/.msi, which means code
// signing on two of the three platforms and a notarization story on one. The
// showcase is something to double-click from a CI artifact, not something to
// install -- and jlink needs no signing identity to produce it.
//
// Cross-compiling an image is possible (jlink takes the target's jmods) but not
// done here: each platform's image is built on its own runner, because the
// libgoldberry that goes inside it has to be built there anyway.

def appModule = 'io.github.digitalsmile.goldberry.example'

// Runtime-only, so nothing `requires` it and module resolution would leave it
// out of the image. Named explicitly, which is also what binds SLF4J's
// ServiceLoader provider (ADR-0023).
def runtimeOnlyModules = ['ch.qos.logback.classic']

def imageDir = layout.buildDirectory.dir("jlink/goldberry-showcase-${hostTarget}")

// `.exe` on Windows, and this is the same lesson ADR-0040 records for cmake and
// ninja: an absolute path is what `Exec` can be trusted with, but on Windows a
// file without an extension is not an executable at all. `bin/jlink` resolves on
// Linux and macOS and is simply not a file on Windows, which is why the showcase
// image built on two platforms and not the third.
def jlinkExecutable = hostTarget.startsWith('windows') ? 'bin/jlink.exe' : 'bin/jlink'
def jlinkTool = javaToolchains.launcherFor(java.toolchain).map {
    def tool = it.metadata.installationPath.file(jlinkExecutable).asFile
    if (!tool.isFile()) {
        throw new GradleException(
                "the JDK toolchain at ${it.metadata.installationPath} has no ${jlinkExecutable}."
                        + " jlink ships with every JDK; a JRE-only installation is the usual cause.")
    }
    tool.absolutePath
}

tasks.register('jlinkImage', Exec) {
    group = 'distribution'
    description = 'Builds a self-contained runnable showcase for the host platform'
    dependsOn tasks.named('jar')

    def runtimeClasspath = configurations.runtimeClasspath
    def appJar = tasks.named('jar').flatMap { it.archiveFile }
    def target = imageDir

    inputs.files(runtimeClasspath).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(appJar)
    outputs.dir(target)

    doFirst {
        // jlink refuses to write into a directory that exists, so the task owns
        // clearing it rather than the caller remembering to.
        target.get().asFile.deleteDir()

        def modulePath = (runtimeClasspath.files.toList() + [appJar.get().asFile])
                .collect { it.absolutePath }
                .join(File.pathSeparator)

        commandLine jlinkTool.get(),
                '--module-path', modulePath,
                '--add-modules', ([appModule] + runtimeOnlyModules).join(','),
                '--output', target.get().asFile.absolutePath,
                // Smaller image. `--strip-debug` removes debug attributes from
                // the JDK's own classes, not from the application's.
                '--strip-debug',
                '--no-header-files',
                '--no-man-pages',
                '--compress', 'zip-6'
    }
}

// The library and the launcher, which jlink cannot produce itself: its
// `--launcher` writes a fixed command line, and the path to libgoldberry is only
// known relative to wherever the image is unpacked.
tasks.register('showcaseImage') {
    group = 'distribution'
    description = 'jlink image plus libgoldberry and a launcher script'
    dependsOn tasks.named('jlinkImage')

    def target = imageDir
    def library = hostLibrary
    def macos = hostTarget.startsWith('macos')
    def windows = hostTarget.startsWith('windows')
    outputs.dir(target)

    doLast {
        def image = target.get().asFile
        def libDir = new File(image, 'lib/goldberry')
        libDir.mkdirs()
        if (!library.isFile()) {
            throw new GradleException(
                    "no libgoldberry at ${library}. Build it first: ./gradlew :natives:cmakeBuild")
        }
        def packagedLibrary = new File(libDir, library.name)
        packagedLibrary.bytes = library.bytes

        // JEP 472 again: the image runs on the module path like `run` does, so
        // the same module has to be named here or every downcall is refused.
        def vmArgs = ['--enable-native-access=io.github.digitalsmile.goldberry.natives']
        if (macos) {
            vmArgs += '-XstartOnFirstThread'  // ADR-0039
        }

        if (windows) {
            new File(image, 'bin/showcase.bat').text = """\
@echo off
setlocal
set APP_HOME=%~dp0..
"%APP_HOME%\\bin\\java.exe" ${vmArgs.join(' ')} ^
  -Dgoldberry.native.library="%APP_HOME%\\lib\\goldberry\\${library.name}" ^
  -m ${appModule}/io.github.digitalsmile.goldberry.example.Showcase %*
"""
        } else {
            def launcher = new File(image, 'bin/showcase')
            launcher.text = """\
#!/bin/sh
# Resolved at run time, not baked in: the image is moved by whoever unpacks it.
APP_HOME=\$(cd "\$(dirname "\$0")/.." && pwd)
exec "\$APP_HOME/bin/java" ${vmArgs.join(' ')} \\
  -Dgoldberry.native.library="\$APP_HOME/lib/goldberry/${library.name}" \\
  -m ${appModule}/io.github.digitalsmile.goldberry.example.Showcase "\$@"
"""
            launcher.setExecutable(true, false)
        }
    }
}

// The gallery is checked as pictures (§14, ADR-0110), and painting one needs the
// rasterizer -- so the test JVM has to be told where the library is, exactly as
// the `run` task is. Without this every golden test *skips*, which is a green
// build that checked nothing.
tasks.named('test') {
    def explicit = providers.systemProperty('goldberry.native.library')
            .orElse(providers.gradleProperty('goldberry.native.library'))
    if (explicit.present) {
        systemProperty 'goldberry.native.library', explicit.get()
    } else if (hostLibrary.isFile()) {
        systemProperty 'goldberry.native.library', hostLibrary.absolutePath
    }

    // Forwarded for the same reason the run task forwards it: a golden that has
    // to be rewritten is rewritten by a property, and one that stopped at the
    // Gradle daemon would look like a test that refuses to update.
    def update = providers.systemProperty('goldberry.golden.update')
            .orElse(providers.gradleProperty('goldberry.golden.update'))
    if (update.present) {
        systemProperty 'goldberry.golden.update', update.get()
    }
}

tasks.named('run') {
    // An explicitly supplied path wins, so CI can point at a downloaded
    // artifact. Otherwise fall back to whatever the local superbuild produced.
    def explicit = providers.systemProperty('goldberry.native.library')
            .orElse(providers.gradleProperty('goldberry.native.library'))
    if (explicit.present) {
        systemProperty 'goldberry.native.library', explicit.get()
    } else if (hostLibrary.isFile()) {
        systemProperty 'goldberry.native.library', hostLibrary.absolutePath
    }

    // Forwarded to the forked JVM, because that is where the application runs.
    // `logback.xml` documents `-Dgoldberry.log.level=TRACE` as the way to see
    // the start-up timeline and per-frame timings (ADR-0028), and without this
    // that property reached the Gradle daemon and stopped there -- the flag
    // appeared to do nothing at all.
    def logLevel = providers.systemProperty('goldberry.log.level')
            .orElse(providers.gradleProperty('goldberry.log.level'))
    if (logLevel.present) {
        systemProperty 'goldberry.log.level', logLevel.get()
    }

    // Same forwarding, for the paint knobs. Without it these reach the Gradle
    // daemon and stop there.
    //
    // `goldberry.backend.videoDriver` is on this list for a reason worth writing
    // down: it is the *only* way to run the showcase without touching the real
    // compositor, and without the forwarding it silently did nothing. Reaching
    // for `SDL_VIDEODRIVER=dummy` in the environment instead does not work
    // either -- a JavaExec fork inherits the **daemon's** environment, not the
    // one the `gradlew` client was invoked with, so the setting applies or does
    // not depending on how the daemon happened to be started. Both of the
    // obvious ways to ask for a headless run were therefore unreliable, which is
    // how a run intended to be headless opened a real Wayland surface and took
    // GNOME Shell down with it (see book/src/status.md).
    ['goldberry.paint.threads', 'goldberry.backend.vsync', 'goldberry.frame.rate',
     'goldberry.backend.videoDriver', 'goldberry.trace.frames',
     'goldberry.trace.input'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }

    // Lets CI open a window, confirm it, and exit without a human closing it.
    var showcaseArgs = []
    var frames = providers.gradleProperty('goldberry.example.frames')
    if (frames.present) {
        showcaseArgs += '--frames=' + frames.get()
    }
    var size = providers.gradleProperty('goldberry.example.size')
    if (size.present) {
        showcaseArgs += '--size=' + size.get()
    }
    if (!showcaseArgs.isEmpty()) {
        args = showcaseArgs
    }

    doFirst {
        if (!explicit.present && !hostLibrary.isFile()) {
            logger.warn("""
                No libgoldberry found at ${hostLibrary}.
                Build it first:  ./gradlew :natives:cmakeBuild
                Or point at one: ./gradlew run -Pgoldberry.native.library=<path>
                """.stripIndent())
        }
    }
}
