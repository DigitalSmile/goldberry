plugins {
    id 'java'
}

description = 'Goldberry model weaver: rewires @Bind fields into bindings with the class-file API'

// Not `goldberry.java-conventions`, and not published as a module of the
// toolkit. This is a **build-time** tool like :assets: it runs over compiled
// classes between `compileJava` and `jar`, it never reaches an application's
// runtime classpath, and it has no module-info because it is launched as a plain
// classpath program (ADR-0125).
group = 'io.github.digitalsmile'
version = providers.gradleProperty('goldberryVersion').get()

def catalog = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')
def javaVersion = catalog.findVersion('java').get().requiredVersion as int

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

dependencies {
    // For the annotation types and the runtime the woven code calls -- Bind,
    // Action, Model, BoundModel, BoundField, FieldListeners. The weaver names
    // them; a string would be a name nothing checks.
    //
    // `compileOnly` for the weaving itself, because the weaver reads them out of
    // *someone else's* class file as descriptors rather than loading them. The
    // tests do load them, so they get the real thing.
    compileOnly project(':core')

    testImplementation platform(catalog.findLibrary('junit-bom').get())
    testImplementation catalog.findLibrary('junit-jupiter').get()
    testRuntimeOnly catalog.findLibrary('junit-platform-launcher').get()
    testImplementation project(':core')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
    // Plain classpath code: it is not part of the module graph, so there is
    // nothing here for JPMS to enforce.
    options.compilerArgs << '-Xlint:all,-serial' << '-Werror'
}

// Runnable as `java -jar goldberry-weaver.jar <classes-dir>`, which is the
// integration path for every build system that is not this one. The weaver has
// no dependencies beyond the JDK, so a plain jar is a complete one -- there is
// nothing to shade and no classpath to assemble.
tasks.named('jar') {
    manifest {
        attributes(
                'Main-Class': 'io.github.digitalsmile.goldberry.weaver.WeaverMain',
                'Implementation-Title': 'Goldberry model weaver',
                'Implementation-Version': project.version,
        )
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
}

tasks.withType(PublishToMavenRepository).configureEach { enabled = false }
