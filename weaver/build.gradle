plugins {
    id 'java-library'
    // Published as `goldberry-weaver`: an application's build runs it, through
    // the `dev.goldberry.weave` plugin or by hand.
    id 'goldberry.publish'
    // The two binding schemes, measured against each other in one JVM. This is
    // the only module that can: it holds a raw model and can weave a copy of it
    // in memory, so both forms of one class exist side by side.
    id 'goldberry.benchmarks'
}

description = 'Goldberry weaver: the widget catalog, and the models a native image is built from'

// Not `goldberry.java-conventions`, and no module of the toolkit's run time.
// This is a **build-time** tool: it runs over compiled classes between
// `compileJava` and `jar`, it never reaches an application's runtime classpath,
// and it has no module-info because it is launched as a plain classpath
// program. It is published all the same (`goldberry-weaver`, in the BOM and not
// the umbrella), because an application's build needs it as much as this one
// does: a library with `@Markup` widgets needs its catalog, and a native image
// needs its models woven.
//
// Two halves, wanted at different times. `--catalog` declares a
// module's @Markup widgets and every build needs it, because nothing finds
// annotated classes at run time. `--models` rewires @Bind fields and writes the
// @Action call sites, and only a GraalVM native image needs it -- an ordinary jar
// binds the same annotations reflectively, so this is a dependency of the image
// build rather than of the toolkit.
// https://goldberry.dev/docs/ahead-of-time-binding.html#widget-catalogues
def catalog = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')
def javaVersion = catalog.findVersion('java').get().requiredVersion as int

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

dependencies {
    // For the annotation types and the runtime the woven code calls -- Bind,
    // Action, Model, BoundModel, BoundField, FieldListeners. The weaver names
    // them; a string would be a name nothing checks.
    //
    // `compileOnly` for the weaving itself, because the weaver reads them out of
    // *someone else's* class file as descriptors rather than loading them. The
    // tests do load them, so they get the real thing.
    compileOnly project(':core')

    testImplementation platform(catalog.findLibrary('junit-bom').get())
    testImplementation catalog.findLibrary('junit-jupiter').get()
    testRuntimeOnly catalog.findLibrary('junit-platform-launcher').get()
    testImplementation project(':core')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
    // Plain classpath code: it is not part of the module graph, so there is
    // nothing here for JPMS to enforce.
    options.compilerArgs << '-Xlint:all,-serial' << '-Werror'
}

// The fixtures under `src/test/java/.../models` stand in for an application's
// compiled classes, so they have to carry what an application's classes carry.
// `MethodParameters` is one of the attributes the weaver was dropping, and javac
// writes it only when asked -- without this there would be no parameter names in
// the test tree for a test to find missing.
tasks.named('compileTestJava') {
    options.compilerArgs << '-parameters'
}

// Runnable as `java -jar goldberry-weaver.jar <classes-dir>`, which is the
// integration path for every build system that is not this one. The weaver has
// no dependencies beyond the JDK, so a plain jar is a complete one -- there is
// nothing to shade and no classpath to assemble.
tasks.named('jar') {
    manifest {
        attributes(
                'Main-Class': 'dev.goldberry.weaver.WeaverMain',
                'Implementation-Title': 'Goldberry model weaver',
                'Implementation-Version': project.version,
        )
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
}

// The published javadoc's lint is the toolkit's, and `goldberry.publish` turns
// it on; the weaver is documented in prose the same way.
