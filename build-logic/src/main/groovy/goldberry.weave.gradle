import org.gradle.api.artifacts.VersionCatalogsExtension

// ============================================================================
// Model weaving (ADR-0125)
//
// Rewires every `@Model`'s `@Bind` fields into bindings, in the compiled class,
// between `compileJava` and anything that reads its output. A module that keeps
// a view model applies this; nothing else needs it.
//
// It runs as a separate JVM rather than inside the Gradle daemon because the
// weaver needs the class-file API of the *toolchain* -- the daemon's JVM is
// whatever launched Gradle, and pinning the build to it would make the toolkit's
// Java floor a property of how somebody started their build.
// ============================================================================

def catalog = extensions.getByType(VersionCatalogsExtension).named('libs')
def javaVersion = catalog.findVersion('java').get().requiredVersion as int

configurations {
    goldberryWeaver {
        canBeConsumed = false
        canBeResolved = true
        description = 'The model weaver, run over this module\'s compiled classes.'
    }
}

dependencies {
    goldberryWeaver project(':weaver')
}

// Both source sets, because a test that declares its own @Model -- a benchmark
// comparing two schemes, a fixture exercising one rule -- is a model like any
// other, and one that compiled but was never woven would fail as a binding that
// silently notifies nobody.
def weaveTasks = ['main': 'compileJava', 'test': 'compileTestJava'].collect { setName, compileTask ->
    tasks.register(setName == 'main' ? 'weaveModels' : 'weaveTestModels', JavaExec) {
        group = 'build'
        description = "Rewires @Bind fields into bindings in the compiled ${setName} classes."

        dependsOn tasks.named(compileTask)

        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        classpath = configurations.goldberryWeaver
        mainClass = 'io.github.digitalsmile.goldberry.weaver.WeaverMain'

        def classesDir = tasks.named(compileTask).flatMap { it.destinationDirectory }
        argumentProviders.add({ [classesDir.get().asFile.absolutePath] } as CommandLineArgumentProvider)

        // In place, so the same directory is both. Gradle therefore never
        // considers this up to date, which is fine and deliberate: weaving is
        // idempotent -- a class that already implements `BoundModel` is left
        // exactly as it is -- so a second run over an unchanged tree writes
        // nothing at all.
        inputs.dir(classesDir).withPathSensitivity(PathSensitivity.RELATIVE)
        outputs.dir(classesDir)
        outputs.upToDateWhen { false }
    }
}

// `classes` is what `jar`, `run` and test compilation all reach through, and
// `testClasses` is what every Test task reaches through -- so hanging the weave
// off them means there is no way to consume unwoven output, which is the failure
// this whole step exists to make impossible.
tasks.named('classes') {
    dependsOn weaveTasks[0]
}
tasks.named('testClasses') {
    dependsOn weaveTasks[1]
}
