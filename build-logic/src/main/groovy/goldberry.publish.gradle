import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavaPlatform
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar
import dev.goldberry.build.publish.CorrespondingSource
import dev.goldberry.build.publish.PublishedModule
import dev.goldberry.build.publish.PublishedModules

// ============================================================================
// Publishing to Maven Central
// https://goldberry.dev/docs/contributing/releasing.html#where-things-go
//
// Applied by the shipped modules and nothing else -- `PublishedModules` is the
// list, and applying this anywhere off it fails here rather than putting a
// build-time tool on Central, which is forever.
//
// One task does both halves: `./gradlew publishToMavenCentral` uploads a
// `-SNAPSHOT` to the Central Portal's snapshot repository and a release to a
// Portal deployment. Only `publish.yml` runs it, once per run, with every
// platform's library in hand. No per-OS workflow may: a snapshot's classifier
// jars are listed in the metadata its upload writes, so a runner publishing its
// own platform would leave Central naming whichever finished last.
//
// Credentials and the signing key arrive as Gradle properties, which CI sets
// from secrets through `ORG_GRADLE_PROJECT_*`:
//   mavenCentralUsername, mavenCentralPassword          the Portal user token
//   signingInMemoryKey, signingInMemoryKeyPassword      the ASCII-armoured key
// The one-time setup and the release steps:
// https://goldberry.dev/docs/contributing/releasing.html#cutting-a-release
// ============================================================================

plugins {
    // First, so `version` is resolved before the coordinates read it. Not the
    // java conventions: `:bom` is a `java-platform`, which cannot share a project
    // with `java-library`, so a module applies whichever of the two it is before
    // this plugin.
    id 'goldberry.versioning'
    id 'com.vanniktech.maven.publish'
}

def module = PublishedModules.require(project.name)

mavenPublishing {
    switch (module) {
        case PublishedModule.Bom:
            if (!pluginManager.hasPlugin('java-platform')) {
                throw new GradleException(":${project.name} publishes a BOM and must apply 'java-platform' first")
            }
            configure(new JavaPlatform())
            break
        default:
            if (!pluginManager.hasPlugin('java-library')) {
                throw new GradleException(
                        ":${project.name} publishes a jar and must apply 'goldberry.java-conventions' first")
            }
            configure(new JavaLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources()))
    }
    coordinates(PublishedModules.GROUP, module.artifactId(), project.version.toString())

    // A release stops in the Portal as a validated deployment and a person
    // presses Publish, until `-Pgoldberry.centralAutoRelease=true` says the chain
    // has earned it. A release on Central cannot be withdrawn, so the first few
    // get a look before they are permanent.
    publishToMavenCentral(providers.gradleProperty('goldberry.centralAutoRelease')
            .map { Boolean.parseBoolean(it) }
            .getOrElse(false))

    // Central requires a signature on a release and has no use for one on a
    // snapshot. Signing only releases is also what lets a contributor run
    // `publishToMavenLocal` without a key.
    if (!project.version.toString().endsWith('-SNAPSHOT')) {
        signAllPublications()
    }

    pom {
        name = PublishedModules.displayName(module)
        description = project.description
        inceptionYear = '2026'
        url = 'https://goldberry.dev'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'digitalsmile'
                name = 'DigitalSmile'
                url = 'https://github.com/DigitalSmile'
            }
        }
        scm {
            url = 'https://github.com/DigitalSmile/goldberry'
            connection = 'scm:git:https://github.com/DigitalSmile/goldberry.git'
            developerConnection = 'scm:git:ssh://git@github.com/DigitalSmile/goldberry.git'
        }
    }
}

// No FFmpeg binary leaves without its source. Section 4 of the LGPL-2.1 has
// `goldberry-media`'s `ffmpeg-<target>` classifiers distributed only beside
// their complete corresponding source, from the same place, and a snapshot is a
// distribution as much as a release is -- so any publication carrying one and
// not `ffmpeg-sources` is refused, to mavenLocal and to Central alike.
//
// Checked when the task graph is ready rather than in the publish task: the
// modules upload one after another, and a refusal in :media's own task would
// come after eight others were already on Central -- which is how the javadoc
// lint once failed a snapshot with three modules already uploaded.
gradle.taskGraph.whenReady { graph ->
    tasks.withType(AbstractPublishToMaven).matching { graph.hasTask(it) }.each { task ->
        CorrespondingSource.require(
                task.publication.artifactId,
                task.publication.artifacts.collect { it.classifier })
    }
}

// :core's test fixtures -- GoldenImage, TestFrames -- are shared with :widgets
// inside this build and are not API. `java-test-fixtures` adds them to the `java`
// component, so without this every consumer's POM would name them.
pluginManager.withPlugin('java-test-fixtures') {
    components.named('java', AdhocComponentWithVariants) { component ->
        component.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
        component.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }
        // `withSourcesJar()` in the conventions gives the fixtures a sources
        // variant of their own, and it leaks the same way.
        configurations.matching { it.name == 'testFixturesSourcesElements' }.configureEach { sources ->
            component.withVariantsFromConfiguration(sources) { skip() }
        }
    }
}

// Doclint on for the published javadoc, less the `missing` group.
// https://goldberry.dev/docs/contributing/testing.html#static-analysis
// The 120 errors that used to keep it off were `@param` blocks written on the
// class above a one-method `...Calls` holder, which doclint reads as a tag on a
// type, and twenty `[Foo]` links to a type another package or module owns; both
// are fixed at the source and the lint is what keeps them fixed. `missing` is
// left out on purpose: it wants a `@param` for every parameter, and this
// codebase documents in prose -- a `///` sentence that says what a method does
// is the documentation, and four hundred `@param x the x` lines would be noise
// that hides the sentence.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

// ...and it runs with `check`, which turning the lint on had left out.
// Nothing but `javadocJar` generated javadoc, and nothing but `publish.yml` runs
// that -- so the lint fired in the last step of the last job, after three
// operating systems had built four native libraries. `[ChartSpec#fill]` on
// `line-chart` took thirteen minutes to report a link whose target is one
// interface up, and it reported it *while uploading*: three modules were already
// on Central's snapshot repository when the fourth failed to document itself.
//
// Under `pluginManager.withPlugin` because `:bom` is a `java-platform` and has no
// `javadoc` task to depend on; the `default` branch above has already refused any
// other module that is not a `java-library`.
pluginManager.withPlugin('java-library') {
    tasks.named('check') {
        dependsOn tasks.named('javadoc')
    }
}
