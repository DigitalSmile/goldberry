import org.gradle.api.artifacts.VersionCatalogsExtension

plugins {
    id 'java-library'
}

// Precompiled Groovy script plugins do not get the generated `libs` accessors
// that a module build script has, so the catalog is read through its extension.
// This is the one place the Groovy DSL costs something real -- see ADR-0013.
def catalog = extensions.getByType(VersionCatalogsExtension).named('libs')
def javaVersion = catalog.findVersion('java').get().requiredVersion as int

group = 'io.github.digitalsmile'
version = providers.gradleProperty('goldberryVersion').get()

// Published artifact names are `goldberry-core`, `goldberry-widgets`, ...
// See docs/ARCHITECTURE.md §15.
base {
    archivesName = "goldberry-${project.name}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    // Every module ships a module-info. The module graph is what actually
    // enforces §3.1's "raw MemorySegment never escapes :natives" -- without it
    // that rule is convention, not a boundary. It is also what makes
    // `--enable-native-access=<module>` targetable under JEP 472.
    modularity.inferModulePath = true
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
    options.compilerArgs.addAll([
            '-Xlint:all,-serial',
            '-Werror',
    ])
}

dependencies {
    // The logging facade, everywhere. `api` because a type from it appears in no
    // signature but a consumer wiring a backend needs it on their module path,
    // and because a toolkit that logs through a facade its consumers cannot see
    // is a toolkit that logs nowhere.
    //
    // No implementation is bound here, by design: choosing one is the
    // application's call, and a library that ships a backend takes that choice
    // away (ADR-0023).
    api catalog.findLibrary('slf4j-api').get()

    testImplementation platform(catalog.findLibrary('junit-bom').get())
    testImplementation catalog.findLibrary('junit-jupiter').get()
    testRuntimeOnly catalog.findLibrary('junit-platform-launcher').get()
}

// Benchmarks are JUnit classes tagged `benchmark`, and they are NOT tests: they
// print numbers and assert almost nothing, because a timing assertion on shared
// CI hardware fails for reasons that have nothing to do with the code. ADR-0028
// and ADR-0031 both took their numbers this way -- measured, written down, and
// argued about in prose rather than pinned by a threshold nobody can tune.
//
// So `check` never runs them and `./gradlew benchmark` does.
tasks.withType(Test).configureEach {
    // Guarded by name, because this configures the `benchmark` task below as
    // well: include and exclude accumulate rather than replace, so an
    // unconditional exclude here leaves that task both including and excluding
    // the tag, and silently running nothing at all.
    def isBenchmark = name == 'benchmark'
    useJUnitPlatform {
        if (!isBenchmark) {
            excludeTags 'benchmark'
        }
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

tasks.register('benchmark', Test) {
    group = 'verification'
    description = 'Runs the benchmarks, which print measurements rather than asserting them.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'benchmark'
    }
    // The numbers are the whole output, so they have to reach the console.
    testLogging {
        events 'started', 'passed', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    // Never up to date: a benchmark whose result is cached from last week is
    // worse than no benchmark.
    outputs.upToDateWhen { false }
}

// Apache-2.0 §4(a) and §4(d): a redistributor must receive the licence, and the
// NOTICE file if one exists. Putting both in META-INF means every consumer of a
// Goldberry jar has them whether or not they ever see the repository.
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { into 'META-INF' }
    from(rootProject.file('NOTICE')) { into 'META-INF' }
    from(rootProject.file('THIRD-PARTY-NOTICES.md')) { into 'META-INF' }
    from(rootProject.file('licenses')) { into 'META-INF/licenses' }
}
