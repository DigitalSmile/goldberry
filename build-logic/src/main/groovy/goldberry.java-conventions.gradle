import org.gradle.api.artifacts.VersionCatalogsExtension

plugins {
    id 'java-library'
    id 'jacoco'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
    id 'pmd'
    id 'com.github.spotbugs'
}

// Precompiled Groovy script plugins do not get the generated `libs` accessors
// that a module build script has, so the catalog is read through its extension.
// This is the one place the Groovy DSL costs something real -- see ADR-0013.
def catalog = extensions.getByType(VersionCatalogsExtension).named('libs')
def javaVersion = catalog.findVersion('java').get().requiredVersion as int

group = 'io.github.digitalsmile'
version = providers.gradleProperty('goldberryVersion').get()

// Published artifact names are `goldberry-core`, `goldberry-widgets`, ...
// See docs/ARCHITECTURE.md §15.
base {
    archivesName = "goldberry-${project.name}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    // Every module ships a module-info. The module graph is what actually
    // enforces §3.1's "raw MemorySegment never escapes :natives" -- without it
    // that rule is convention, not a boundary. It is also what makes
    // `--enable-native-access=<module>` targetable under JEP 472.
    modularity.inferModulePath = true
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
    options.compilerArgs.add('-Xlint:all,-serial')
    // On by default. `-Pgoldberry.lenient` turns it off, which is for *triage*
    // rather than for a green build: adding a checker reports its findings one
    // compilation unit at a time, so enumerating the tail means letting the
    // compile finish. `check` never passes with it set, because nothing sets it.
    if (!providers.gradleProperty('goldberry.lenient').isPresent()) {
        options.compilerArgs.add('-Werror')
    }

    // ------------------------------------------------------------------------
    // Error Prone and NullAway (docs/testing.md §2)
    //
    // On for `src/main`, off for tests. A test that ignores a return value or
    // compares two boxed integers is usually saying so on purpose, and a checker
    // that fails the build over it teaches people to write `@SuppressWarnings`
    // rather than to read the finding.
    //
    // NullAway only looks at packages that have opted in with JSpecify's
    // `@NullMarked`, which is what makes adopting it possible at all: a codebase
    // this size cannot be annotated in one commit, and a checker that shouted
    // about every unannotated file would be switched off within a day. The
    // annotated set grows a package at a time and each one is checked from the
    // moment it is marked.
    // ------------------------------------------------------------------------
    options.errorprone {
        // Off for tests, and off for the JMH source set: half of it is
        // generated by JMH's annotation processor, and the plugin is not on that
        // source set's processor path anyway -- which javac reports as the
        // gnomic "plug-in not found: ErrorProne".
        enabled = !name.toLowerCase().contains('test') && !name.toLowerCase().contains('jmh')

        // Generated by jextract and by the weaver: not written by hand, so a
        // finding in one is not something anybody can act on.
        excludedPaths = '.*/(build|generated)/.*'

        // `///` markdown javadoc is JDK 23+ and Error Prone's javadoc checks do
        // not understand it -- every doc comment in this repository is one, so
        // these fire on nearly every file and say nothing.
        // `NotJavadoc` is in this list for the same reason and is worth naming:
        // it fires on every `///` comment written on a `requires` or `exports`
        // directive in a module-info, which this project documents deliberately.
        disable('AlmostJavadoc', 'MissingSummary', 'InvalidBlockTag',
                'InvalidLink', 'EmptyBlockTag', 'InvalidParam', 'NotJavadoc')

        // `ReferenceEquality` fires on `Thread.currentThread() != owner`, which
        // is the confinement check eighteen files in this project make and is
        // the *correct* comparison every time: a thread's identity is its
        // reference, `Thread` does not override `equals`, and the question is
        // "is this the same thread" rather than "an equal one" (ADR-0020's one
        // UI thread, and the arena-per-owner rule under it). Eighteen
        // suppressions would be eighteen places to explain the same thing; the
        // check has no signal on this codebase, so it is off with the reason
        // written once.
        disable('ReferenceEquality')

        // **`OnlyNullMarked`, not `AnnotatedPackages`.** The latter declares the
        // whole tree annotated, which is how this was first written and it is
        // backwards: NullAway then treats every unannotated field as non-null and
        // reports four errors a file in code nobody has looked at yet. With this,
        // a package is checked from the moment it opts in with JSpecify's
        // `@NullMarked` and is invisible until then -- which is the only way a
        // codebase this size adopts it at all.
        option('NullAway:OnlyNullMarked', 'true')
        // ERROR normally, so a violation fails the build. `-Pgoldberry.nullaway=warn`
        // demotes it for the adoption sweep in `tools/nullness/`: at ERROR a
        // failing :core stops :widgets compiling at all, so a sweep over the
        // whole graph only ever saw the first module's diagnostics -- and
        // "annotated 17 parameters" was 17 in the wrong module.
        if (providers.gradleProperty('goldberry.nullaway').orNull == 'warn') {
            warn('NullAway')
        } else {
            error('NullAway')
        }
    }
}

dependencies {
    // The logging facade, everywhere. `api` because a type from it appears in no
    // signature but a consumer wiring a backend needs it on their module path,
    // and because a toolkit that logs through a facade its consumers cannot see
    // is a toolkit that logs nowhere.
    //
    // No implementation is bound here, by design: choosing one is the
    // application's call, and a library that ships a backend takes that choice
    // away (ADR-0023).
    api catalog.findLibrary('slf4j-api').get()

    // Error Prone and NullAway (docs/testing.md §2). `errorprone` is the
    // compiler plugin; `nullaway` rides on it as a check rather than a plugin of
    // its own; `jspecify` is the annotation set both read -- and `api`, because
    // @Nullable on a return type is part of a signature a consumer compiles
    // against.
    api catalog.findLibrary('jspecify').get()
    errorprone catalog.findLibrary('errorprone-core').get()
    errorprone catalog.findLibrary('nullaway').get()

    testImplementation platform(catalog.findLibrary('junit-bom').get())
    testImplementation catalog.findLibrary('junit-jupiter').get()
    testRuntimeOnly catalog.findLibrary('junit-platform-launcher').get()
}

// Benchmarks are JUnit classes tagged `benchmark`, and they are NOT tests: they
// print numbers and assert almost nothing, because a timing assertion on shared
// CI hardware fails for reasons that have nothing to do with the code. ADR-0028
// and ADR-0031 both took their numbers this way -- measured, written down, and
// argued about in prose rather than pinned by a threshold nobody can tune.
//
// So `check` never runs them and `./gradlew benchmark` does.
tasks.withType(Test).configureEach {
    // Guarded by name, because this configures the `benchmark` task below as
    // well: include and exclude accumulate rather than replace, so an
    // unconditional exclude here leaves that task both including and excluding
    // the tag, and silently running nothing at all.
    def isBenchmark = name == 'benchmark'
    useJUnitPlatform {
        if (!isBenchmark) {
            excludeTags 'benchmark'
        }
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

tasks.register('benchmark', Test) {
    group = 'verification'
    description = 'Runs the benchmarks, which print measurements rather than asserting them.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'benchmark'
    }
    // The numbers are the whole output, so they have to reach the console.
    testLogging {
        events 'started', 'passed', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    // Never up to date: a benchmark whose result is cached from last week is
    // worse than no benchmark.
    outputs.upToDateWhen { false }
}

// ============================================================================
// Formatting (docs/testing.md §2)
//
// Spotless with palantir-java-format, over every Java file the formatter can
// safely read -- which is all but nineteen of them, and the exclusion list below
// is not a preference.
//
// **palantir-java-format 2.97.0 corrupts JDK 23+ `///` markdown javadoc.** When a
// `///` line is too long to fit, it wraps the content onto a new line *without*
// re-emitting the `///` prefix, so a doc comment becomes a statement and the file
// stops compiling. This project's doc comments carry ADR links whose URLs are
// single unbreakable tokens of ninety-odd characters, and running the formatter
// over the whole tree produced eleven corrupted files and eighty compile errors.
// `formatJavadoc(false)` does not prevent it -- the step treats `///` as a line
// comment, which that flag does not govern.
//
// The alternative to excluding them was rewriting nineteen doc comments to suit
// the tool, and the only way to shorten those lines is to shorten the URLs, which
// are relative paths the book resolves. Prose does not get rewritten to fit a
// formatter, and links do not get broken to fit one either.
//
// Everything else -- every brace, wrap and blank line in roughly nine hundred
// files -- is now the formatter's decision rather than an author's, which is what
// §2 asked for and what ends the arguments it exists to end.
// ============================================================================

/// The files palantir-java-format writes invalid Java for. See the note above.
///
/// Verified rather than guessed: this is the set `spotlessApply --continue`
/// reported, and `spotlessCheck` passing is what says the list is still exactly
/// right. A file added here needs a reason; a file that no longer needs to be
/// here will make nothing fail, so the list is re-derived when the formatter is
/// upgraded rather than trusted for ever.
def palantirCannotFormat = [
        '**/goldberry/Host.java',
        '**/goldberry/paint/Box.java',
        '**/goldberry/css/select/Selector.java',
        '**/goldberry/css/value/Transform.java',
        '**/goldberry/text/font/Font.java',
        '**/goldberry/widget/style/Paints.java',
        '**/goldberry/widgets/controls/Scale.java',
        '**/goldberry/widgets/controls/checkbox/Checkbox.java',
        '**/goldberry/widgets/controls/knob/Knob.java',
        '**/goldberry/widgets/controls/knob/KnobTrack.java',
        '**/goldberry/widgets/controls/knob/KnobGoldenTest.java',
        '**/goldberry/widgets/controls/option/Option.java',
        '**/goldberry/widgets/controls/radio/Radio.java',
        '**/goldberry/widgets/controls/slider/Slider.java',
        '**/goldberry/widgets/controls/toggle/Toggle.java',
        '**/goldberry/widgets/form/textarea/TextAreaState.java',
        '**/goldberry/widgets/overlay/hud/Hud.java',
        '**/goldberry/widgets/overlay/toast/ToasterBox.java',
        '**/goldberry/widgets/panel/tabs/TabList.java',
        '**/goldberry/example/ui/Screen.java',
        'src/main/java/module-info.java',
]

spotless {
    java {
        target fileTree(projectDir) {
            include 'src/*/java/**/*.java'
            exclude '**/build/**'
            exclude palantirCannotFormat
        }

        palantirJavaFormat(catalog.findVersion('palantirFormat').get().requiredVersion)

        // An import nothing uses is a dependency the file does not have, and the
        // compiler does not say so. It used to throw inside its own parser on
        // `TourState.java`; the cause was a javadoc reference split across two
        // lines there, which is fixed, so the step runs.
        removeUnusedImports()

        // Static imports first, which is where this codebase already puts them.
        // The formatter's own default puts them last, so adopting it would have
        // been a reformat that quietly reversed a convention.
        importOrder('\\#', 'java', 'javax', '', 'io.github.digitalsmile')

        // After the formatter rather than instead of it: palantir settles
        // indentation and wrapping, and these settle what it does not speak to --
        // including in the excluded files above, which still get this much.
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'markdown', {
        target 'docs/**/*.md', 'book/src/**/*.md', '*.md'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// ============================================================================
// PMD (docs/testing.md §2, the "blocking after triage" tier -- triaged)
//
// A hand-picked ruleset in `config/pmd/ruleset.xml` rather than PMD's defaults,
// and the file says why: the defaults are a style guide, and this project's
// comments are prose and its painters are long because a rasterizer step is
// long. What is left is the handful of rules that catch a real defect javac and
// Error Prone both miss -- an unclosed resource above all, this being a toolkit
// that owns native memory through wrappers closed exactly once (ADR-0043).
//
// Main sources only. A test that swallows an exception on purpose is usually
// saying so.
// ============================================================================
pmd {
    toolVersion = '7.19.0'
    ruleSetFiles = files(rootProject.file('config/pmd/ruleset.xml'))
    // Otherwise PMD runs its own default set *as well as* the one above.
    ruleSets = []
    consoleOutput = true
    // The point of triaging the ruleset is that everything left in it is worth
    // failing for.
    ignoreFailures = false
}

// Main sources only. A test that swallows an exception or builds a string in a
// loop is usually saying so on purpose, and a gate that argues with it is one
// people learn to silence.
tasks.matching { it.name in ['pmdTest', 'pmdTestFixtures'] }.configureEach {
    enabled = false
}

// ============================================================================
// Coverage (docs/testing.md §3)
//
// Per module, aggregated at the root. The interesting rule is the *merge*: the
// suite runs twice -- once binding reflectively, which is what a jar does, and
// once over woven classes, which is what a native image does (ADR-0155) -- and
// a line is uncovered only if NEITHER mode reached it. JaCoCo appends to one
// exec file across both tasks, so that merge costs nothing and happens by
// construction.
//
// No global percentage gate. `jacocoTestCoverageVerification` is configured per
// module by the module that knows what its own floor means: strict on the logic
// modules, where a line is either exercised or it is not, and absent on the
// painters, where the goldens carry correctness and line coverage would only
// prove reachability (testing.md §0.2).
// ============================================================================
jacoco {
    toolVersion = catalog.findVersion('jacoco').get().requiredVersion
}

// Which binding mode this invocation runs in -- the property the weaver reads
// (ADR-0155). A jar binds `@Bind` reflectively; a native image runs over woven
// classes. testing.md §0.3 calls both first-class and §3 asks for one report
// across them.
def bindingMode = providers.gradleProperty('goldberry.nativeImage')
        .map { it.isEmpty() || Boolean.parseBoolean(it) }
        .getOrElse(false) ? 'woven' : 'reflective'

tasks.withType(Test).configureEach {
    // Benchmarks print numbers; counting their lines as covered would be a
    // coverage figure that goes up when somebody adds a benchmark.
    jacoco.enabled = name != 'benchmark'

    // A file per mode, so the second run does not overwrite the first. This is
    // the whole mechanism behind §3's "a line is uncovered only if NEITHER mode
    // reached it": two invocations leave two exec files and the report reads
    // both. One invocation leaves one, and the report is still correct -- it
    // simply describes one mode.
    jacoco.destinationFile = layout.buildDirectory
            .file("jacoco/${name}-${bindingMode}.exec").get().asFile
}

// Both the report and the gate read every exec file, not the one this invocation
// happened to write. `JacocoReportBase` is the type they share.
tasks.withType(JacocoReportBase).configureEach {
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')) {
        include '**/*.exec'
    })
}

// The gate runs with `check`, and passes trivially in a module that declares no
// rules -- which is the design §3 asks for ("no single global number"), so a
// floor exists only where a module has said what its own means.
tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.withType(JacocoReport).configureEach {
    reports {
        // XML for the aggregate and for anything that imports it; HTML because
        // the question "which branch is missed" is not answerable from a number.
        xml.required = true
        html.required = true
    }
}

// ============================================================================
// SpotBugs (docs/testing.md §2, the second half of "blocking after triage")
//
// It reads bytecode where PMD reads source, which is why running both is not
// duplication: SpotBugs sees what the compiler produced -- a null path through a
// branch nobody wrote, a stream never closed on the exceptional route -- and PMD
// sees what a person typed.
//
// `main` only, and reports rather than gates while the findings are triaged.
// ============================================================================
spotbugs {
    toolVersion = catalog.findVersion('spotbugs').get().requiredVersion
    // `max` effort, `default` threshold: this runs nightly-ish rather than on
    // every keystroke, so the time is worth spending, and the low-confidence
    // tier is noise on a codebase this size.
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('DEFAULT')
    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')

    // **Reports, does not gate.** testing.md §2 puts SpotBugs in the "blocking
    // after triage" tier, and the triage has not happened: :core alone has 36
    // NP_NULL_ON_SOME_PATH_FROM_RETURN_VALUE, which is the same defect class
    // NullAway blocks on in a marked package and simply cannot see in the 60
    // that are not yet marked. Turning it into a gate before anybody has read
    // those would be a red build nobody caused.
    //
    // The report is the deliverable until then: `build/reports/spotbugs/main.html`
    // per module, and an artifact on the nightly lane.
    ignoreFailures = true
}

tasks.matching { it.name in ['spotbugsTest', 'spotbugsTestFixtures'] }.configureEach {
    enabled = false
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

// ============================================================================
// Mutation testing (docs/testing.md §3)
//
// PIT answers the question coverage cannot: a line that ran is not a line that
// was *checked*. It changes the code -- flips a comparison, drops a call,
// returns a different constant -- and reports which mutants the suite still
// passes with. Every survivor is a line the tests execute and assert nothing
// about, which is precisely the failure mode a golden-heavy suite develops:
// paint the frame, compare the picture, and never notice that the branch above
// it can never be false.
//
// **Run through PIT's own command line, not `gradle-pitest-plugin`.** The plugin
// is at 1.15.0, its newest release, and it reads `reporting.baseDir` -- which
// Gradle 9 removed, so applying it fails the build outright. The CLI is what the
// plugin wraps, this task hands it the same three things it would have (the
// classes, the tests, the classpath), and it is twenty lines rather than a
// dependency that has to catch up.
//
// **Not wired into `check`.** It compiles and runs the suite once per mutant, so
// it is minutes rather than seconds; §3 puts it on the nightly lane. Run it by
// name: `./gradlew :core:pitest`.
//
// The target classes are the logic packages, and naming them is the point:
// mutating a painter tells you the goldens caught it, which the goldens already
// said.
// ============================================================================
configurations {
    pitest {
        canBeConsumed = false
        canBeResolved = true
        description = 'PIT\'s command line and its JUnit 5 plugin.'
    }
}

dependencies {
    pitest "org.pitest:pitest-command-line:${catalog.findVersion('pitest').get().requiredVersion}"
    pitest 'org.pitest:pitest-junit5-plugin:1.2.3'
}

tasks.register('pitest', JavaExec) {
    group = 'verification'
    description = 'Mutation-tests the logic packages and reports which mutants survived.'

    dependsOn tasks.named('testClasses'), tasks.named('jar')
    mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'
    // PIT's own classpath, plus everything the tests run against.
    classpath = configurations.pitest + sourceSets.test.runtimeClasspath

    def out = layout.buildDirectory.dir('reports/pitest')
    outputs.dir(out)

    argumentProviders.add({ ->
        [
            '--reportDir', out.get().asFile.absolutePath,
            '--sourceDirs', sourceSets.main.java.srcDirs.join(','),
            '--targetClasses', [
                'io.github.digitalsmile.goldberry.css.*',
                'io.github.digitalsmile.goldberry.kdl.*',
                'io.github.digitalsmile.goldberry.bind.*',
                'io.github.digitalsmile.goldberry.text.*',
                'io.github.digitalsmile.goldberry.widgets.data.*',
                // No `weaver.*`: :weaver is a build-time tool on plain `java`
                // rather than these conventions (ADR-0125), so it has no pitest
                // task for the entry to reach. testing.md §3 wants it covered and
                // it is -- by `check`, like everything else; what it does not get
                // is mutation testing, which would need this plugin applied to a
                // module that deliberately avoids it.
            ].join(','),
            '--targetTests', 'io.github.digitalsmile.goldberry.*',
            // **Only `src/main` is mutable.** Tests live in the same packages as
            // the code they test, so `--targetClasses` matches them too and PIT
            // will happily mutate the assertions -- a mutated test survives by
            // construction, nothing being there to check the checker, and the
            // score it produces is meaningless. :core read 18% for exactly that
            // reason, almost all of it test code.
            //
            // By output directory rather than by name, because the names do not
            // separate cleanly: `*Test` misses `CssParserTest$Declarations` and
            // `*Test*` would exclude `HitTest`, which is real code with real
            // coverage to measure.
            // Both the classes directory and the jar: `modularity.inferModulePath`
            // puts this module on the test path as a *jar*, so the class's code
            // source is the archive and a classes-directory entry alone matches
            // nothing -- which PIT reports as "0 mutation test units", not as a
            // misconfiguration.
            '--mutableCodePaths',
            (sourceSets.main.output.classesDirs.files
                    + [tasks.jar.archiveFile.get().asFile]).join(','),
            // Benchmarks are excluded from the suite everywhere else, and here it
            // matters more: PIT would run them once per mutant.
            '--excludedTestClasses', '*Benchmark*',
            '--testPlugin', 'junit5',
            // PIT forks a "minion" JVM per run and it inherits nothing from the
            // `test` task -- not its JVM arguments and not its system
            // properties. Both matter here: without the first, every test that
            // touches Blend2D, HarfBuzz or Yoga dies on a restricted native
            // call; without the second, `goldberry.native.library` is unset and
            // there is no rasterizer to find. The symptom either way is
            // `Coverage generation minion exited abnormally (UNKNOWN_ERROR)`,
            // which says nothing about which.
            '--jvmArgs', (['--enable-native-access=ALL-UNNAMED']
                    + tasks.test.systemProperties.collect { k, v -> "-D${k}=${v}" }).join(','),
            '--outputFormats', 'HTML,XML',
            // Reported, not gated. A mutation score is a number to read and argue
            // about -- the footing ADR-0028 and ADR-0031 put their measurements
            // on -- and a threshold on a nightly job breaks while nobody looks.
            '--failWhenNoMutations', 'false',
            '--timestampedReports', 'false',
            '--threads', String.valueOf(Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))),
        ]
    } as CommandLineArgumentProvider)
}

// ============================================================================
// Blessing the goldens (docs/testing.md §1.3, §5)
//
// `GoldenImage` already rewrites its references under a system property; this is
// the task that says so out loud, because a workflow documented only in a
// Javadoc is one every contributor rediscovers.
//
// It runs the WHOLE suite rather than a filtered set. Goldens are asserted from
// classes named `*GoldenTest` and from several that are not -- a screen test that
// ends in a picture, a motion test that ends in three -- and a filter that had to
// list them would be a list that goes stale the first time somebody adds one. The
// non-golden tests simply run and pass, which costs a minute and cannot be wrong.
//
// It is deliberately NOT wired into `check`: rewriting a reference is a review
// step, and a build that quietly re-blessed on every run would assert nothing at
// all.
// ============================================================================
tasks.register('blessGoldens', Test) {
    group = 'verification'
    description = 'Rewrites this module\'s golden images from what the code currently draws.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    systemProperty 'goldberry.golden.update', 'true'
    // The scale sweep compares a golden against itself at 2x and 1.5x. It has
    // nothing to say while the references are being rewritten, and it is slow
    // enough to be worth skipping (ADR-0162).
    systemProperty 'goldberry.golden.scales', 'false'

    // A blessed golden is a *file*, so the answer is never up to date.
    outputs.upToDateWhen { false }
}

// Apache-2.0 §4(a) and §4(d): a redistributor must receive the licence, and the
// NOTICE file if one exists. Putting both in META-INF means every consumer of a
// Goldberry jar has them whether or not they ever see the repository.
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { into 'META-INF' }
    from(rootProject.file('NOTICE')) { into 'META-INF' }
    from(rootProject.file('THIRD-PARTY-NOTICES.md')) { into 'META-INF' }
    from(rootProject.file('licenses')) { into 'META-INF/licenses' }
}
