plugins {
    id 'groovy-gradle-plugin'
}

java {
    // The same toolchain the toolkit itself uses, read from the version catalog
    // so there is one place to change it. Declared explicitly rather than left
    // to the Gradle daemon's JVM, so the convention plugin compiles identically
    // whatever JDK happens to be running the build.
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get() as int)
    }
}

// `ToolResolver` is ordinary Java rather than a closure in `natives/build.gradle`
// for the same reason `:assets` is a module and not a script: locating a build
// tool across three platforms is real logic, and the bug it fixes is one nobody
// reproduces by reading (ADR-0040).
dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()

    // `LinuxDependenciesTest` reads `.github/workflows` to assert the dependency
    // table and CI still say the same thing. This build is included, so `rootDir`
    // is `build-logic/` -- the repository is one level up. Handed over explicitly
    // rather than derived from the working directory, which differs between
    // Gradle and an IDE run (ADR-0082).
    systemProperty 'goldberry.repoRoot', rootDir.parentFile.absolutePath
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
