pluginManagement {
    includeBuild 'build-logic'
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'goldberry'

// Module map
// https://goldberry.dev/docs/contributing/repository.html#the-modules
//   :common   what both halves need and neither owns -- logging, the start-up
//             timeline. The lowest module: it requires nothing of Goldberry's,
//             which is what lets :natives and :core both use it
//   :natives  FFM bindings + the CMake superbuild that produces libgoldberry
//   :core     widgets, style, layout, text, paint, backend SPI
//   :widgets  the widget catalog, charts included
//   :gpu      canvas3d and the GPU composition path
//
//   :bom      goldberry-bom, a java-platform pinning every published artifact
//   :toolkit  `goldberry`, the umbrella: no code, the required modules as
//             dependencies and the optional ones (:html, :gpu) listed as
//             <optional>
//
// :assets is a build-time tool, not a published module: it fetches the pinned
// fonts and icon set and prepares them into resources :core packages. It is
// ordinary Java rather than build-script code because compiling 1870 SVGs into
// path data is real logic that deserves real tests.
//
// :emoji is the Noto Color Emoji face and nothing else. It is its own artifact
// because it is 5 MB of paint graphs that an application which never draws an
// emoji should not carry; it became one when the face was OpenMoji, whose CC
// BY-SA asked for credit on screen. The face reaches :core through an
// `EmojiFont` service.
//
// :html is the first of the optional content modules, each of which brings its
// own natives. Markdown is what it ships today -- md4c, through the four
// `goldberry_md_*` symbols on the export list -- and `html-view` is not built:
// litehtml needs a paint surface the export list does not have yet, and
// `book/src/TODO.md` says which symbols. An application opts in; nothing in
// :core or :widgets depends on it.
//
// :media is `goldberry-media`: audio and video over FFmpeg driven from Java,
// https://goldberry.dev/docs/components/media.html#the-module. It is the one module
// besides :natives that binds a native library itself, and its libraries are
// FFmpeg's own shared objects rather than libgoldberry, built by a superbuild of
// its own in media/src/main/cmake. The operating system's own decoders --
// VideoToolbox and AudioToolbox, GStreamer, Media Foundation -- are part of it
// too, behind the same Decoder SPI.
//
// :example is the showcase. It is a subproject rather than a separate build so
// that Gradle and every IDE see it. It is not published either.
// :weaver is a build-time tool too, and the same kind of thing :assets is: it
// runs over compiled classes and never ships. Two halves: it collects a module's
// @Markup widgets into a WidgetCatalog and declares it, which every build needs
// because nothing finds annotated classes at run time; and it rewires
// a model's @Bind fields into bindings and writes the @Action call sites, which
// only a GraalVM native image needs -- an ordinary jar binds the same annotations
// reflectively, so weaving a jar buys a direct field write and costs every
// consumer a build step.
// https://goldberry.dev/docs/weaving.html#the-two-halves
include ':common',
        ':natives',
        ':core',
        ':widgets',
        ':html',
        ':media',
        ':emoji',
        ':gpu',
        ':bom',
        ':toolkit',
        ':assets',
        ':weaver',
        ':example'
