pluginManagement {
    includeBuild 'build-logic'
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'goldberry'

// Module map -- see docs/ARCHITECTURE.md §15.
//   :natives  FFM bindings + the CMake superbuild that produces libgoldberry
//   :core     widgets, style, layout, text, paint, backend SPI
//   :widgets  the widget catalog, charts included (ADR-0014)
//   :gpu      canvas3d and the GPU composition path
//
// :assets is a build-time tool, not a published module: it fetches the pinned
// fonts and icon set and prepares them into resources :core packages. It is
// ordinary Java rather than build-script code because compiling 1544 SVGs into
// path data is real logic that deserves real tests (ADR-0033).
//
// :example is the showcase. It is a subproject rather than a separate build so
// that Gradle and every IDE see it -- see ADR-0023, which supersedes ADR-0021.
// It is not published either.
// :weaver is a build-time tool too, and the same kind of thing :assets is: it
// runs over compiled classes and never ships. It rewires a model's @Bind fields
// into bindings and writes the @Action call sites, with the JDK's class-file API
// -- at build time, so nothing is generated or reflected at run time and the
// result survives a closed-world native image (ADR-0125, ADR-0126, ADR-0127).
include ':natives',
        ':core',
        ':widgets',
        ':gpu',
        ':assets',
        ':weaver',
        ':example'
