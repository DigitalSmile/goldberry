# Linux CI (ADR-0012)
#
# The natives job builds inside a manylinux_2_28 container. That container IS the
# glibc floor: it pins 2.28 (the RHEL 8 baseline) while providing a modern GCC.
# A library built outside it links against the host's newer glibc and is not
# publishable.
#
# CI invokes CMake directly rather than through Gradle, because the manylinux
# image has no JDK and putting one there would buy nothing. Gradle drives CMake
# for local development. ADR-0012 records that this means the CMake arguments
# live in two places.
#
# `workflow_call` is what lets release.yml reuse this without duplicating it.
#
# STATUS: the natives jobs pass on x64 and aarch64. The dependency list below is
# where this workflow keeps breaking: SDL treats several X11 extensions as hard
# dependencies and stops the configure at the first one it cannot find, so each
# missing package hides the next. Reproduce a change to it in the container
# rather than in CI:
#
#   docker run --rm -v "$PWD:/src:ro" -w /tmp quay.io/pypa/manylinux_2_28_x86_64 \
#     bash -c 'dnf install -y <list> && /opt/python/cp312-cp312/bin/pip install cmake ninja \
#       && PATH=/opt/python/cp312-cp312/bin:$PATH cmake -S /src/natives/src/main/cmake \
#          -B /tmp/b -G Ninja -DGOLDBERRY_TARGET_ID=linux-x64'
#
# The verify jobs failed on the first run and were reworked; see ADR-0016.

name: Linux

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:

# Upstream refs are deliberately absent. The superbuild reads them straight out
# of gradle/libs.versions.toml, which is the only place any of them is written
# down (ADR-0035). They used to be duplicated here because the manylinux
# container has no JDK -- but reading the catalog never needed a JDK, only
# something that can parse a text file, and CMake can.

jobs:
  # Java only. Fast feedback that needs no native toolchain at all -- which is
  # the point of keeping the native tasks out of `./gradlew build`.
  java:
    name: Java
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build checkLicenses -Pgoldberry.skipNative=true --no-daemon

  natives:
    name: libgoldberry (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          # AlmaLinux 8's cmake is older than the 3.28 the superbuild requires,
          # so cmake and ninja come from pip instead of dnf. Meson is no longer
          # needed: libxkbcommon was the only meson-built dependency and it is
          # gone (ADR-0055).
          dnf install -y \
            libxml2-devel wayland-devel wayland-protocols-devel \
            libX11-devel libxcb-devel libXext-devel libXrandr-devel \
            libXcursor-devel libXi-devel libXfixes-devel libXtst-devel \
            libXScrnSaver-devel libxkbcommon-devel libxkbfile-devel \
            alsa-lib-devel pulseaudio-libs-devel
          # libXtst-devel and libXScrnSaver-devel are hard dependencies of SDL's
          # X11 driver, not optional ones: CheckX11 stops the configure with
          # "Couldn't find dependency package for XTEST" / "... for XSCRNSAVER"
          # rather than skipping either. They come in that order, so adding the
          # first only moved the failure one line down -- which is what happened.
          #
          # RHEL names them differently from Debian: `libXScrnSaver-devel` is
          # `libxss-dev` on the Ubuntu runners in example.yml and showcase.yml,
          # and grepping this file for the name that failed there finds nothing.
          #
          # Kept on rather than -DSDL_X11_XTEST=OFF / -DSDL_X11_XSCRNSAVER=OFF:
          # XTEST is what SDL warps the pointer with, and XScrnSaver is how it
          # keeps a screensaver off a window that is playing something.
          /opt/python/cp312-cp312/bin/pip install --upgrade cmake ninja
          echo /opt/python/cp312-cp312/bin >> $GITHUB_PATH

      - name: Configure
        run: |
          cmake -S natives/src/main/cmake -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/build/install \
            -DGOLDBERRY_TARGET_ID=${{ matrix.target }}

      - name: Build
        run: cmake --build build/native --target install

      - name: Check the glibc floor
        run: |
          # The whole reason for the container. Anything above 2.28 here means
          # the artifact is not portable and the container is not doing its job.
          objdump -T build/install/lib/libgoldberry.so \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: build/install/lib/libgoldberry.so
          if-no-files-found: error

  # Building an artifact is not the same as testing it. This is where the
  # hand-written struct layouts are actually checked against a compiled
  # libgoldberry -- the one downloaded from the natives job, which for Linux is
  # the manylinux-built binary that ships. These runners have no C/C++ toolchain
  # and must not acquire one: handing Gradle a library with
  # `goldberry.native.library` is also what tells it not to build a rival one.
  #
  # `goldberry.native.required=true` is not decoration. LayoutVerificationTest
  # skips when no library is loadable, and a verify job that skipped every test
  # is a green tick over an artifact nothing opened. See ADR-0016.
  verify:
    name: Verify layouts (${{ matrix.target }})
    needs: natives
    # A matrix job fails if any leg does, so without this one broken target
    # skips verification of every other target's library -- including ones that
    # built fine. A leg whose artifact really is missing fails at the download
    # step, loudly, which is what ADR-0016 asks for.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-lib
      - run: |
          ./gradlew :natives:test --no-daemon \
            -Dgoldberry.native.library="$PWD/native-lib/libgoldberry.so" \
            -Dgoldberry.native.required=true

      # The whole `:core` suite against the real library, not just the golden
      # images. Everything that needs a rasterizer skips in the `java` job by
      # design -- it builds no native library -- so this is the only place those
      # tests run at all: the frame loop, pointer plumbing, damage, text metrics
      # and the golden images together.
      #
      # No display, no compositor, no Xvfb: Frame paints into memory, so it is
      # the same check on every platform. The point of running it on all three is
      # that Blend2D JITs its pipelines per CPU -- if AVX2 and NEON ever disagree
      # by more than a rounding step, this is where it surfaces.
      - name: Core tests and golden images
        run: |
          ./gradlew :core:test --no-daemon \
            -Dgoldberry.native.library="$PWD/native-lib/libgoldberry.so" \
            -Dgoldberry.native.required=true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures-${{ matrix.target }}
          path: core/build/golden-failures
          if-no-files-found: ignore

