# Linux CI (ADR-0012)
#
# The natives job builds inside a manylinux_2_28 container. That container IS the
# glibc floor: it pins 2.28 (the RHEL 8 baseline) while providing a modern GCC.
# A library built outside it links against the host's newer glibc and is not
# publishable.
#
# CI invokes CMake directly rather than through Gradle, because the manylinux
# image has no JDK and putting one there would buy nothing. Gradle drives CMake
# for local development. ADR-0012 records that this means the CMake arguments
# live in two places.
#
# `workflow_call` is what lets release.yml reuse this without duplicating it.
#
# STATUS: never run. The dependency list below in particular will need tuning on
# the first execution -- SDL3 and libxkbcommon each need a spread of X11/Wayland
# development headers the manylinux image does not ship.

name: Linux

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  # Keep in step with gradle/libs.versions.toml.
  BLEND2D_REF: master
  YOGA_REF: v3.1.0
  HARFBUZZ_REF: 8.5.0
  SDL3_REF: release-3.2.0
  XKBCOMMON_REF: xkbcommon-1.6.0

jobs:
  # Java only. Fast feedback that needs no native toolchain at all -- which is
  # the point of keeping the native tasks out of `./gradlew build`.
  java:
    name: Java
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build checkLicenses --no-daemon

  natives:
    name: libgoldberry (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          # AlmaLinux 8's cmake is older than the 3.28 the superbuild requires,
          # so cmake/ninja/meson come from pip instead of dnf.
          dnf install -y \
            libxml2-devel wayland-devel wayland-protocols-devel \
            libX11-devel libxcb-devel libXext-devel libXrandr-devel \
            libXcursor-devel libXi-devel libXfixes-devel \
            alsa-lib-devel pulseaudio-libs-devel
          /opt/python/cp312-cp312/bin/pip install --upgrade cmake ninja meson
          echo /opt/python/cp312-cp312/bin >> $GITHUB_PATH

      - name: Configure
        run: |
          cmake -S natives/src/main/cmake -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/build/install \
            -DGOLDBERRY_TARGET_ID=${{ matrix.target }} \
            -DGOLDBERRY_BLEND2D_REF=$BLEND2D_REF \
            -DGOLDBERRY_YOGA_REF=$YOGA_REF \
            -DGOLDBERRY_HARFBUZZ_REF=$HARFBUZZ_REF \
            -DGOLDBERRY_SDL3_REF=$SDL3_REF \
            -DGOLDBERRY_XKBCOMMON_REF=$XKBCOMMON_REF

      - name: Build
        run: cmake --build build/native --target install

      - name: Check the glibc floor
        run: |
          # The whole reason for the container. Anything above 2.28 here means
          # the artifact is not portable and the container is not doing its job.
          objdump -T build/install/lib/libgoldberry.so \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: build/install/lib/libgoldberry.so
          if-no-files-found: error

  # Building an artifact is not the same as testing it. LayoutVerificationTest
  # skips without a native library, so this is where the hand-written struct
  # layouts are actually checked against a compiled libgoldberry.
  verify:
    name: Verify layouts (${{ matrix.target }})
    needs: natives
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-lib
      - run: |
          ./gradlew :natives:test --no-daemon \
            -Dgoldberry.native.library="$PWD/native-lib/libgoldberry.so"
