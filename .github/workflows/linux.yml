# Linux CI
# https://goldberry.dev/docs/contributing/testing.html#the-ci-matrix
#
# The natives job builds inside a manylinux_2_28 container. That container IS the
# glibc floor: it pins 2.28 (the RHEL 8 baseline) while providing a modern GCC.
# A library built outside it links against the host's newer glibc and is not
# publishable.
#
# CI invokes CMake directly rather than through Gradle, because the manylinux
# image has no JDK and putting one there would buy nothing. Gradle drives CMake
# for local development, which means the CMake arguments live in two places.
#
# `workflow_call` is what lets publish.yml reuse this without duplicating it --
# and on a push to master that is the only way this runs. There is no `push`
# trigger: snapshot.yml calls this workflow on every push and publishes the
# library it built, so a trigger here would build every native library twice per
# commit and publish neither. Pull requests still run it directly.
#
# STATUS: the natives jobs pass on x64 and aarch64. The dependency list below is
# where this workflow keeps breaking: SDL treats several X11 extensions as hard
# dependencies and stops the configure at the first one it cannot find, so each
# missing package hides the next. Reproduce a change to it in the container
# rather than in CI:
#
#   docker run --rm -v "$PWD:/src:ro" -w /tmp quay.io/pypa/manylinux_2_28_x86_64 \
#     bash -c 'dnf install -y <list> && /opt/python/cp312-cp312/bin/pip install cmake ninja \
#       && PATH=/opt/python/cp312-cp312/bin:$PATH cmake -S /src/natives/src/main/cmake \
#          -B /tmp/b -G Ninja -DGOLDBERRY_TARGET_ID=linux-x64'
#
# The verify jobs failed on the first run and were reworked: they now download
# the library the natives job built and refuse to skip a test for want of it.

name: Linux

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Upstream refs are deliberately absent. The superbuild reads them straight out
# of gradle/libs.versions.toml, which is the only place any of them is written
# down. They used to be duplicated here because the manylinux
# container has no JDK -- but reading the catalog never needed a JDK, only
# something that can parse a text file, and CMake can.

jobs:
  # Java only. Fast feedback that needs no native toolchain at all -- which is
  # the point of keeping the native tasks out of `./gradlew build`.
  java:
    name: Java
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build checkLicenses checkMarkdown -Pgoldberry.skipNative=true --no-daemon

      # The suite runs in BOTH binding modes on every PR.
      # https://goldberry.dev/docs/contributing/testing.html#what-check-runs
      #
      # The one above binds `@Bind` reflectively, which is what a jar does. This
      # one runs over woven classes, which is what a native image does.
      # They are two different code paths through the same tests and
      # a defect in either is invisible from the other -- the woven path writes
      # a field directly where the reflective one goes through a handle.
      #
      # A second invocation rather than a second task, because weaving rewrites
      # the compiled classes in place: one build cannot hold both forms.
      # Coverage survives it, because the exec file is named for the mode and the
      # report reads every file it finds, so the two modes are merged.
      - name: The suite again, woven
        run: |
          ./gradlew test -Pgoldberry.skipNative=true -Pgoldberry.nativeImage=true \
            --no-daemon

      # One report over both modes: a line is uncovered only if NEITHER reached
      # it. Uploaded rather than gated in CI -- the gate is
      # `jacocoTestCoverageVerification`, which `build` above already ran.
      - name: Aggregate coverage
        run: ./gradlew testCodeCoverageReport -Pgoldberry.skipNative=true --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: build/reports/jacoco/testCodeCoverageReport
          if-no-files-found: ignore

      # PR diff coverage. Guarded on the secret existing, so
      # the lane is silent until somebody connects Codecov rather than red on
      # every pull request until then.
      # https://goldberry.dev/docs/contributing/testing.html#advisory-dashboards
      #
      # `fail_ci_if_error: false` on purpose: coverage reporting is a dashboard,
      # and an upload that failed because a third party was down is not a reason
      # to block a merge.
      - name: Upload coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
          flags: jvm
          fail_ci_if_error: false

  natives:
    name: libgoldberry (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          # AlmaLinux 8's cmake is older than the 3.28 the superbuild requires,
          # so cmake and ninja come from pip instead of dnf. Meson is no longer
          # needed: libxkbcommon was the only meson-built dependency and it is
          # gone, since SDL owns keyboard translation.
          #
          # Tried three times: a mirror caught mid-sync answers 404 for the
          # repodata its own index names, and dnf gives up once every mirror on
          # the list has been asked. Fresh metadata a little later finds one that
          # has finished.
          for attempt in 1 2 3; do
            dnf install -y \
              libxml2-devel wayland-devel wayland-protocols-devel \
              libX11-devel libxcb-devel libXext-devel libXrandr-devel \
              libXcursor-devel libXi-devel libXfixes-devel libXtst-devel \
              libXScrnSaver-devel libxkbcommon-devel libxkbfile-devel \
              alsa-lib-devel pulseaudio-libs-devel \
              dbus-devel systemd-devel ibus-devel \
              && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "::warning::dnf install failed, attempt $attempt of 3; fresh metadata in 30 s"
            dnf clean metadata
            sleep 30
          done
          # dbus-devel, systemd-devel and ibus-devel are the three this list was
          # missing, and the reason the published libgoldberry could not ask the
          # desktop whether it was set to dark.
          # https://goldberry.dev/docs/contributing/building.html#linux
          #
          # None of them is a build failure in SDL's own terms: SDL treats all
          # three as "use it if the headers are here", compiles the feature out
          # when they are not, and says nothing. What is affected is not niche --
          # SDL_GetSystemTheme, the XDG portal file dialog, the screensaver
          # inhibit, the input method on X11, device hotplug -- and none of it can
          # be fixed after the fact, because the library is distributed inside the
          # application.
          #
          # systemd-devel is where RHEL keeps libudev's headers; on the Ubuntu
          # runner in showcase.yml the same thing is libudev-dev.
          # The superbuild now stops rather than building a library without D-Bus
          # (-DGOLDBERRY_REQUIRE_PLATFORM_INTEGRATION), so a future container that
          # drops one of these fails here loudly instead of publishing quietly.
          #
          # libXtst-devel and libXScrnSaver-devel are hard dependencies of SDL's
          # X11 driver, not optional ones: CheckX11 stops the configure with
          # "Couldn't find dependency package for XTEST" / "... for XSCRNSAVER"
          # rather than skipping either. They come in that order, so adding the
          # first only moved the failure one line down -- which is what happened.
          #
          # RHEL names them differently from Debian: `libXScrnSaver-devel` is
          # `libxss-dev` on the Ubuntu runner in showcase.yml,
          # and grepping this file for the name that failed there finds nothing.
          #
          # Kept on rather than -DSDL_X11_XTEST=OFF / -DSDL_X11_XSCRNSAVER=OFF:
          # XTEST is what SDL warps the pointer with, and XScrnSaver is how it
          # keeps a screensaver off a window that is playing something.
          /opt/python/cp312-cp312/bin/pip install --upgrade cmake ninja
          echo /opt/python/cp312-cp312/bin >> $GITHUB_PATH

      # No web view here. The engine's headers are WebKitGTK 4.1's, and this
      # image (AlmaLinux 8) does not have them: `dnf install webkit2gtk4.1-devel`
      # answered "No match" on every run, the configure printed "Goldberry web
      # view: OFF", and no published Linux jar had web-view. The `webview` job
      # below builds that one library on a system that has the headers.

      - name: Configure
        run: |
          cmake -S natives/src/main/cmake -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/build/install \
            -DGOLDBERRY_TARGET_ID=${{ matrix.target }}

      - name: Build
        run: cmake --build build/native --target install

      - name: Check the glibc floor
        run: |
          # The whole reason for the container. Anything above 2.28 here means
          # the artifact is not portable and the container is not doing its job.
          objdump -T build/install/lib/libgoldberry.so \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: build/install/lib/libgoldberry.so
          if-no-files-found: error

  # libgoldberry-webview, the engine behind `web-view`, built on its own.
  #
  # Not in the manylinux container above, which has no WebKitGTK 4.1 headers.
  # Ubuntu 22.04 is the oldest mainstream release that has them, so its glibc
  # sets this library's floor (GLIBC 2.34, GLIBCXX 3.4.21 as built) -- not
  # libgoldberry's, which stays 2.28. That costs nothing real: the library links
  # WebKitGTK 4.1 dynamically, and any system with `libwebkit2gtk-4.1.so.0` is
  # newer than that floor anyway. HEADERS only; no WebKit is compiled, vendored
  # or shipped.
  #
  # The whole superbuild configures, because the shim's CMake lives in it and
  # pins the same webview release, but only the one target is built. Its
  # artifact is `webview-<target>`, not `native-<target>`: publish.yml and the
  # verify job below put it beside libgoldberry.so.
  #
  # Required, not optional. A Linux natives jar without the web view is the
  # defect this job exists to end.
  webview:
    name: libgoldberry-webview (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4

      # The same packages showcase.yml installs for the whole superbuild, since
      # SDL's configure runs too, and Python's cmake and ninja: 22.04's cmake is
      # older than the 3.28 the superbuild requires.
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config python3-pip binutils \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libxkbcommon-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev libibus-1.0-dev \
            libwebkit2gtk-4.1-dev
          pip3 install cmake ninja

      - name: Configure
        run: |
          set -o pipefail
          cmake -S natives/src/main/cmake -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOLDBERRY_TARGET_ID=${{ matrix.target }} \
            | tee configure.log
          grep -q "Goldberry web view: ON" configure.log \
            || { echo "::error::the configure did not enable the web view"; exit 1; }

      - name: Build
        run: cmake --build build/native --target goldberry-webview

      # What it exports, what it links and the floor it sets, said in the log
      # the way the glibc floor is for libgoldberry.
      - name: Check the web view library
        run: |
          lib=build/native/libgoldberry-webview.so
          nm -D --defined-only "$lib" | grep -q ' goldberry_webview_create$' \
            || { echo "::error::$lib does not export goldberry_webview_create"; exit 1; }
          objdump -p "$lib" | grep -q 'NEEDED.*libwebkit2gtk-4.1.so.0' \
            || { echo "::error::$lib does not link WebKitGTK 4.1"; exit 1; }
          objdump -p "$lib" | grep NEEDED
          objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          objdump -T "$lib" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: webview-${{ matrix.target }}
          path: build/native/libgoldberry-webview.so
          if-no-files-found: error

  # Building an artifact is not the same as testing it. This is where the
  # hand-written struct layouts are actually checked against a compiled
  # libgoldberry -- the one downloaded from the natives job, which for Linux is
  # the manylinux-built binary that ships. These runners have no C/C++ toolchain
  # and must not acquire one: handing Gradle a library with
  # `goldberry.native.library` is also what tells it not to build a rival one.
  #
  # `goldberry.native.required=true` is not decoration. LayoutVerificationTest
  # skips when no library is loadable, and a verify job that skipped every test
  # is a green tick over an artifact nothing opened.
  # https://goldberry.dev/docs/contributing/testing.html#with-and-without-the-library
  verify:
    name: Verify layouts (${{ matrix.target }})
    needs: [natives, webview]
    # A matrix job fails if any leg does, so without this one broken target
    # skips verification of every other target's library -- including ones that
    # built fine. A leg whose artifact really is missing fails at the download
    # step, loudly, which is the point: the check is never skipped.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-lib
      # Beside libgoldberry.so, where WebviewLibrary looks for it, as it sits in
      # the published jar.
      - uses: actions/download-artifact@v4
        with:
          name: webview-${{ matrix.target }}
          path: native-lib

      # WebKitGTK 4.1 itself, which the web view library links and a user's
      # desktop has. Without it the library does not load, and the test below
      # would be failing over the runner rather than over the artifact.
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0

      # `goldberry.webview.required`: WebviewBindingTest loads the web view
      # library, checks its ABI and binds every call, and fails rather than
      # skips if it cannot.
      - run: |
          ./gradlew :natives:test --no-daemon \
            -Dgoldberry.native.library="$PWD/native-lib/libgoldberry.so" \
            -Dgoldberry.native.required=true \
            -Dgoldberry.webview.required=true

      # The whole `:core`, `:widgets` and `:html` suites against the real library, not
      # just the golden images. Everything that needs a rasterizer skips in the
      # `java` job by design -- it builds no native library -- so this is the
      # only place those tests run at all: the frame loop, pointer plumbing,
      # damage, text metrics, and every golden image including the controls'.
      #
      # No display, no compositor, no Xvfb: Frame paints into memory, so it is
      # the same check on every platform. The point of running it on all three is
      # that Blend2D JITs its pipelines per CPU -- if AVX2 and NEON ever disagree
      # by more than a rounding step, this is where it surfaces.
      #
      # The coverage floors run here and not in the `java` job: they were measured
      # with the library loaded, and with `-Pgoldberry.skipNative` every test that
      # shapes or paints skips, which halves the figure. One leg is
      # enough -- coverage does not differ by CPU.
      - name: Core, widget, Markdown and emoji tests, and the golden images
        env:
          COVERAGE: ${{ matrix.target == 'linux-x64' && ':core:jacocoTestCoverageVerification :widgets:jacocoTestCoverageVerification :html:jacocoTestCoverageVerification :emoji:jacocoTestCoverageVerification' || '' }}
        run: |
          ./gradlew :core:test :widgets:test :html:test :emoji:test $COVERAGE --no-daemon \
            -Dgoldberry.native.library="$PWD/native-lib/libgoldberry.so" \
            -Dgoldberry.native.required=true

      # The GPU tests, on lavapipe: Mesa's software Vulkan, a conformant driver on
      # a runner with no GPU. SDL makes a
      # GPU device only under a video driver that can make a Vulkan surface, and
      # `offscreen` makes a headless one, so no display and no Xvfb are needed.
      # The loader is pointed at lavapipe alone, so a runner that ever grows a
      # real GPU still tests the same driver. `goldberry.gpu.required` turns a
      # missing device into a failure rather than a green tick over nothing.
      # https://goldberry.dev/docs/contributing/testing.html#the-gpu-tests
      #
      # Written before it could be run, and its first two runs (Snapshot 32 and
      # 33) failed at the ICD lookup: Mesa's packaging names the file
      # `lvp_icd.json` now, where older releases wrote `lvp_icd.<arch>.json`, and
      # the glob only knew the second. Both spellings are accepted.
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools

      - name: GPU tests on lavapipe
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd.json /usr/share/vulkan/icd.d/lvp_icd.*.json 2>/dev/null | head -n 1)
          test -n "$icd" || { echo "::error::no lavapipe ICD in /usr/share/vulkan/icd.d"; exit 1; }
          export VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd"
          vulkaninfo --summary
          ./gradlew :natives:gpuTest :gpu:gpuTest --no-daemon \
            -Dgoldberry.native.library="$PWD/native-lib/libgoldberry.so" \
            -Dgoldberry.native.required=true \
            -Dgoldberry.gpu.required=true \
            -Dgoldberry.gpu.videoDriver=offscreen

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-test-summary-${{ matrix.target }}
          path: |
            natives/build/gpu-test/summary.txt
            gpu/build/gpu-test/summary.txt
          if-no-files-found: ignore

      # The example's own tests -- its goldens, its gallery order, its screen
      # tests -- need a rasterizer too, and this is the only place they meet a
      # real library on every push: showcase.yml, which used to run them, builds
      # the native image on a release tag or by hand now. One leg is
      # enough, for the coverage floors' reason.
      - name: The example's tests, against the library
        if: matrix.target == 'linux-x64'
        run: |
          ./gradlew :example:build --no-daemon \
            -Dgoldberry.native.library="$PWD/native-lib/libgoldberry.so" \
            -Dgoldberry.native.required=true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures-${{ matrix.target }}
          path: |
            core/build/golden-failures
            widgets/build/golden-failures
            html/build/golden-failures
            emoji/build/golden-failures
            example/build/golden-failures
          if-no-files-found: ignore
