# The nightly lane — docs/testing.md §4.
#
# What belongs here is everything whose answer is a *number to read* rather than
# a gate to pass, and everything too slow to sit on a pull request. Neither kind
# should block a merge: a mutation score that dipped is a conversation, and a
# benchmark on a shared runner is noise as often as it is signal (ADR-0028,
# ADR-0031).
#
# Deliberately NOT here: the golden images, the unit suite and the static
# analysis. Those gate every PR in linux.yml, macos.yml and windows.yml, and a
# check that only runs at night is one nobody associates with the change that
# broke it.
name: Nightly

on:
  schedule:
    # 03:40 UTC. Off the hour, because everything scheduled on the hour queues
    # behind everything else scheduled on the hour.
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # §3: mutation testing catches "covered but unasserted", which is the failure
  # mode a golden-heavy suite develops -- paint the frame, compare the picture,
  # and never notice the branch above it can never be false.
  #
  # `continue-on-error`, because PIT currently completes on the modules whose
  # tests run on the classpath and its coverage minion dies on the ones that run
  # on the module path (docs/testing.md §6). The report that is produced is worth
  # having; the failure is known and tracked, and a red nightly nobody can fix
  # teaches people to ignore the whole lane.
  mutation:
    name: Mutation testing
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: PIT over the logic packages
        run: ./gradlew pitest -Pgoldberry.skipNative=true --no-daemon --continue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitest
          path: '**/build/reports/pitest'
          if-no-files-found: ignore

  # §1.5's frame budget. The benchmarks print measurements and assert almost
  # nothing on purpose, so this lane exists to keep a record rather than to fail:
  # the numbers are read in the log and argued about in prose.
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      # The native library, because every benchmark that shapes text or paints a
      # frame needs a rasterizer -- without it they skip quietly, which looks
      # exactly like passing.
      - name: Build libgoldberry
        run: ./gradlew :natives:cmakeBuild --no-daemon

      - name: Run the benchmarks
        run: ./gradlew benchmark --no-daemon --continue

  # §1.3's scale sweep, run wide. Every golden is redrawn at 2x and 1.5x on every
  # PR already; what this adds is the whole suite on one machine in one place, so
  # a scale-dependent regression has a single log to read rather than three.
  coverage:
    name: Coverage, both binding modes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Reflective
        run: ./gradlew test -Pgoldberry.skipNative=true --no-daemon

      - name: Woven
        run: ./gradlew test -Pgoldberry.skipNative=true -Pgoldberry.nativeImage=true --no-daemon

      # One report over both exec files: a line is uncovered only if neither mode
      # reached it (§3).
      - name: Aggregate
        run: ./gradlew testCodeCoverageReport -Pgoldberry.skipNative=true --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-nightly
          path: build/reports/jacoco/testCodeCoverageReport
          if-no-files-found: ignore
