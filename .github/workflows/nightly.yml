# The nightly lane
# https://goldberry.dev/docs/contributing/testing.html#the-ci-matrix
#
# What belongs here is everything whose answer is a *number to read* rather than
# a gate to pass, and everything too slow to sit on a pull request. Neither kind
# should block a merge: a mutation score that dipped is a conversation, and a
# benchmark on a shared runner is noise as often as it is signal.
#
# **Only when master has moved.** A scheduled run first asks for the commit the
# last nightly that did any work ran on, and if master is still there, every job
# below is skipped: the same commit measured twice is the same numbers, or two
# readings of a busy runner. A run started by hand always runs.
#
# Deliberately NOT here: the golden images, the unit suite and the static
# analysis. Those gate every PR in linux.yml, macos.yml and windows.yml, and a
# check that only runs at night is one nobody associates with the change that
# broke it.
#
# There was a third job here until the 2026-09-18 review (B5): a `coverage` job
# that ran the suite reflectively, ran it woven, and aggregated the report --
# which is what linux.yml's `java` job already does on every push, step for step.
# Its comment described a scale sweep it did not run and could not have, because
# `-Pgoldberry.skipNative=true` builds no rasterizer and every golden skips. A
# nightly copy of a per-PR gate is the thing the paragraph above says not to do.
name: Nightly

on:
  schedule:
    # 03:40 UTC. Off the hour, because everything scheduled on the hour queues
    # behind everything else scheduled on the hour.
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The commit the last scheduled nightly that did any work ran on: completed,
  # and neither skipped by this job nor cancelled. This run itself is still in
  # progress, so it is not its own answer.
  changes:
    name: Anything new since the last nightly
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?event=schedule&status=completed&per_page=30" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")
                   | select(.id != '"$GITHUB_RUN_ID"')][0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "::notice::master is still at ${GITHUB_SHA:0:12}, which the last nightly ran on; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "last nightly ran on ${last:-nothing}; master is at $GITHUB_SHA"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Mutation testing catches "covered but unasserted", which is the failure
  # mode a golden-heavy suite develops -- paint the frame, compare the picture,
  # and never notice the branch above it can never be false.
  #
  # No `continue-on-error`. It had one while PIT's minion was dying on JUnit 6 --
  # `pitest-junit5-plugin` 1.2.1 is built against JUnit Platform 1.9 and 1.2.3 is
  # the version that copes -- and now that it completes, a failure here is a real
  # one worth seeing.
  mutation:
    name: Mutation testing
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      # The same list as showcase.yml, and for the same reason: this job builds
      # libgoldberry through Gradle, so `checkToolchain` stops the build before
      # CMake runs if a required header is absent -- and that
      # includes D-Bus, IBus and udev. This step was missing, and every nightly
      # failed at "Build libgoldberry". LinuxDependenciesTest now holds this file
      # to the table along with showcase.yml.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols \
            libdecor-0-dev \
            libxkbcommon-dev xkb-data libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev \
            libwebkit2gtk-4.1-dev

      # The native library, not `-Pgoldberry.skipNative`: PIT re-runs the suite
      # once per mutant, and a test that skips for want of a rasterizer kills
      # nothing. Skipping it would report a mutation score for a suite that
      # barely ran.
      - name: Build libgoldberry
        run: ./gradlew :natives:cmakeBuild --no-daemon

      - name: PIT over the logic packages
        run: ./gradlew pitest --no-daemon --continue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitest
          path: '**/build/reports/pitest'
          if-no-files-found: ignore

      # SpotBugs reports rather than gates, so the artifact
      # is the deliverable: 146 findings across the project at the time of
      # writing, most of them nullness in packages NullAway cannot see yet.
      - name: SpotBugs
        run: ./gradlew spotbugsMain --no-daemon --continue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs
          path: '**/build/reports/spotbugs'
          if-no-files-found: ignore

  # The benchmark lane, which is a workflow of its own so a person can start it
  # by hand, narrowed to one benchmark if they like. It prints measurements and
  # asserts almost nothing, so it exists to keep a record rather than to fail.
  benchmarks:
    name: Benchmarks
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/benchmarks.yml
