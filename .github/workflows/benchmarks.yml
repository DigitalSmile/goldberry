# The benchmark lane
# https://goldberry.dev/docs/performance/measuring.html#the-benchmark-lane
#
# Every measurement this repository keeps: the JUnit benchmarks under each
# module's src/benchmark/java, and JMH on :core. They print what something costs
# and assert almost nothing, so they gate nothing -- no pull request, no push and
# no snapshot runs them. Nightly calls this workflow when master has moved, and a
# person starts it from the Actions tab, optionally narrowed to one benchmark:
#
#   tests: '*TextAreaFrameBenchmark*'
#
# The numbers are read in the log and argued about in prose.
name: Benchmarks

on:
  workflow_call:
    inputs:
      tests:
        description: A --tests filter, such as '*FrameBudgetBenchmark*'. Empty runs every benchmark.
        type: string
        default: ''
      jmh:
        description: Run JMH on :core as well.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tests:
        description: A --tests filter, such as '*FrameBudgetBenchmark*'. Empty runs every benchmark.
        type: string
        default: ''
      jmh:
        description: Run JMH on :core as well.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5

      # Gradle's `checkToolchain` needs these before CMake runs, D-Bus, IBus and
      # udev included. LinuxDependenciesTest holds this list to the table.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols \
            libdecor-0-dev \
            libxkbcommon-dev xkb-data libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev \
            libwebkit2gtk-4.1-dev

      # The native library, because every benchmark that shapes text or paints a
      # frame needs a rasterizer -- without it they skip quietly, which looks
      # exactly like passing.
      - name: Build libgoldberry
        run: ./gradlew :natives:cmakeBuild --no-daemon

      # Compiled first and on its own, so the step that measures runs nothing but
      # the measurements: a compiler beside a benchmark is a benchmark of both.
      - name: Compile the benchmarks
        run: ./gradlew benchmarkClasses --no-daemon

      # One module's benchmarks at a time, whatever org.gradle.parallel says.
      # `--continue`, so one module's failure does not cost the others' numbers.
      - name: Run the benchmarks
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          filter=()
          if [ -n "$TESTS" ]; then
            filter=(--tests "$TESTS")
          fi
          ./gradlew benchmark "${filter[@]}" --no-daemon --continue

      # JMH on the hot seams that are pure logic. Distinct from the task above,
      # which measures whole operations against a real rasterizer: this one adds
      # forks, warm-up and a blackhole, so the number is not an artifact of the JIT
      # specialising the loop away.
      - name: JMH
        if: ${{ inputs.jmh }}
        run: ./gradlew :core:jmh --no-daemon

      # The zero-copy plan's measurement (docs/zero-copy-tiles.md, phase 0) on
      # lavapipe: painting into mapped upload memory, and a frame's damage
      # uploaded staged and in place, with the in-place gate for the driver. A
      # probe, so it runs on the first thread and gates nothing; the table goes
      # into the run's summary too.
      - name: Install lavapipe
        run: sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - name: Upload paths on lavapipe
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd.json /usr/share/vulkan/icd.d/lvp_icd.*.json 2>/dev/null | head -n 1)
          export VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd"
          ./gradlew :gpu:uploadPathProbe --no-daemon -q -Dgoldberry.gpu.videoDriver=offscreen | sed '/^goldberry: wove/d' | tee upload-paths.md
          { echo "## Upload paths, linux-x64 (lavapipe)"; echo; cat upload-paths.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: |
            core/build/results/jmh
            */build/reports/tests/benchmark
          if-no-files-found: ignore

  # The same probe where the plan cannot run it here: Direct3D 12 on Windows,
  # which tells whether SDL's hidden realignment copy shows and what the in-place
  # path costs there, and Metal on macOS. Each builds libgoldberry as its
  # platform's CI does. A runner without a device prints why and is green: the
  # Windows runners have never had a GPU lane, and WARP may or may not be what
  # SDL finds there.
  upload-paths:
    name: Upload paths (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runs-on: windows-2022
          - target: macos-aarch64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cache the upstream sources
        uses: actions/cache@v4
        with:
          path: natives/.deps/${{ matrix.target }}/*-src
          key: natives-sources-${{ matrix.target }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: natives-sources-${{ matrix.target }}-

      - name: Build libgoldberry
        run: ./gradlew :natives:cmakeBuild --no-daemon

      - name: Upload paths
        run: |
          ./gradlew :gpu:uploadPathProbe --no-daemon -q | sed '/^goldberry: wove/d' | tee upload-paths.md
          { echo "## Upload paths, ${{ matrix.target }}"; echo; cat upload-paths.md; } >> "$GITHUB_STEP_SUMMARY"
