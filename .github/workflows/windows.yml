# Windows CI
# https://goldberry.dev/docs/contributing/testing.html#the-ci-matrix
#
# One target, `windows-x64`. Windows on ARM was dropped from the matrix;
# MSVC would cross-target it from this same runner if it ever comes back.
#
# **One job**, for macos.yml's reason: Gradle builds libgoldberry with the
# arguments `natives/build.gradle` holds -- Ninja and MSVC, handed `cl` by
# absolute path -- and then runs the whole build against it. The library that
# passed the tests is the one uploaded. This is the job that earns its keep for
# the bindings: Win64's C `long` is 4 bytes where every other target has 8, and
# the layout probe is what checks the hand-written layouts model it.
#
# `workflow_call` is what lets publish.yml reuse this without duplicating it --
# and on a push to master that is the only way this runs. There is no `push`
# trigger: snapshot.yml calls this workflow on every push and publishes the
# library it built, so a trigger here would build every native library twice per
# commit and publish neither. Pull requests still run it directly.
#
# Every `run` here is bash, set once below rather than per step. The default on a
# Windows runner is PowerShell, which parses native command arguments itself:
# `-Pgoldberry.skipNative=true` reached Gradle split at the dot, as `-Pgoldberry`
# and a task named `.skipNative=true`. Quoting each argument would fix that one
# line and leave the trap set for the next. Bash also keeps `./gradlew` meaning
# the same script it means on the other two runners.

name: Windows

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

# Upstream refs are deliberately absent. The superbuild reads them straight out
# of gradle/libs.versions.toml, which is the only place any of them is written
# down.

jobs:
  build:
    name: Build and test (windows-x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      # Windows carries MSVC, CMake and Ninja already, but `cl` is only on the
      # PATH inside a Developer Command Prompt. Without it CMake's Ninja generator
      # takes MinGW's `cc`, and `checkToolchain` refuses to build with that.
      # https://goldberry.dev/docs/contributing/building.html#windows
      - name: Install build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The seven upstream clones, keyed on the catalog that pins them. Only the
      # sources, as on macOS.
      - name: Cache the upstream sources
        uses: actions/cache@v4
        with:
          path: natives/.deps/windows-x64/*-src
          key: natives-sources-windows-x64-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: natives-sources-windows-x64-

      - name: Build libgoldberry
        run: ./gradlew :natives:cmakeBuild --no-daemon

      # The web view library, which the superbuild makes here from the WebView2
      # SDK headers it fetches itself. A build without it is a lost file rather
      # than a reduced build, and stops here.
      - name: Check the web view library
        run: |
          lib=natives/build/native/windows-x64/install/lib/goldberry-webview.dll
          test -f "$lib" || { echo "::error::no $lib: the Windows natives jar would ship without web-view"; exit 1; }
          ls -la "$lib"

      # The whole build against the library just made, as on macOS. Left out:
      # the GPU lanes, which this runner has never been asked for -- it has no
      # device to give them. `webview.required`: WebviewBindingTest loads the
      # DLL, checks its ABI and binds every call; loading needs only Windows' own
      # DLLs, since WebView2Loader is opened when a page is, not when the
      # library is.
      # https://goldberry.dev/docs/contributing/testing.html#with-and-without-the-library
      - name: Build and test against it
        run: |
          ./gradlew build --no-daemon --continue \
            -x gpuTest \
            -Pgoldberry.native.required=true \
            -Pgoldberry.webview.required=true

      # Both libraries, into one artifact: publish.yml copies the directory into
      # the layout :natives packages. After the tests, so what is published is
      # what they passed against.
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: |
            natives/build/native/windows-x64/install/lib/goldberry.dll
            natives/build/native/windows-x64/install/lib/goldberry-webview.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures-windows-x64
          path: |
            */build/golden-failures
            */build/reports/tests
          if-no-files-found: ignore
