# Windows CI (ADR-0012)
#
# Both architectures build on an x64 runner: MSVC cross-targets ARM64 with
# `-A ARM64`, which is first-class in the native toolchain rather than bolted on.
# No foreign SDK is involved.
#
# `workflow_call` is what lets release.yml reuse this without duplicating it.
#
# Every `run` here is bash, set once below rather than per step. The default on a
# Windows runner is PowerShell, which parses native command arguments itself:
# `-Pgoldberry.skipNative=true` reached Gradle split at the dot, as `-Pgoldberry`
# and a task named `.skipNative=true`. Quoting each argument would fix that one
# line and leave the trap set for the next. Bash also keeps `./gradlew` meaning
# the same script it means on the other two runners.

name: Windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

# Upstream refs are deliberately absent. The superbuild reads them straight out
# of gradle/libs.versions.toml, which is the only place any of them is written
# down (ADR-0035). They used to be duplicated here because the manylinux
# container has no JDK -- but reading the catalog never needed a JDK, only
# something that can parse a text file, and CMake can.

jobs:
  java:
    name: Java
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -Pgoldberry.skipNative=true --no-daemon

  natives:
    name: libgoldberry (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            arch-args: -A x64
          - target: windows-aarch64
            arch-args: -A ARM64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S natives/src/main/cmake -B build/native \
            -G "Visual Studio 17 2022" ${{ matrix.arch-args }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install" \
            -DGOLDBERRY_TARGET_ID=${{ matrix.target }}

      - name: Build
        # --config matters for the multi-config Visual Studio generator.
        run: cmake --build build/native --config Release --target install

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: build/install/lib/goldberry.dll
          if-no-files-found: error

  # This is the job that earns its keep: Win64's C `long` is 4 bytes where every
  # other target has 8, and nothing before this point has checked that the
  # hand-written layouts model it correctly.
  verify:
    name: Verify layouts (windows-x64)
    needs: natives
    # `needs` waits for the whole matrix, and a matrix job fails if ANY leg does.
    # Without this, an unrelated windows-aarch64 failure skips the verification of
    # a windows-x64 library that built perfectly -- and this is the job that
    # checks Win64's 4-byte `long`, which nothing else does. If the x64 artifact
    # really is missing, the download step below fails loudly, which is the
    # outcome we want rather than a silent skip (ADR-0016).
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-x64
          path: native-lib
      # No C/C++ toolchain is set up in this job, and none is wanted: passing
      # `goldberry.native.library` tells Gradle to verify the downloaded artifact
      # rather than build a rival one, and `goldberry.native.required` turns a
      # test that would have skipped for want of a library into a failure
      # (ADR-0016).
      - run: |
          ./gradlew :natives:test --no-daemon \
            -Dgoldberry.native.library="$PWD/native-lib/goldberry.dll" \
            -Dgoldberry.native.required=true
