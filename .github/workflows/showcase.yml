# The native showcase (ADR-0337, ADR-0340)
#
# Builds the showcase as a GraalVM native image on each desktop platform -- one
# executable with libgoldberry inside it (ADR-0159) -- runs it for three
# hundred frames while its window is resized a pixel a frame, fails if more
# than the budget of them were late (ADR-0342), and uploads it. On a `v*` tag the three binaries are
# also attached to the tag's GitHub Release, created as a draft so it is
# published by hand beside the Central deployment (docs/releasing.md).
#
# Only on a release tag or by hand. A push to master no longer builds it: the
# example's own tests run against a built library on linux.yml's verify leg, and
# a native build on three runners is a release artifact, not a check. There is
# no jlink image and no GitHub Packages upload any more (ADR-0340).
#
# One job per platform rather than one job cross-linking three images: the
# libgoldberry inside each image has to be built on that platform (ADR-0041), so
# the runner is already committed.

name: Showcase

on:
  push:
    tags: ['v*']
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: macos-aarch64
            runs-on: macos-14
          - target: windows-x64
            runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # SDL's X11 driver treats XTest as a hard dependency: without libxtst-dev
      # the configure stops with "Couldn't find dependency package for XTEST"
      # rather than skipping it, which is how it was found.
      #
      # libdecor-0-dev fails the other way and is harder to notice for it: the
      # build succeeds and the Wayland window has no titlebar and cannot be
      # resized, because GNOME does no server-side decorations and libdecor is
      # the only other implementation (ADR-0083).
      - name: Install build tools (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols \
            libdecor-0-dev \
            libxkbcommon-dev xkb-data libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev \
            xvfb zlib1g-dev
          # zlib1g-dev for native-image, which links `-lz` through the `libz.so`
          # symlink only the dev package installs; without it the image build
          # spends minutes on analysis and fails at the link (book/src/native.md).

      - name: Install build tools (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Windows carries MSVC, CMake and Ninja already, but `cl` is only on the
      # PATH inside a Developer Command Prompt. Without this step CMake's Ninja
      # generator took C:\mingw64\bin\cc.exe, built a `libgoldberry.dll` with GNU
      # naming and a libstdc++ dependency, and the image then looked for the
      # `goldberry.dll` an MSVC build writes. `checkToolchain` now refuses to
      # build without `cl` (ADR-0338).
      - name: Install build tools (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build libgoldberry
        run: ./gradlew :natives:cmakeBuild --no-daemon

      # GraalVM CE 25.3, pinned by *GraalVM* version rather than Java version.
      # Since 25.1 the community builds are tagged `graal-25.x`; `java-version:
      # '25'` alone still resolves through the old `jdk-25.*` tags and lands on
      # jdk-25.0.2 from January -- two feature releases behind the 25.3.4.1 the
      # image was built and run with locally (ADR-0337). `version: '25.3'`
      # takes the newest 25.3 patch.
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Also puts GRAALVM_HOME in the environment, which is where
          # `:example:nativeImage` looks, and on Windows sets up the MSVC
          # environment native-image links with.

      # The checked-in trace was recorded on linux-x64 and is reviewed as source
      # (ADR-0156). macOS and Windows get a fresh one for the reflection and
      # resources only that platform's code path reaches; the foreign calls no
      # longer depend on a trace at all (ADR-0339).
      # Headless (`videoDriver=dummy`) on Windows, so no display is needed.
      - name: Trace the showcase for native-image (windows)
        if: runner.os == 'Windows'
        run: ./gradlew :example:nativeImageMetadata --no-daemon --stacktrace

      # On the real driver on macOS. Under `dummy` no Cocoa application is ever
      # started, and SDL's status-bar tray then aborts the process from inside
      # CoreGraphics (`CGSConnectionByID ... is_initialized`). The toolkit now
      # declines the tray in that state, but a trace with no tray calls in it
      # would leave the image without them; the runner has a window server, so
      # the trace is of a real run (ADR-0338).
      - name: Trace the showcase for native-image (macos)
        if: runner.os == 'macOS'
        run: ./gradlew :example:nativeImageMetadata -Pgoldberry.trace.videoDriver=cocoa --no-daemon --stacktrace

      - name: Build the native image
        run: ./gradlew :example:nativeImage --no-daemon --stacktrace

      # What was built, when something was built. A missing module or a library
      # in the wrong place is visible here and invisible in a green tick.
      - name: What was built
        if: always()
        run: ls -l example/build/native || echo "::warning::no native image was produced"

      # The binary is what ships, so the binary is what runs -- and it runs under
      # the load M1's claim is about: three hundred frames with the window
      # resized a pixel a frame, which is what a drag produces. The launcher
      # counts every refresh that went by with a frame wanted and undelivered
      # and exits non-zero past the budget (ADR-0342).
      #
      # The budget is a tenth of the frames, and it is a ceiling on a GPU-less
      # virtual machine painting into a software X server, Cocoa or D3D --
      # evidence about three platforms' drivers, not a claim about hardware.
      # A run that is over it has regressed; a run that is well under it has
      # not proved 60 fps on a desktop. The summary line in the log is the
      # number, and the step summary carries it.
      - name: Run the native image (linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1200x24" \
            ./example/build/native/goldberry-showcase-${{ matrix.target }} \
              --frames=300 --resize=1580x1100 --late-budget=30 | tee native-run.log
          grep -q "painted 300 frame(s); exiting" native-run.log \
            || { echo "::error::the native showcase did not present three hundred frames"; exit 1; }
          grep "frames: " native-run.log | sed 's/^.*frames: /Frames (${{ matrix.target }}): /' >> "$GITHUB_STEP_SUMMARY"

      - name: Run the native image (macos)
        if: runner.os == 'macOS'
        run: |
          ./example/build/native/goldberry-showcase-${{ matrix.target }} \
            --frames=300 --resize=1580x1100 --late-budget=30 | tee native-run.log
          grep -q "painted 300 frame(s); exiting" native-run.log \
            || { echo "::error::the native showcase did not present three hundred frames"; exit 1; }
          grep "frames: " native-run.log | sed 's/^.*frames: /Frames (${{ matrix.target }}): /' >> "$GITHUB_STEP_SUMMARY"

      - name: Run the native image (windows)
        if: runner.os == 'Windows'
        run: |
          ./example/build/native/goldberry-showcase-${{ matrix.target }}.exe \
            --frames=300 --resize=1580x1100 --late-budget=30 | tee native-run.log
          grep -q "painted 300 frame(s); exiting" native-run.log \
            || { echo "::error::the native showcase did not present three hundred frames"; exit 1; }
          grep "frames: " native-run.log | sed 's/^.*frames: /Frames (${{ matrix.target }}): /' >> "$GITHUB_STEP_SUMMARY"

      # Tarred on unix for the executable bit: the zip `upload-artifact` writes
      # does not carry it, and a binary that cannot be run is not a binary. On
      # Windows the one `.exe` travels as itself.
      - name: Package the native image (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "$GITHUB_WORKSPACE/goldberry-showcase-native-${{ matrix.target }}.tar.gz" \
            -C example/build/native "goldberry-showcase-${{ matrix.target }}"

      - name: Package the native image (windows)
        if: runner.os == 'Windows'
        run: |
          cp "example/build/native/goldberry-showcase-${{ matrix.target }}.exe" \
            "$GITHUB_WORKSPACE/goldberry-showcase-native-${{ matrix.target }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: goldberry-showcase-native-${{ matrix.target }}
          path: goldberry-showcase-native-${{ matrix.target }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: showcase-run-log-${{ matrix.target }}
          path: native-run.log
          if-no-files-found: warn

  # The three binaries, on the tag's GitHub Release (ADR-0340). Created as a
  # draft when it does not exist yet, so that it is published by hand at the
  # same moment as the Central deployment; an existing release, draft or not,
  # gets the files replaced. A manual run builds and uploads nothing here.
  release:
    name: Attach to the release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: goldberry-showcase-native-*
          path: packages
          merge-multiple: true

      - name: Upload the native images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l packages
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --verify-tag \
                 --title "Goldberry ${TAG#v}" \
                 --notes "The showcase as a native image, one file per platform. Unpack the tarballs; the .exe runs as it is."
          gh release upload "$TAG" packages/goldberry-showcase-native-* --clobber
          echo "Attached $(ls packages | wc -l) native images to release **$TAG**" >> "$GITHUB_STEP_SUMMARY"
