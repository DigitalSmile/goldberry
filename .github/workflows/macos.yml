# macOS CI (ADR-0012)
#
# Both architectures build on an Apple Silicon runner: Xcode targets x86_64 via
# CMAKE_OSX_ARCHITECTURES. This is also the leg that made ADR-0011 untenable and
# ADR-0012 necessary -- SDL3's macOS backend needs the Cocoa, Metal, and CoreText
# frameworks, whose headers ship only in Apple's SDK, and that SDK's licence
# restricts it to Apple hardware. On a real macOS runner the question does not
# arise.
#
# `workflow_call` is what lets release.yml reuse this without duplicating it.
#
# STATUS: green. Both architectures build and the layout check passes against the
# downloaded dylib, so the Mach-O branch of the export machinery
# (-exported_symbols_list, -u _symbol) is exercised rather than assumed.

name: macOS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:

# Upstream refs are deliberately absent. The superbuild reads them straight out
# of gradle/libs.versions.toml, which is the only place any of them is written
# down (ADR-0035). They used to be duplicated here because the manylinux
# container has no JDK -- but reading the catalog never needed a JDK, only
# something that can parse a text file, and CMake can.

jobs:
  java:
    name: Java
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -Pgoldberry.skipNative=true --no-daemon

  natives:
    name: libgoldberry (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            arch-args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - target: macos-x64
            arch-args: -DCMAKE_OSX_ARCHITECTURES=x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: |
          cmake -S natives/src/main/cmake -B build/native \
            -G Ninja ${{ matrix.arch-args }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install" \
            -DGOLDBERRY_TARGET_ID=${{ matrix.target }}

      - name: Build
        run: cmake --build build/native --target install

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: build/install/lib/libgoldberry.dylib
          if-no-files-found: error

  verify:
    name: Verify layouts (macos-aarch64)
    needs: natives
    # A matrix job fails if any leg does, so a macos-x64 failure would otherwise
    # skip verification of the aarch64 library it has nothing to do with. A
    # genuinely missing artifact fails at the download step (ADR-0016).
    if: ${{ !cancelled() }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-aarch64
          path: native-lib
      # No C/C++ toolchain is set up in this job, and none is wanted: passing
      # `goldberry.native.library` tells Gradle to verify the downloaded artifact
      # rather than build a rival one, and `goldberry.native.required` turns a
      # test that would have skipped for want of a library into a failure
      # (ADR-0016).
      - run: |
          ./gradlew :natives:test --no-daemon \
            -Dgoldberry.native.library="$PWD/native-lib/libgoldberry.dylib" \
            -Dgoldberry.native.required=true
