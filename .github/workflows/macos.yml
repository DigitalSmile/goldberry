# macOS CI
# https://goldberry.dev/docs/contributing/testing.html#the-ci-matrix
#
# One target, `macos-aarch64`, on an Apple Silicon runner. Intel Macs were
# dropped from the matrix; Xcode would still cross-target them with
# CMAKE_OSX_ARCHITECTURES=x86_64 from this same runner if that changes.
#
# This is also the leg that ruled out cross-compiling from one runner --
# SDL3's macOS backend needs the Cocoa, Metal, and CoreText frameworks, whose
# headers ship only in Apple's SDK, and that SDK's licence restricts it to Apple
# hardware. On a real macOS runner the question does not arise.
#
# **One job.** Gradle builds libgoldberry the way it does on a laptop --
# `:natives:cmakeBuild`, with the arguments `natives/build.gradle` holds and
# nowhere else -- and then runs the whole build against it. There used to be
# three jobs here: a Java build without the library, a CMake build with the
# arguments written out a second time, and a verify job that downloaded the
# result. The runner has a JDK, so nothing was gained by the split but a second
# copy of the configure line and three queues to wait in. The library that
# passed the tests is the one this job uploads, which is the property the verify
# job existed for.
#
# `workflow_call` is what lets publish.yml reuse this without duplicating it --
# and on a push to master that is the only way this runs. There is no `push`
# trigger: snapshot.yml calls this workflow on every push and publishes the
# library it built, so a trigger here would build every native library twice per
# commit and publish neither. Pull requests still run it directly.

name: macOS

on:
  pull_request:
    # The landing page is pages.yml's alone, and it runs SiteTest itself.
    paths-ignore:
      - 'site/**'
  workflow_call:
  workflow_dispatch:

# Upstream refs are deliberately absent. The superbuild reads them straight out
# of gradle/libs.versions.toml, which is the only place any of them is written
# down.

jobs:
  build:
    name: Build and test (macos-aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: brew install ninja

      # The seven upstream clones, about 330 MB, keyed on the catalog that pins
      # them. Only the sources: what they compile to belongs to this run's
      # configure, and a stale object from another one is worse than a rebuild.
      - name: Cache the upstream sources
        uses: actions/cache@v4
        with:
          path: natives/.deps/macos-aarch64/*-src
          key: natives-sources-macos-aarch64-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: natives-sources-macos-aarch64-

      - name: Build libgoldberry
        run: ./gradlew :natives:cmakeBuild --no-daemon

      # Every published natives jar carries the web view. Here it costs nothing
      # to build: WKWebView is a system framework, and CMake builds
      # libgoldberry-webview unconditionally. So a Mac build without it is
      # broken, not reduced, and stops here rather than shipping a natives jar on
      # which `WebViews.isAvailable()` is false.
      - name: Check the web view library
        run: |
          lib=natives/build/native/macos-aarch64/install/lib/libgoldberry-webview.dylib
          test -f "$lib" || { echo "::error::no $lib: the macOS natives jar would ship without web-view"; exit 1; }
          nm -gU "$lib" | grep -q ' _goldberry_webview_create$' \
            || { echo "::error::$lib does not export goldberry_webview_create"; exit 1; }
          otool -L "$lib" | grep -q 'WebKit.framework' \
            || { echo "::error::$lib does not link WebKit.framework"; exit 1; }

      # The whole build against the library just made: every module's tests and
      # goldens, the layout probe, the web view's binding, the showcase's own
      # tests. `native.required` and `webview.required` turn a test that would
      # skip for want of either library into a failure, because a green tick
      # over skipped tests is the outcome worse than a red one.
      # https://goldberry.dev/docs/contributing/testing.html#with-and-without-the-library
      #
      # The GPU lanes are left out: they run in the next step and are not
      # required here. `--continue`, so one red module does not hide the next
      # one's result.
      - name: Build and test against it
        run: |
          ./gradlew build --no-daemon --continue \
            -x gpuTest \
            -Pgoldberry.native.required=true \
            -Pgoldberry.webview.required=true

      # The GPU tests, on Metal if this runner has it.
      # Not required: whether GitHub's macOS VMs expose Metal is not
      # known yet, so a runner without a device skips and says why in the
      # summary. The Linux legs run the same tests on lavapipe, required. When a
      # run here shows a device, this becomes -Pgoldberry.gpu.required=true.
      #
      # Cocoa, which a Metal device needs, starts only on the first thread; the
      # gpuTest tasks start their JVM with -XstartOnFirstThread for that.
      - name: GPU tests, on Metal if the runner has it
        run: |
          ./gradlew :natives:gpuTest :gpu:gpuTest --no-daemon \
            -Pgoldberry.native.required=true
          cat natives/build/gpu-test/summary.txt gpu/build/gpu-test/summary.txt

      # Both libraries, into one artifact: publish.yml copies the directory into
      # the layout :natives packages. After the tests, so what is published is
      # what they passed against.
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-aarch64
          path: |
            natives/build/native/macos-aarch64/install/lib/libgoldberry.dylib
            natives/build/native/macos-aarch64/install/lib/libgoldberry-webview.dylib
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures-macos-aarch64
          path: |
            */build/golden-failures
            */build/reports/tests
          if-no-files-found: ignore
