# Qodana — an advisory dashboard, guarded on its token.
# https://goldberry.dev/docs/contributing/testing.html#advisory-dashboards
#
# The whole workflow is guarded on a project token existing. Without one the job
# resolves to a single skipped step rather than a red cross on every pull
# request: an analyser nobody has connected yet should be silent, not broken.
#
# Two secret names, one token. Qodana Cloud's onboarding stores it as
# `QODANA_TOKEN_<project id>` (here `QODANA_TOKEN_2096098759`); the repository's
# own name for it is `QODANA_TOKEN`. Either connects the job, the onboarding's first.
# The onboarding also opened a second workflow, `qodana_code_quality.yml`; it was
# folded into this one, since two jobs named Qodana ran on every pull request.
#
# The profile, the exclusions and the quality gate are in `qodana.yaml` at the
# repository root, so they are reviewed as code rather than configured in a web
# form nobody can diff.
name: Qodana

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  # The action writes findings into the PR's Checks tab.
  checks: write
  pull-requests: write

jobs:
  qodana:
    name: Inspect
    runs-on: ubuntu-24.04
    steps:
      - name: Is Qodana connected?
        id: gate
        env:
          TOKEN: ${{ secrets.QODANA_TOKEN_2096098759 || secrets.QODANA_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "connected=true" >> "$GITHUB_OUTPUT"
          else
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "No Qodana token is set — see https://goldberry.dev/docs/contributing/testing.html#static-analysis. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.connected == 'true'
        with:
          # The pull request's own commit rather than the merge GitHub makes:
          # the findings are reported against lines the author wrote.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Qodana compares against the base commit to decide what is *new*,
          # which is what the quality gate in qodana.yaml keys on.
          fetch-depth: 0

      # No JDK or Gradle on the runner, and no compile first. The linter runs in
      # its own container, imports the Gradle build itself with the JDK
      # qodana.yaml names, and resolved every module doing so, run locally
      # against a fresh checkout (2026-09-30).
      #
      # The baseline is the first run's findings, 408 of them, accepted so the
      # gate in qodana.yaml fails on *new* high-severity problems only. It is
      # that run's SARIF with the rule catalogue dropped: Qodana matches a
      # finding by its fingerprint, and the catalogue was 2.6 MB of the 5.
      # Regenerate it from a fresh run's SARIF. (Until 2026-09-30 there
      # was no first run, which is why the flag was absent: the 2026-09-18
      # review, B11.)
      # The release qodana.yaml pins the linter to, so CI and a local run
      # inspect with the same IntelliJ. A pull request inspects what it changed;
      # a push to master inspects everything, which is what Qodana Cloud keeps
      # as the project's state.
      - uses: JetBrains/qodana-action@v2026.1
        if: steps.gate.outputs.connected == 'true'
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          args: --baseline,config/qodana/baseline.sarif.json
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_2096098759 || secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: https://qodana.cloud

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.connected == 'true'
        with:
          name: qodana
          path: ${{ runner.temp }}/qodana/results
          if-no-files-found: ignore
