# goldberry-media: the FFmpeg + dav1d superbuild, and the module's tests against
# what it built (docs/media-plan.md, phase 1 "CI"). goldberry-media-platform's
# tests run here too: they demux with that FFmpeg (ADR-0472).
#
# Separate from linux.yml and macos.yml, because this build has its own
# toolchain (meson, pkg-config, make, nasm) and its own natives, and a pull
# request that touches neither should not pay for compiling FFmpeg.
#
# Two targets for now. Windows joins when the MSYS2 branch of the superbuild
# has been run somewhere (docs/media-plan.md); linux-aarch64 joins with the
# natives jar's publication, which needs all four.
#
# The FFmpeg and dav1d checkouts are cached by the catalog's hash, the one file
# that pins them (ADR-0035): a pin that moves invalidates the cache, and nothing
# else does.
name: Media

on:
  pull_request:
    paths:
      - 'media/**'
      - 'media-platform/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/media.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  ffmpeg:
    name: FFmpeg and :media (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-14
            tools: brew install meson pkg-config nasm ninja
          - target: linux-x64
            runner: ubuntu-24.04
            tools: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm pkg-config make
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install the superbuild's tools
        run: ${{ matrix.tools }}

      - uses: actions/cache@v4
        with:
          path: media/.deps/${{ matrix.target }}
          key: media-deps-${{ matrix.target }}-${{ hashFiles('gradle/libs.versions.toml', 'media/src/main/cmake/**') }}

      - name: Build FFmpeg and dav1d, with the layout probe and the size gate
        run: ./gradlew :media:ffmpegBuild -Pgoldberry.skipNative=true --no-daemon

      # `required`, so a test that could not load FFmpeg fails rather than skips:
      # a verification job that skips is a green tick over nothing (ADR-0016).
      # `check` includes the natives-jar test and the coverage floor.
      - name: Test :media against it
        run: ./gradlew :media:check -Pgoldberry.skipNative=true -Pgoldberry.media.required=true --no-daemon

      # The platform decoders are macOS's, so the macOS job requires them; on
      # Linux the providers support nothing, and what needs a Mac skips.
      - name: Test :media-platform against it
        run: >-
          ./gradlew :media-platform:check -Pgoldberry.skipNative=true -Pgoldberry.media.required=true
          -Pgoldberry.platform.required=${{ startsWith(matrix.target, 'macos') }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: media/build/ffmpeg/${{ matrix.target }}/install/lib/
          if-no-files-found: error
