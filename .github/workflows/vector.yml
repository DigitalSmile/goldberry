# goldberry-vector: the libgoldberry-vector superbuild (ThorVG's SVG loader and
# CPU rasterizer), and the module's tests against what it built.
# https://goldberry.dev/docs/components/drawing.html#image
#
# Separate from media.yml, beside it and shaped like it, because this build has
# its own toolchain (meson for ThorVG) and its own natives, and a pull request
# that touches neither should not pay for compiling ThorVG.
#
# Three jobs. `natives` builds the library on each target where it will run:
# the Linux targets inside the manylinux_2_28 container that pins the glibc
# floor, as media.yml does; macOS on the arm64 runner; Windows with MinGW-w64
# from MSYS2's UCRT64 environment, the toolchain the media library shares.
# `test` then runs :vector's check on a plain runner with a JDK against the
# artifact. All four targets, which a release of goldberry-vector needs: the
# library for each rides it as a `natives-<target>` classifier, and a release
# refuses to go with one missing (vector/build.gradle).
#
# And `sanitizer`: the library built again with AddressSanitizer compiled into
# ThorVG, and every test that hands it a document -- the robustness tests'
# damaged corpus above all, many rounds of it -- run against it. A read past
# the end of a buffer in the SVG loader stops the JVM with a report, and the
# job fails on it. linux-x64 alone, on the runner itself: that build never
# ships, so it needs no glibc floor, only the GCC whose libasan is preloaded.
#
# The ThorVG checkout is cached by the catalog's hash, the one file that pins
# it, and the superbuild's sources.
name: Vector

on:
  pull_request:
    paths:
      - 'vector/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/vector.yml'
  workflow_call:
  workflow_dispatch:

# The oldest macOS the library loads on, as media.yml pins it.
env:
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  natives:
    name: libgoldberry-vector (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
          - target: macos-aarch64
            runner: macos-15
            image: ''
          - target: windows-x64
            runner: windows-2022
            image: ''
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: vector/.deps/${{ matrix.target }}
          key: vector-deps-${{ matrix.target }}-${{ hashFiles('gradle/libs.versions.toml', 'vector/src/main/cmake/**') }}

      # AlmaLinux 8's cmake is older than the 3.28 the superbuild requires, so
      # cmake, ninja and meson come from pip; git from dnf, with media.yml's
      # retry past a mirror mid-sync.
      - name: Install the tools (Linux)
        if: runner.os == 'Linux'
        run: |
          origin=()
          for attempt in 1 2 3; do
            dnf install -y "${origin[@]}" git && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "::warning::dnf install failed, attempt $attempt of 3; fresh metadata in 30 s"
            dnf clean metadata
            if [ "$attempt" -eq 2 ]; then
              base=https://repo.almalinux.org/almalinux/$(rpm -E %rhel)
              origin=()
              for repo in baseos:BaseOS appstream:AppStream powertools:PowerTools; do
                origin+=(--setopt=${repo%%:*}.mirrorlist= --setopt=${repo%%:*}.baseurl=$base/${repo#*:}/$(uname -m)/os/)
              done
            fi
            sleep 30
          done
          /opt/python/cp312-cp312/bin/pip install --upgrade cmake ninja meson
          echo /opt/python/cp312-cp312/bin >> $GITHUB_PATH

      - name: Install the tools (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - name: Install the tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson

      - name: Configure and build (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S vector/src/main/cmake -B build/vector \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/build/vector-install \
            -DGOLDBERRY_TARGET_ID=${{ matrix.target }} \
            -DGOLDBERRY_VECTOR_DEPS_DIR=$PWD/vector/.deps/${{ matrix.target }}
          cmake --build build/vector --target install

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git config --global core.autocrlf false
          cmake -S vector/src/main/cmake -B build/vector \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_INSTALL_PREFIX=$PWD/build/vector-install \
            -DGOLDBERRY_TARGET_ID=${{ matrix.target }} \
            -DGOLDBERRY_VECTOR_DEPS_DIR=$PWD/vector/.deps/${{ matrix.target }}
          cmake --build build/vector --target install

      # When ThorVG's meson setup stops, the reason is in its log.
      - name: What meson saw
        if: failure()
        run: tail -n 80 vector/.deps/${{ matrix.target }}/thorvg-build/meson-logs/meson-log.txt 2>/dev/null || true

      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: |
          # Anything above 2.28 here means the artifact is not portable.
          objdump -T build/vector-install/lib/libgoldberry-vector.so \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: vector-natives-${{ matrix.target }}
          path: build/vector-install/lib/
          if-no-files-found: error

  test:
    name: ':vector (${{ matrix.target }})'
    needs: natives
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/download-artifact@v4
        with:
          name: vector-natives-${{ matrix.target }}
          path: vector-natives

      # `required`, so a test that could not load the library fails rather than
      # skips: a verification job that skips is a green tick over nothing.
      # `check` includes the natives-jar test, which packages this directory,
      # and the robustness tests at their default rounds.
      - name: Test :vector against it
        run: >-
          ./gradlew :vector:check
          -Pgoldberry.skipNative=true -Pgoldberry.vector.required=true
          -Pgoldberry.vector.libdir="${{ github.workspace }}/vector-natives" --no-daemon

  sanitizer:
    name: libgoldberry-vector under AddressSanitizer (linux-x64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5

      # Its own cache: this archive is instrumented, and the release build must
      # never be linked from it.
      - uses: actions/cache@v4
        with:
          path: vector/.deps/linux-x64-asan
          key: vector-deps-linux-x64-asan-${{ hashFiles('gradle/libs.versions.toml', 'vector/src/main/cmake/**') }}

      - name: Install the tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build meson

      # `sanitizerTest` requires the library and checks that what it loaded is
      # the sanitized build. `sanitizerReport` runs after it either way.
      - name: Build the sanitizer library and run the lane
        run: >-
          ./gradlew :vector:nativesBuildAsan :vector:sanitizerTest
          -Pgoldberry.skipNative=true --no-daemon

      - name: Keep the sanitizer's reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vector-sanitizer-reports
          path: vector/build/sanitizer/
          if-no-files-found: ignore
