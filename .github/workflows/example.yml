# Example CI (ADR-0021, ADR-0023)
#
# The showcase runs on the MODULE PATH, which is what this job is really for. A
# package the toolkit forgets to export, an --enable-native-access naming a module
# that does not exist, a native library that resolves only from the build tree --
# each of those compiles fine and fails here.
#
# Since ADR-0155 it is also the only place the reflective binding is exercised as
# a real module. Binding a @Model at run time needs `opens ... to
# io.github.digitalsmile.goldberry.core` and a read edge back from the toolkit,
# and neither is testable from a test source set: those run in the unnamed module,
# where everything is open to everybody and both requirements are met for free.
#
# And it runs the thing. A window opens under Xvfb, a frame is presented, and the
# process exits on its own. "It compiled" is not the claim being made.

name: Example

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

# Upstream refs are deliberately absent. The superbuild reads them straight out
# of gradle/libs.versions.toml, which is the only place any of them is written
# down (ADR-0035). They used to be duplicated here because the manylinux
# container has no JDK -- but reading the catalog never needed a JDK, only
# something that can parse a text file, and CMake can.

jobs:
  showcase:
    name: Open a window (linux-x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Built on the runner rather than in the manylinux container used for
      # releases: this library is under test, not for distribution, and a
      # container without a JDK cannot run the example anyway. The glibc floor is
      # the release workflow's problem (ADR-0012).
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols \
            libdecor-0-dev \
            libxkbcommon-dev xkb-data libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            xvfb

          # libxtst-dev is not optional. SDL's CheckX11 treats XTest as a hard
          # dependency of the X11 driver and stops the configure with
          # "Couldn't find dependency package for XTEST" -- it is not skipped the
          # way a missing optional header is. Installing it rather than passing
          # -DSDL_X11_XTEST=OFF because XTest is what SDL warps the pointer with
          # on X11, and a toolkit that grows a slider or a drag-to-resize will
          # want that (§7.3) -- switching it off would remove the capability
          # silently and only on Linux.
          #
          # libdecor-0-dev is the opposite case and worse for it: SDL configures
          # and builds perfectly happily without it, and the result is a Wayland
          # window with no titlebar, no close button and no resize edge. GNOME's
          # compositor declines server-side decorations, so libdecor is not a
          # fallback there -- it is the only implementation (ADR-0083). Nothing
          # in a build log says it is missing; `checkToolchain` now does.


      - name: Build libgoldberry
        run: ./gradlew :natives:cmakeBuild --no-daemon

      - name: Build the example
        run: ./gradlew :example:build --no-daemon

      # Xvfb gives SDL a real X display to open a real window on. Without it SDL
      # has no video driver and the backend fails at startup -- which is the
      # correct behaviour, and not what this job is trying to find out.
      - name: Open a window
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            ./gradlew :example:run --no-daemon -Pgoldberry.example.frames=3 --console=plain \
            | tee run.log
          # The build succeeding is not enough: `run` exits 0 if main() returns
          # without drawing anything at all.
          grep -q "painted 3 frame(s); exiting" run.log \
            || { echo "::error::the showcase did not present three frames"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-run-log
          path: run.log
          if-no-files-found: warn
