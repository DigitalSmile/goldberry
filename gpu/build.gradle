import dev.goldberry.build.toolchain.ToolLookup

import java.security.MessageDigest

plugins {
    id 'goldberry.java-conventions'
    // Published to Maven Central as goldberry-gpu.
    id 'goldberry.publish'
    // `canvas3d` is a markup widget: the weaver collects it into this module's
    // catalog, which the markup finds through a `uses`.
    id 'goldberry.weave'
    // `canvas3d` with no GPU is a widget tree painted by Blend2D, and a golden of
    // it, so even the tests that need no device need libgoldberry.
    id 'goldberry.native-tests'
    // The compositing harness, which :media's GPU lane draws video through.
    id 'java-test-fixtures'
}

description = 'Goldberry GPU: the canvas3d widget and the GPU composition path'

dependencies {
    api project(':core')

    // `canvas3d` is a widget, and its notice is `:widgets`' `message`; `api`
    // because Canvas3d's markup signature names `Wiring`.
    api project(':widgets')

    // SDL_GPU's wrappers, which :natives exports to this module and to :core
    // alone. Not `api`: no type of :natives is in this module's
    // public surface.
    implementation project(':natives')

    // :natives' GPU test fixtures: the device requirement and the launcher that
    // runs the tests on the first thread (`gpuTest` below).
    testImplementation testFixtures(project(':natives'))
    testImplementation libs.junit.platform.launcher
    // GoldenImage, for the GPU layers' z-order goldens, which live in
    // src/test/resources/golden like every module's.
    testImplementation testFixtures(project(':core'))

    // The harness asks for a device and fails a test through JUnit.
    testFixturesImplementation testFixtures(project(':natives'))
    testFixturesImplementation platform(libs.junit.bom)
    testFixturesImplementation libs.junit.jupiter
}

// ============================================================================
// Shaders
// https://goldberry.dev/docs/components/gpu.html#shaders
//
// Authored once in HLSL under src/main/shaders, and compiled on purpose -- not
// as part of `build` -- into the three formats SDL_GPU takes: SPIR-V (Vulkan)
// and DXIL (Direct3D 12) by DXC, and MSL (Metal) by SPIRV-Cross from the
// SPIR-V. They are the two engines SDL_shadercross wraps, called directly.
//
//   ./gradlew :gpu:compileShaders
//
// The output is committed under src/main/resources, with shaders.properties
// recording each source's SHA-256 and the tools' versions. ShaderManifestTest
// fails when a source and its bytecode disagree, so a stale shader cannot ship,
// and a machine with no DXC can still build, test and publish.
//
// DXC and SPIRV-Cross come with the Vulkan SDK (1.4.328 made the committed
// files). DXC signs DXIL itself since 1.8, so DXIL made off Windows is signed.
// ============================================================================
// The toolkit's shaders, which ship; the tests' own (a mesh with vertex
// buffers, for the public API's tests), which do not; and the showcase's, which
// are an application's own, loaded through ShaderCode.load as any application's
// would be (the GPU tab's cube, phase 5). Each set is compiled into its own
// resources with its own manifest, and each module checks its own is fresh.
def shaderSets = [
        [sources: layout.projectDirectory.dir('src/main/shaders'),
         output : layout.projectDirectory.dir('src/main/resources/dev/goldberry/gpu/shaders')],
        [sources: layout.projectDirectory.dir('src/test/shaders'),
         output : layout.projectDirectory.dir('src/test/resources/dev/goldberry/gpu/testshaders')],
        [sources: rootProject.layout.projectDirectory.dir('example/src/main/shaders'),
         output : rootProject.layout.projectDirectory.dir(
                 'example/src/main/resources/dev/goldberry/example/gpu')],
]

// DXC and SPIRV-Cross by absolute path, or named with -Pgoldberry.dxc=<path>.
def tools = ToolLookup.from(providers)

tasks.register('compileShaders') {
    group = 'build'
    description = 'Compiles src/main/shaders and src/test/shaders to SPIR-V, DXIL and MSL, and records their sources\' hashes.'
    shaderSets.each { set ->
        inputs.dir(set.sources)
        outputs.dir(set.output)
    }

    doLast {
        def dxc = tools.fileOrNull('dxc')
        def spirvCross = tools.fileOrNull('spirv-cross')
        if (dxc == null || spirvCross == null) {
            throw new GradleException("""\
                compileShaders needs DXC and SPIRV-Cross, which the Vulkan SDK installs
                (https://vulkan.lunarg.com). Missing: ${[dxc == null ? 'dxc' : null, spirvCross == null ? 'spirv-cross' : null].findAll().join(', ')}.
                Either can be named directly, e.g. -Pgoldberry.dxc=/path/to/dxc.""".stripIndent())
        }
        def run = { List<String> command ->
            def result = providers.exec {
                commandLine command
                ignoreExitValue = true
            }
            if (result.result.get().exitValue != 0) {
                throw new GradleException("${command.join(' ')} failed:\n${result.standardError.asText.get()}")
            }
            // DXC prints its version on stderr, SPIRV-Cross on stdout.
            return result.standardOutput.asText.get() + result.standardError.asText.get()
        }
        def dxcVersion = run([dxc.absolutePath, '--version']).readLines().first().trim()
        def spirvCrossVersion = run([spirvCross.absolutePath, '--revision']).readLines().first().trim()

        shaderSets.each { set ->
            def out = set.output.asFile
            out.mkdirs()
            out.listFiles().each { it.delete() }

            def manifest = new TreeMap<String, String>()
            def sources = set.sources.asFile.listFiles().findAll { it.name.endsWith('.hlsl') }.sort { it.name }
            sources.each { source ->
                def name = source.name - '.hlsl'
                def profile = name.endsWith('.vert') ? 'vs_6_0' : name.endsWith('.frag') ? 'ps_6_0' : null
                if (profile == null) {
                    throw new GradleException("${source.name}: a shader is named <name>.vert.hlsl or <name>.frag.hlsl")
                }
                def spirv = new File(out, "${name}.spv")
                run([dxc.absolutePath, '-T', profile, '-E', 'main', '-spirv', '-Fo', spirv.absolutePath, source.absolutePath])
                run([dxc.absolutePath, '-T', profile, '-E', 'main', '-Fo', new File(out, "${name}.dxil").absolutePath,
                     source.absolutePath])
                run([spirvCross.absolutePath, spirv.absolutePath, '--msl', '--msl-version', '20100',
                     '--output', new File(out, "${name}.msl").absolutePath])
                manifest["${name}.sha256"] = MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
            }
            // What the shaders include is part of what they were compiled from.
            set.sources.asFile.listFiles().findAll { it.name.endsWith('.hlsli') }.sort { it.name }.each { include ->
                manifest["${include.name}.sha256"] = MessageDigest.getInstance('SHA-256').digest(include.bytes)
                        .encodeHex().toString()
            }
            new File(out, 'shaders.properties').text = (
                    ["# Written by :gpu:compileShaders. Each source's SHA-256, checked by ShaderManifestTest.",
                     "tools=${dxcVersion}; spirv-cross ${spirvCrossVersion}"] +
                            manifest.collect { key, value -> "${key}=${value}" }).join('\n') + '\n'
            logger.lifecycle("Compiled ${sources.size()} shaders in ${set.sources.asFile.name} with ${dxcVersion} and SPIRV-Cross ${spirvCrossVersion}")
        }
    }
}

// ============================================================================
// Tests
//
// What needs a GPU device is tagged `gpu` and runs in `gpuTest`, on the JVM's
// first thread, as :natives' do and for the same reason: macOS's Cocoa, which a
// Metal device needs, refuses every other thread. The rest runs in
// `test` with no device at all.
// https://goldberry.dev/docs/contributing/testing.html#the-gpu-tests
// ============================================================================
nativeTests.gpuTests('dev.goldberry.gpu')

// The video measurement: a 4K picture's planes uploaded, converted and
// composited under the UI every frame, on a real window. Run on purpose and
// read by a person; not part of `check`.
// https://goldberry.dev/docs/components/gpu.html#what-is-measured-and-what-is-not-yet
nativeTests.probe('gpuVideoProbe', 'dev.goldberry.gpu.render.GpuVideoProbe',
        'Measures a composited frame with a 4K video layer on a real window.')

// The video layer's measurement: what it costs the UI thread to show a new 4K
// picture every frame.
nativeTests.probe('videoLayerProbe', 'dev.goldberry.gpu.video.VideoLayerProbe',
        'Measures the video layer\'s upload of a 4K picture each frame.')
