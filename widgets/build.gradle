plugins {
    id 'goldberry.java-conventions'
    // Published to Maven Central as goldberry-widgets.
    id 'goldberry.publish'
    // Collects this module's @Markup widgets into a WidgetCatalog and declares
    // it in the module descriptor.
    // https://goldberry.dev/docs/weaving.html#the-two-halves
    id 'goldberry.weave'
    // A control's tests shape text, and shaping is HarfBuzz: they run against
    // the library this build just produced, not a stale one and not none.
    id 'goldberry.native-tests'
}

description = 'Goldberry widgets: the widget catalog, charts included'

dependencies {
    api project(':core')

    // The golden comparator and the rasterizer guard, shared rather than copied:
    // two tolerances would drift, and the tolerance is what lets one reference
    // set serve every platform.
    // https://goldberry.dev/docs/contributing/testing.html#goldens
    testImplementation testFixtures(project(':core'))

    // ArchUnit, for the boundary rules.
    // https://goldberry.dev/docs/contributing/testing.html#static-analysis
    //
    // Here rather than in :core because this is the module whose test classpath
    // holds the *whole* graph -- common, natives, core and widgets -- and a rule
    // saying ":natives must not reach :core" can only be asserted somewhere that
    // can see both. :gpu is deliberately absent from that classpath (see below),
    // and is deliberately absent from the rules for the same reason.
    testImplementation libs.archunit.junit6

    // jqwik, for the round-trip properties.
    testImplementation libs.jqwik
}

// Deliberately no dependency on :gpu. The gallery module this replaced had one,
// but a published widget library must not drag SDL_GPU into every consumer --
// the canvas3d showcase belongs in :gpu itself.

def skipNative = providers.gradleProperty('goldberry.skipNative')
        .map { Boolean.parseBoolean(it) }
        .getOrElse(false)

// ============================================================================
// Coverage floor
// https://goldberry.dev/docs/contributing/testing.html#advisory-dashboards
//
// Higher than :core's, and it should be: a widget is a value with a `build`
// method, and the catalog is the part of this project a unit test reaches
// without a frame. See :core's note for why these are a ratchet.
// ============================================================================
tasks.named('jacocoTestCoverageVerification') {
    // Measured with libgoldberry loaded, so only meaningful with it. Under
    // -Pgoldberry.skipNative every test that shapes, paints or parses skips, and
    // the figure drops to roughly half -- a gate no Java-only build can pass. The
    // Linux verify job runs it against the real library instead.
    onlyIf('the native library is part of this build') { !skipNative }
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 0.87 }
            limit { counter = 'BRANCH'; minimum = 0.71 }
        }
    }
}
