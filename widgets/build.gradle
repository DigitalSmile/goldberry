plugins {
    id 'goldberry.java-conventions'
    // Collects this module's @Markup widgets into a WidgetCatalog and declares
    // it in the module descriptor (ADR-0131).
    id 'goldberry.weave'
}

description = 'Goldberry widgets: the widget catalog, charts included'

dependencies {
    api project(':core')

    // The golden comparator and the rasterizer guard, shared rather than copied:
    // two tolerances would drift, and the tolerance is the whole argument of
    // ADR-0050.
    testImplementation testFixtures(project(':core'))
}

// Deliberately no dependency on :gpu. The gallery module this replaced had one,
// but a published widget library must not drag SDL_GPU into every consumer --
// the canvas3d showcase belongs in :gpu itself. See ADR-0014.

// A control's tests shape text, and shaping is HarfBuzz. Same wiring :core has
// and for the same reason: the tests must run against the library this build
// just produced, not a stale one and not none. Without it every test that
// touches a font skips quietly, which looks exactly like passing.
evaluationDependsOn(':natives')

def hostNativeLibrary = project(':natives').ext.hostNativeLibrary

tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    // Forwarded to the forked test JVM, because that is where the tests run.
    // Without this `-Dgoldberry.golden.update=true` reaches the Gradle daemon
    // and stops there, and the flag looks like it does nothing -- which is
    // exactly how it behaved in :core the first time it was tried.
    ['goldberry.golden.update', 'goldberry.golden.scales',
     'goldberry.golden.scales.report', 'goldberry.native.required'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }

    systemProperty 'goldberry.native.library',
            providers.systemProperty('goldberry.native.library')
                    .orElse(hostNativeLibrary.map { it.asFile.absolutePath })
                    .get()

    // An input, so a rebuilt library re-runs them rather than leaving them
    // UP-TO-DATE and green against a library they never saw.
    inputs.files(providers.provider {
        var library = file(providers.systemProperty('goldberry.native.library')
                .orElse(hostNativeLibrary.map { it.asFile.absolutePath })
                .get())
        library.isFile() ? [library] : []
    }).withPropertyName('nativeLibrary').optional()
}

def skipNative = providers.gradleProperty('goldberry.skipNative')
        .map { Boolean.parseBoolean(it) }
        .getOrElse(false)
def externalLibrary = providers.systemProperty('goldberry.native.library').isPresent()

if (!skipNative && !externalLibrary) {
    tasks.withType(Test).configureEach { dependsOn ':natives:cmakeBuild' }
}
