plugins {
    id 'goldberry.java-conventions'
    // Not published, for the reason :media is not: it is a set of providers for
    // a module that is not on Maven Central yet (docs/media-plan.md).
}

description = 'Goldberry media platform decoders: the operating system\'s own codecs behind the Decoder SPI'

// ============================================================================
// goldberry-media-platform (docs/goldberry-media.md §5, ADR-0472)
//
// DecoderProviders over the decoders the operating system ships and holds the
// licences for: VideoToolbox and AudioToolbox on macOS today. It binds the
// system frameworks itself, as :media binds FFmpeg (ADR-0461): the frameworks
// are part of the OS, so there is nothing to build, package or unpack, and the
// module is plain Java.
//
// An application opts in by putting it on the module path. Nothing depends on
// it, and on a system it has no decoders for, its providers support nothing.
// ============================================================================
evaluationDependsOn(':media')
evaluationDependsOn(':natives')

dependencies {
    // The Decoder SPI. `api` because the providers are DecoderProviders, and
    // `PlatformDecoders` hands them out as such.
    api project(':media')

    // Logging (ADR-0174).
    implementation project(':common')

    // :media's own test helpers: a MediaIO over bytes, a sink that plays in no
    // time, and the rule for skipping without FFmpeg. The end-to-end tests demux
    // with :media's FFmpeg and decode with the operating system.
    testImplementation rootProject.project(':media').sourceSets.test.output
}

def hostTargetId = project(':natives').ext.hostNativeTargetId
def hostNativeLibrary = project(':natives').ext.hostNativeLibrary

// The FFmpeg :media's tests use, found the way :media finds it: a property, or
// the superbuild's install directory (`./gradlew :media:ffmpegBuild`).
def ffmpegDirectory = providers.systemProperty('goldberry.media.libdir')
        .orElse(providers.gradleProperty('goldberry.media.libdir'))
        .orElse(project(':media').layout.buildDirectory.dir("ffmpeg/${hostTargetId}/install/lib")
                .map { it.asFile.absolutePath })

tasks.withType(Test).configureEach {
    // JEP 472: the framework lookups and the decoders' callbacks. ALL-UNNAMED
    // because whitebox tests run on the class path.
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    systemProperty 'goldberry.media.libdir', ffmpegDirectory.get()
    // libgoldberry, which :media's classes link against for the SDL sink; the
    // tests here play into a virtual sink, but the class path is :media's.
    systemProperty 'goldberry.native.library',
            providers.systemProperty('goldberry.native.library')
                    .orElse(hostNativeLibrary.map { it.asFile.absolutePath })
                    .get()
    environment 'SDL_AUDIO_DRIVER', 'dummy'

    // `goldberry.media.required` turns a skip for want of FFmpeg into a failure,
    // as in :media; `goldberry.platform.required` does the same for want of the
    // operating system's decoders, for a macOS job whose purpose is them
    // (ADR-0016).
    ['goldberry.media.required', 'goldberry.platform.required'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }
}

// The floor holds where the decoders run: on a Mac, with :media's FFmpeg built
// to demux the fixtures. Elsewhere the bindings and decoders are never reached,
// and a floor over them would measure the operating system, not the tests.
tasks.named('jacocoTestCoverageVerification') {
    onlyIf('macOS, with FFmpeg built for this machine') {
        System.getProperty('os.name', '').toLowerCase(Locale.ROOT).startsWith('mac') &&
                new File(ffmpegDirectory.get(), 'ffmpeg-layout.properties').isFile()
    }
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 0.85 }
            limit { counter = 'BRANCH'; minimum = 0.72 }
        }
    }
}

// ============================================================================
// What a native image of this module has to be told (ADR-0339)
//
// `:media:foreignMetadata` for the system frameworks: generated from the
// bindings, not traced from a run, so it is complete on any operating system.
// Every binding class is initialised, which links every descriptor and opens no
// framework. The file travels in the jar under META-INF/native-image/, beside
// :media's own.
// ============================================================================
def foreignMetadataDir = layout.buildDirectory.dir('generated/foreign-metadata')
def foreignMetadataFile = foreignMetadataDir.map {
    it.file('META-INF/native-image/io.github.digitalsmile/goldberry-media-platform/reachability-metadata.json')
}

def foreignMetadata = tasks.register('foreignMetadata', JavaExec) {
    group = 'build'
    description = 'Writes the foreign-call registrations an image of this module needs, from the bindings.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.digitalsmile.goldberry.media.platform.macos.PlatformForeignMetadata'
    // Linking a descriptor is restricted, and the generator links every one.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    inputs.files(sourceSets.main.output.classesDirs).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(foreignMetadataDir)
    argumentProviders.add({ [foreignMetadataFile.get().asFile.absolutePath] } as CommandLineArgumentProvider)
}

tasks.named('jar') {
    from(foreignMetadata)
}
