# What an image of anything using :vector has to be told, travelling with the
# module, as :natives' own does. The foreign calls and the natives jar's glob
# are in reachability-metadata.json beside this file, which
# `:vector:foreignMetadata` writes into the jar from the bindings.
# https://goldberry.dev/docs/native.html#what-the-flags-are-for
#
# --initialize-at-build-time=dev.goldberry.vector.thorvg.calls
#     The holders: each FD_<symbol> handle depends on nothing but a
#     FunctionDescriptor, so it is linked while the image is built and is a
#     constant the compiler lowers into a direct call. Initialised at run time,
#     every one is an interpreted lambda form, hundreds of times slower. A
#     PACKAGE, because a holder is a nested class; the package holds nothing
#     else, so a holder added tomorrow is covered.
#     Downcalls too: it holds the shared Linker, and a holder's initialiser calls
#     Downcalls.link.
#
# --initialize-at-run-time=dev.goldberry.vector.thorvg.VectorNatives,
#                         dev.goldberry.vector.thorvg.VectorNatives$Holder
#     The holder opens libgoldberry-vector, which must happen in the process
#     that runs and not in the builder. A nested class is a class of its own,
#     so both are named.
#
# --initialize-at-run-time=dev.goldberry.vector.thorvg.ThorvgEngine
#     It holds the Cleaner that releases pictures nobody closed, and a Cleaner
#     starts a thread: one in the image heap would be a thread the builder
#     started. It also holds whether ThorVG's engine was started, which is a
#     fact about the running process.
#
# VectorNativeImagePropertiesTest holds this file to the packages and classes
# it names.
Args = --initialize-at-build-time=dev.goldberry.vector.thorvg.Downcalls \
       --initialize-at-build-time=dev.goldberry.vector.thorvg.calls \
       --initialize-at-run-time=dev.goldberry.vector.thorvg.VectorNatives \
       --initialize-at-run-time=dev.goldberry.vector.thorvg.VectorNatives$Holder \
       --initialize-at-run-time=dev.goldberry.vector.thorvg.ThorvgEngine
