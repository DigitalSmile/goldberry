<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="80">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" spreadMethod="reflect">
      <stop offset="0" stop-color="#f00"/>
      <stop offset="40%" stop-color="yellow" stop-opacity="0.5"/>
      <stop offset="1" style="stop-color: rgb(0, 0, 255)"/>
    </linearGradient>
    <linearGradient id="derived" xlink:href="#base" gradientTransform="rotate(30)" x2="0.3"/>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%" fx="30%" fy="30%" spreadMethod="repeat">
      <stop offset="0" stop-color="white"/>
      <stop offset="0.5" stop-color="#0a0"/>
      <stop offset="1" stop-color="black" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="120" y2="80" href="#base"/>
  </defs>
  <rect width="58" height="38" fill="url(#base)"/>
  <rect x="62" width="58" height="38" fill="url(#derived)" stroke="url(#glow)" stroke-width="3"/>
  <circle cx="30" cy="60" r="18" fill="url(#glow)"/>
  <rect x="60" y="44" width="58" height="34" fill="url(#user)"/>
</svg>
