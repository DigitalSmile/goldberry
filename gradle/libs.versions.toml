[versions]
# Java 25 LTS is the floor: FFM is final, and the blur path needs the Vector API.
# See docs/ARCHITECTURE.md §3.2.
java = "25"
junit = "6.0.0"

# --- Native dependencies (docs/ARCHITECTURE.md §3) ---------------------------
# Git refs consumed by the CMake superbuild. These are pins, not ranges: a
# floating ref would make the artifact irreproducible.
#
# These refs build and link on linux-x64. Blend2D and AsmJit have no release
# tags, so they are pinned by branch -- which means the build is NOT yet
# reproducible. Both must become commit SHAs before anything is published.
blend2d = "master"
# AsmJit is Blend2D's JIT backend, embedded into it rather than linked. Its ref
# must suit the Blend2D ref above -- Blend2D compiles asmjit's sources directly.
asmjit = "master"
yoga = "v3.1.0"
harfbuzz = "8.5.0"
sdl3 = "release-3.2.0"
xkbcommon = "xkbcommon-1.6.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
