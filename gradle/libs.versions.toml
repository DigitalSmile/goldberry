[versions]
# Java 25 LTS is the floor: FFM is final, and the blur path needs the Vector API.
# https://goldberry.dev/docs/contributing/building.html#the-jdk
java = "25"
junit = "6.1.3"

# --- The test tool-chain ------------------------------------------------------
# https://goldberry.dev/docs/contributing/testing.html#the-test-kinds
# ArchUnit asserts the module graph and the native boundary -- rules that were
# prose until something enforced them.
archunit = "1.5.1"
# jqwik covers the round-trip properties. It is a second JUnit engine
# rather than a library, which is why the platform launcher matters below.
jqwik = "1.10.2"
# JaCoCo for coverage. Pinned to a version that reads JDK 25 class files --
# an older one fails with "Unsupported class file major version".
jacoco = "0.8.15"

# --- Publishing ---------------------------------------------------------------
# Central Portal uploads, snapshots and in-memory signing. Resolved from Maven
# Central rather than the plugin portal, whose marker stopped at 0.13.
mavenPublishPlugin = "0.37.0"

# --- Static analysis ----------------------------------------------------------
# https://goldberry.dev/docs/contributing/testing.html#static-analysis
spotless = "8.10.4"
palantirFormat = "2.102.0"
errorprone = "5.1.1"
errorproneCore = "2.51.0"
nullaway = "0.14.3"
jspecify = "1.0.1"
# The Gradle plugin and the SpotBugs tool version independently: 6.5.13 is the
# plugin, 4.10.5 is the analyser it runs.
spotbugsPlugin = "6.5.13"
spotbugs = "4.10.5"
# PIT runs through its own command line rather than `gradle-pitest-plugin`, so
# there is no plugin version here to go with it -- the `pitestPlugin` entry that
# used to sit above was read by nothing (the 2026-09-18 review, B12).
pitest = "1.30.1"
pitestJunit5 = "1.2.3"
# The analyser the conventions plugin runs. In the catalog like every other tool
# version, rather than a literal in the plugin.
pmd = "7.28.0"
jmhPlugin = "0.7.3"
jmh = "1.37"

# SLF4J is the only compile-time logging dependency the toolkit has: a facade, so
# applications choose the implementation. Goldberry binds no backend of its own.
# Logback is the showcase's choice, and reaches nothing else.
slf4j = "2.0.20"
logback = "1.6.5"

# --- Native dependencies ------------------------------------------------------
# https://goldberry.dev/docs/contributing/building.html#the-native-superbuild
# Git refs consumed by the CMake superbuild. These are pins, not ranges: a
# floating ref would make the artifact irreproducible.
#
# Blend2D and AsmJit have no release tags at all, so they are pinned by **commit
# SHA** rather than by branch. A SHA is not a worse pin than a tag
# here -- it is a better one, since a tag can be moved and a SHA cannot. The cost
# is that moving either forward is a deliberate edit, which is the point.
#
# Whoever moves them: update this file and nothing else -- CMakeLists.txt reads
# it directly and the CI workflows pass no refs -- then rebuild from a
# clean _deps (`./gradlew :natives:cleanNativeDeps`). `./gradlew
# :natives:checkPinnedRefs` fails if a second copy of any ref reappears.
#
# Blend2D master @ 2026-09-05 -- "[ver] Blend2D v0.21.3" ("Adapted to a new AsmJit
# version"), the only commit past the previous pin.
blend2d = "58ca9460b4138af6e793184682e9324e0a8053b2"
# AsmJit is Blend2D's JIT backend, embedded into it rather than linked, so
# Blend2D compiles asmjit's sources directly and the two refs must suit each
# other. There is no manifest saying which pairs work -- only that this pair
# builds and links, which is exactly why both are pinned together.
#
# AsmJit master @ 2026-09-05 -- "[abi] ABI tag updated to v1_22 to reflect version
# 1.22.0", the commit Blend2D v0.21.3 was adapted to. Later AsmJit commits (the
# v1.23 arm64e ABI bump among them) postdate that Blend2D release, so nothing
# upstream says they pair with it yet.
asmjit = "6a6cca88d6dccef4c5c1d258b9e12d8699dff842"
yoga = "v3.2.1"
harfbuzz = "15.0.0"
sdl3 = "release-3.4.18"
# md4c is the Markdown parser behind `goldberry-html`'s markdown half.
# One C file, MIT, CommonMark plus the four extensions GitHub's dialect adds, and
# it is compiled straight into libgoldberry rather than into a native of its own.
#
# Upstream's tags went from `release-X.Y.Z` to `vX.Y.Z` with 0.6.0; there is no
# `release-0.6.0`. 0.6.0 also inserted MD_SPAN_INS into the middle of
# MD_SPANTYPE, which is why `SpanType` moved with this pin.
md4c = "v0.6.0"
# libwebp is the reference WebP decoder, and it is here because the toolkit's
# rasterizer ships PNG, JPEG and QOI and nothing else -- so a screenshot, which in
# 2026 is what most tools write, does not decode.
# Only `webpdecoder` is built and linked: the encoder, the muxer, the demuxer, the
# animation support and every command-line tool are off, because Goldberry reads
# one still frame and writes PNG.
libwebp = "v1.6.0"
# webview/webview is the engine behind `web-view`. MIT, and one 4500-line header
# with the implementation in it -- it brings no engine of its own, driving the
# desktop's: WebKitGTK, WebView2 or WKWebView. It is the one upstream here that is
# NOT compiled into libgoldberry: it goes into `libgoldberry-webview` beside it,
# linked into nothing and opened on demand, because GTK and WebKit must not become
# load-time dependencies of every application that ever used the toolkit.
webview = "0.12.0"
# The Microsoft WebView2 SDK -- Windows only, and headers only.
#
# WebView2 is two things with one name. The *runtime* is Edge and ships with
# Windows; the *SDK header* `WebView2.h`, which `webview.h` includes by name,
# ships only in this NuGet package. Nothing from it is linked and nothing from it
# is shipped: `WebView2Loader.dll` is resolved with LoadLibrary at run time.
#
# This is the version webview 0.12.0 pins and therefore tests against, which is
# why it is a 2022 date rather than the newest available.
webview2 = "1.0.1150.38"
# `goldberry-media`'s engine: the reference decoders, bound directly,
# https://goldberry.dev/docs/components/media.html#the-module.
# Built by the media superbuild in media/src/main/cmake, NOT by the
# libgoldberry one: a shared library of its own, `libgoldberry-media`, shipped
# in a natives jar of its own, so that an application which plays no media
# carries none of it. Every one of these is BSD or CC0, linked statically into
# that one library, and nothing here is LGPL.
#
# The demuxers, the clock and the I/O are Java. These are the codecs and the
# colour conversion only.
dav1d = "1.5.4"
libvpx = "v1.17.0"
opus = "v1.6.1"
ogg = "v1.3.6"
vorbis = "v1.3.7"
flac = "1.5.0"
# libyuv and minimp3 cut no releases: pinned by commit, as Blend2D is.
# libyuv's is the head of its `stable` branch; minimp3's its master.
libyuv = "eb6e7bb63738e29efd82ea3cf2a115238a89fa51"
minimp3 = "ea99364f61c14656440e8d77e9c233ccf3124633"
# The commit dav1d's tag names: the superbuild refuses a clone that is not at it,
# because a tag can be moved. Moving the tag above means moving this too.
dav1dCommit = "54706fc6bc0cdecab7e9593974a4039cc038fca7"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorproneCore" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

[plugins]
# Applied by :core only -- see its build script. The other analysis plugins are
# applied by the conventions plugin and so are ordinary dependencies of
# build-logic rather than entries here.
jmh = { id = "me.champeau.jmh", version.ref = "jmhPlugin" }
