import io.github.digitalsmile.goldberry.build.LinuxDependencies
import io.github.digitalsmile.goldberry.build.ToolResolver
import io.github.digitalsmile.goldberry.build.toolchain.WindowsToolchain

plugins {
    id 'goldberry.java-conventions'
    // Published to Maven Central as goldberry-natives (ADR-0334).
    id 'goldberry.publish'
}

description = 'Goldberry native layer: hand-written FFM bindings and the libgoldberry superbuild'

// Logging and the start-up timeline, which this module uses and does not own.
// `api` because module-info says `requires`, so it has to be on the module path
// of anything compiling against :natives (ADR-0174).
dependencies {
    api project(':common')
}

// ============================================================================
// Native build (ADR-0012)
//
// Every artifact is built on a native runner; there is no cross-compilation.
// The tasks here build libgoldberry for the HOST only -- they are the local
// development path. CI invokes CMake directly on each runner, because the Linux
// legs build inside a manylinux container that has no JDK.
//
// Consequence worth remembering: a locally built library links against this
// machine's glibc, so it is NOT the published artifact. Only the container build
// is shippable. See ADR-0012.
//
// Nothing here runs as part of `./gradlew build` -- the native build needs CMake,
// Ninja, a C/C++ toolchain, and network access, and Java-only contributors should
// not need any of them.
// ============================================================================

// One row of the §15 distribution matrix. Four rows, not six: Windows on ARM and
// macOS on Intel are not built (ADR-0041), and `NativePlatform` refuses those two
// pairs on the Java side so the two lists cannot drift into disagreement.
def nativeTargets = [
        [id: 'linux-x64', library: 'libgoldberry.so'],
        [id: 'linux-aarch64', library: 'libgoldberry.so'],
        [id: 'windows-x64', library: 'goldberry.dll'],
        [id: 'macos-aarch64', library: 'libgoldberry.dylib'],
]

// `linux-x64` -> `LinuxX64`, for task names.
def taskSuffix = { String id -> id.split('-').collect { it.capitalize() }.join('') }

// The target this machine builds natively. Mirrors `NativePlatform` on the Java
// side; the two are asserted to agree by `NativeLibraryTest`.
def hostTarget = {
    def osName = System.getProperty('os.name', '').toLowerCase()
    def osArch = System.getProperty('os.arch', '').toLowerCase()

    def osToken
    if (osName.contains('linux')) {
        osToken = 'linux'
    } else if (osName.contains('mac') || osName.contains('darwin')) {
        osToken = 'macos'
    } else if (osName.contains('windows')) {
        osToken = 'windows'
    } else {
        throw new GradleException("Goldberry has no native target for os.name=\"${osName}\"")
    }

    def archToken
    if (osArch in ['amd64', 'x86_64', 'x64']) {
        archToken = 'x64'
    } else if (osArch in ['aarch64', 'arm64']) {
        archToken = 'aarch64'
    } else {
        throw new GradleException("Goldberry has no native target for os.arch=\"${osArch}\"")
    }

    def id = "${osToken}-${archToken}"
    def target = nativeTargets.find { it.id == id }
    if (target == null) {
        throw new GradleException("No native target declared for ${id}")
    }
    return target
}()

def nativeGroup = 'native'
def cmakeSourceDir = layout.projectDirectory.dir('src/main/cmake')
def cmakeWorkDir = layout.buildDirectory.dir("native/${hostTarget.id}/cmake")
def installDir = layout.buildDirectory.dir("native/${hostTarget.id}/install")

// Published so :core's tests can find the locally built library without
// re-deriving the host target. The alternative was duplicating the detection
// above in a second build file, where it would drift the first time a target is
// added -- and the two disagreeing means :core silently testing against a
// library that is not the one :natives just built. See ADR-0031.
ext.hostNativeLibrary = installDir.map { it.dir('lib').file(hostTarget.library) }
ext.hostNativeTargetId = hostTarget.id

// Where FetchContent clones the seven upstreams -- roughly 330 MB, and several
// minutes on a cold cache (ADR-0038).
//
// Deliberately OUTSIDE build/: `./gradlew clean` would otherwise discard every
// byte of it, and the next build would re-clone from scratch. That is the whole
// reason this is not just `build/native/<target>/cmake/_deps`, which is where
// FetchContent puts it by default.
//
// Per target, because the base directory also holds the generator-specific
// `<name>-build` and `<name>-subbuild` trees; two targets sharing one would
// collide. `cleanNativeDeps` is the way to discard it on purpose.
def depsDir = providers.gradleProperty('goldberry.depsDir')
        .map { file(it) }
        .orElse(layout.projectDirectory.dir(".deps/${hostTarget.id}").asFile)

// Where CI drops the libraries downloaded from every runner, so one job can
// assemble all four classifier jars. Locally only the host's directory exists.
def artifactsDir = providers.gradleProperty('goldberry.artifactsDir')
        .map { file(it) }
        .orElse(layout.buildDirectory.dir('native-artifacts').map { it.asFile })

// --- Locating the tools ------------------------------------------------------
//
// Every tool below is invoked by ABSOLUTE path. Never by bare name, and this is
// not tidiness -- `Exec` cannot be trusted to find one (ADR-0040).
//
// Gradle passes an explicit environment map to every process it starts, which
// makes the JDK resolve the executable through `execvpe` against a snapshot of
// the JVM's *native* PATH taken at start-up, rather than through `execvp`
// against the PATH the build can see. The Gradle daemon outlives the shell that
// started it, so Gradle rewrites what `System.getenv()` reports to match the
// current client -- but not the native environ underneath, and not the snapshot.
//
// A daemon first started by an IDE therefore carries launchd's
// `PATH=/usr/bin:/bin:/usr/sbin:/sbin` forever. `checkToolchain` used to probe
// with a plain ProcessBuilder, find cmake, and print "Native toolchain OK"; the
// very next task then failed with `Exec failed, error: 2 (No such file or
// directory)` naming the cmake it had just run. The check and the use were
// asking different layers of the JDK. Now they both ask this.
def toolPath = providers.environmentVariable('PATH')
        .orElse(providers.environmentVariable('Path'))    // Windows spells it differently
        .getOrElse('')

// Which tools were pointed at explicitly, so a failure can say "the path you
// gave me is wrong" rather than "I searched everywhere" -- which would be a lie
// when an override was set.
def toolOverrides = [:]

// `-Pgoldberry.cmake=/path/to/cmake` (or `-D`) overrides the search, for a
// toolchain in a place no convention covers. Taken at its word: an override that
// quietly fell back to something found on the PATH would be an override that
// does not override.
def resolveTool = { String name ->
    def override = providers.gradleProperty("goldberry.${name}")
            .orElse(providers.systemProperty("goldberry.${name}"))
    if (override.present) {
        toolOverrides[name] = override.get()
    }
    var found = ToolResolver.resolve(
            override.getOrElse(name),
            toolPath,
            System.getProperty('os.name', ''),
            System.getProperty('user.home', ''))
    return found.isPresent() ? found.get().toFile() : null
}

// Resolved at configuration time because `Exec.commandLine` needs a value then.
// A tool that is absent resolves to null rather than failing here -- checkToolchain
// owns that error, and it says considerably more than a NullPointerException.
// Builds a library without the desktop integrations whose headers are missing,
// instead of stopping (`-Pgoldberry.allowDegradedPlatform=true`).
//
// The stop is the default because the alternative is what docs/gaps.md G32 is: a
// configure that quietly produced a libgoldberry which could not ask the desktop
// whether it was set to dark, on any Linux machine, for as long as it was
// shipped. The escape hatch exists because "cannot install a -dev package right
// now" is a real situation and a toolkit that cannot be built at all in it is
// worse -- and because a library built this way is no longer silent about it:
// `Goldberry.capabilities()` reports what it has and the backend warns at
// start-up (ADR-0325).
def allowDegradedPlatform = providers.gradleProperty('goldberry.allowDegradedPlatform')
        .map { Boolean.parseBoolean(it) }
        .getOrElse(false)

def cmakeExecutable = resolveTool('cmake')
def ninjaExecutable = resolveTool('ninja')

// On Windows the compiler is resolved too, and handed to CMake by path. Left to
// its own search, CMake's Ninja generator takes the first `cc` on the PATH --
// which on a GitHub runner is MinGW's, because `cl` is only on the PATH inside a
// Developer Command Prompt. That build configured without complaint and wrote a
// `libgoldberry.dll` nothing here looks for (ADR-0338). `checkToolchain` owns the
// error when this is null.
def onWindowsHost = hostTarget.id.startsWith('windows')
def msvcExecutable = onWindowsHost ? resolveTool(WindowsToolchain.COMPILER) : null

// --- Toolchain check ---------------------------------------------------------
// Fails with instructions rather than with a cryptic CMake error 200 lines into
// a configure run.
def checkToolchain = tasks.register('checkToolchain') {
    group = nativeGroup
    description = 'Verifies that the native build tools are installed and usable.'

    // Linux is where SDL has X11 and Wayland backends to satisfy; the header
    // checks below are all about those.
    def onLinux = hostTarget.id.startsWith('linux')

    doLast {
        def probe = { String tool, String... args ->
            try {
                def process = new ProcessBuilder([tool, *args])
                        .redirectErrorStream(true)
                        .start()
                def output = process.inputStream.text.trim()
                return process.waitFor() == 0 ? output.readLines().first().trim() : null
            } catch (Exception ignored) {
                return null
            }
        }

        // Separate from `probe`: a successful `pkg-config --exists` prints
        // nothing, so judging it by its output would report every package as
        // absent. Exit status is the only signal here.
        def succeeds = { String tool, String... args ->
            try {
                def process = new ProcessBuilder([tool, *args])
                        .redirectErrorStream(true)
                        .start()
                process.inputStream.text
                return process.waitFor() == 0
            } catch (Exception ignored) {
                return false
            }
        }

        // Name -> resolved executable, or null if the search found nothing.
        def required = [cmake: cmakeExecutable, ninja: ninjaExecutable]

        // Absent, or present and not runnable -- a stale symlink into a Homebrew
        // Cellar that `brew cleanup` removed passes an existence check and fails
        // to exec, which is precisely the class of error this task exists to
        // catch early.
        def missing = required.findAll { name, executable ->
            executable == null || probe(executable.absolutePath, '--version') == null
        }.keySet()

        if (!missing.isEmpty()) {
            def hint = switch (ToolResolver.familyOf(System.getProperty('os.name', ''))) {
                case ToolResolver.Family.MACOS -> 'brew install cmake ninja'
                case ToolResolver.Family.WINDOWS -> 'winget install Kitware.CMake Ninja-build.Ninja'
                default -> 'sudo apt install cmake ninja-build    (Debian/Ubuntu)'
            }
            // An override that points at nothing is a different problem from a
            // tool that is not installed, and deserves a different sentence.
            def overridden = missing.findAll { toolOverrides.containsKey(it) }
            // Concatenated rather than interpolated: `stripIndent` runs after
            // interpolation, so a multi-line insert would take the indentation
            // of every other line down with it.
            def where = overridden.isEmpty()
                    ? 'Searched the PATH and the usual install directories. If it is installed\n' +
                      'somewhere else, point at it directly:\n' +
                      '  ./gradlew build -Pgoldberry.cmake=/path/to/cmake'
                    : 'Not an executable file:\n' + overridden.collect {
                        "  -Pgoldberry.${it}=${toolOverrides[it]}"
                    }.join('\n')

            throw new GradleException("""\
                Missing native build tools: ${missing.join(', ')}

                The superbuild needs CMake >= 3.28 and Ninja.
                  ${hint}

                """.stripIndent() + where)
        }

        // Version floors, not just presence. An upstream that needs a newer tool
        // than the distribution ships is not hypothetical -- libxkbcommon used to
        // force Meson >= 1.4 here, against the 1.3.2 Ubuntu 24.04 ships, and
        // failed ninety seconds into the build from inside meson (ADR-0055).
        // That dependency is gone; the mechanism stays, because the next one
        // will not announce itself either.
        def versionOf = { String tool ->
            // Through `required`, so this runs the same executable the build will,
            // rather than whichever copy a bare-name lookup happens to reach.
            def line = probe(required[tool].absolutePath, '--version')
            def match = line =~ /(\d+)\.(\d+)(?:\.(\d+))?/
            return match ? [match[0][1], match[0][2], match[0][3] ?: '0']*.toInteger() : null
        }
        def atLeast = { List actual, List floor ->
            if (actual == null) {
                return true    // unparseable: not this check's business to guess
            }
            for (var i = 0; i < 3; i++) {
                if (actual[i] != floor[i]) {
                    return actual[i] > floor[i]
                }
            }
            return true
        }

        // tool, floor, why, how
        def floors = [['cmake', [3, 28, 0], 'the superbuild', 'pip install --upgrade cmake']]

        def tooOld = floors.findAll { !atLeast(versionOf(it[0]), it[1]) }
        if (!tooOld.isEmpty()) {
            // The `+` stays at the END of the line. Moved to the start of the
            // next one, Groovy closes the statement at the first string and reads
            // the continuation as unary plus -- `String.positive()`, which does
            // not exist. It only fires when a tool really is too old, so it hides
            // in exactly the path that was meant to produce a helpful message.
            def detail = tooOld.collect { row ->
                "  ${row[0]} ${versionOf(row[0]).join('.')} -- ${row[2]} needs" +
                        " >= ${row[1].join('.')}\n    ${row[3]}"
            }.join('\n')
            throw new GradleException("Native build tools are too old:\n" + detail + "\n")
        }

        // Development headers. Without this check a missing one surfaces minutes
        // into the build, from inside SDL3's CMake, naming a pkg-config
        // module rather than a package -- so the error tells you what is absent
        // but not what to install.
        //
        // The table itself lives in `LinuxDependencies`, in build-logic, and is
        // unit-tested there against the packages CI installs. It used to be a
        // literal here, and it drifted: XScrnSaver was listed under the module
        // name `xss`, which nothing ships a .pc file for, and marked optional --
        // while SDL's CheckX11 treats it as a hard stop. The check therefore
        // passed, and the build died two minutes later inside SDL. See ADR-0082.
        if (onLinux) {
            def absent = LinuxDependencies.ALL.findAll {
                !succeeds('pkg-config', '--exists', it.module())
            }
            def manager = LinuxDependencies.managerFor(succeeds('sh', '-c', 'command -v dnf'))

            // A build made WITHOUT a desktop integration, on purpose. There is one
            // legitimate reason to want it -- a machine that cannot install the
            // headers -- and the library it produces is not broken, it is lesser:
            // it reports the capability as absent and says so at start-up
            // (docs/gaps.md G32, ADR-0325). The same flag reaches CMake below, so
            // the two halves of the build cannot disagree about what was asked for.
            def absentRequired = absent.findAll {
                it.required() && !(allowDegradedPlatform && it.backsACapability())
            }
            if (!absentRequired.isEmpty()) {
                throw new GradleException(
                        LinuxDependencies.missingRequiredMessage(absentRequired, manager))
            }

            def absentOptional = absent.findAll {
                !it.required() || (allowDegradedPlatform && it.backsACapability())
            }
            if (!absentOptional.isEmpty()) {
                logger.warn(LinuxDependencies.missingOptionalMessage(absentOptional, manager))
            }
        }

        // MSVC, and not whatever `cc` happens to be first on the PATH. The
        // compiler CMake would have taken instead is named in the message, so
        // the reader learns what the build would have quietly done.
        if (onWindowsHost && msvcExecutable == null) {
            def standIn = ['cc', 'gcc', 'clang'].collect { resolveTool(it) }.find { it != null }
            throw new GradleException(
                    WindowsToolchain.missingCompilerMessage(Optional.ofNullable(standIn?.toPath())))
        }

        // Naming the executables, not just saying OK. When a machine has two
        // CMakes -- a system one and a Homebrew one, or a pip upgrade shadowing
        // both -- "which one did it use" is the first question, and printing the
        // answer costs a line.
        logger.lifecycle("Native toolchain OK; host target is ${hostTarget.id}.\n" +
                required.collect { name, executable ->
                    // `versionOf` returns null for output it cannot parse, which
                    // is tolerated above and must not become an NPE here.
                    def version = versionOf(name)?.join('.') ?: '?'
                    "  ${name.padRight(6)} ${version.padRight(8)} ${executable}"
                }.join('\n') +
                (msvcExecutable != null ? "\n  ${WindowsToolchain.COMPILER.padRight(6)} ${'MSVC'.padRight(8)} ${msvcExecutable}" : ''))
    }
}

// --- What a native image has to be told (ADR-0339) ---------------------------
//
// The foreign-call registrations, generated from the bindings rather than
// traced from a run. A holder's descriptor is a constant in its class, and the
// five upcall owners declare theirs, so the whole surface can be listed by
// initialising the classes -- which needs no libgoldberry. The file travels in
// the jar under META-INF/native-image/, where native-image finds it for any
// application that has this module on its module path; the showcase's traced
// metadata used to be the only source, and it held what 120 headless frames
// reached, which was not the Markdown parser.
def foreignMetadataDir = layout.buildDirectory.dir('generated/foreign-metadata')
def foreignMetadataFile = foreignMetadataDir.map {
    it.file('META-INF/native-image/io.github.digitalsmile/goldberry-natives/reachability-metadata.json')
}

def foreignMetadata = tasks.register('foreignMetadata', JavaExec) {
    group = 'build'
    description = 'Writes the foreign-call registrations an image of this module needs, from the bindings.'
    classpath = sourceSets.main.runtimeClasspath
    mainModule = 'io.github.digitalsmile.goldberry.natives'
    mainClass = 'io.github.digitalsmile.goldberry.natives.metadata.ForeignMetadata'
    modularity.inferModulePath = true
    // Linking a descriptor is a restricted operation, and the generator links
    // every one of them.
    jvmArgs '--enable-native-access=io.github.digitalsmile.goldberry.natives'
    inputs.files(sourceSets.main.output.classesDirs).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(foreignMetadataDir)
    argumentProviders.add({ [foreignMetadataFile.get().asFile.absolutePath] } as CommandLineArgumentProvider)
    doLast {
        def file = foreignMetadataFile.get().asFile
        def shapes = file.readLines().count { it.contains('"returnType"') }
        logger.lifecycle("Foreign metadata: ${shapes} descriptors -> ${file}")
    }
}

tasks.named('jar') {
    from(foreignMetadata)
}

// --- Pinned upstream refs ----------------------------------------------------
//
// Every ref lives in gradle/libs.versions.toml and nowhere else. CMake reads it
// directly (ADR-0035), so nothing here passes refs to the superbuild and the CI
// workflows do not either -- the manylinux container never needed a JDK to read
// the catalog, only something that can parse a text file, and CMake can.
//
// The copies used to be four, and drifting was survivable only if something
// noticed. Nothing did, which is how Blend2D stayed on a floating `master`
// through four ADRs: every copy agreed, and all four were wrong together. This
// check now guards the property that replaced them -- that there is no second
// copy to drift.

def catalogFile = rootProject.layout.projectDirectory.file('gradle/libs.versions.toml')
def workflowsDir = rootProject.layout.projectDirectory.dir('.github/workflows')

def refNames = ['BLEND2D', 'ASMJIT', 'YOGA', 'HARFBUZZ', 'SDL3', 'MD4C', 'LIBWEBP']

tasks.register('checkPinnedRefs') {
    group = 'verification'
    description = 'Fails if an upstream ref has been written down anywhere but the version catalog.'

    def cmakeLists = cmakeSourceDir.file('CMakeLists.txt')
    def workflows = workflowsDir.asFile.listFiles()
            ?.findAll { it.name.endsWith('.yml') || it.name.endsWith('.yaml') }
            ?.sort { it.name } ?: []

    inputs.file cmakeLists
    inputs.file catalogFile
    inputs.files workflows

    doLast {
        def problems = []

        // The catalog has to say something for each of them, since CMake now
        // fails hard rather than falling back to a default.
        def catalogText = catalogFile.asFile.text
        refNames.each { name ->
            def key = name.toLowerCase()
            def match = catalogText =~ /(?m)^\s*${key}\s*=\s*"([^"]*)"/
            if (!match) {
                problems << "the catalog has no `${key} = \"...\"` under [versions]"
            } else if (match[0][1] ==~ /master|main|HEAD|latest|trunk/) {
                problems << "the catalog pins ${key} to '${match[0][1]}', which floats (ADR-0030)"
            }
        }

        // `set(GOLDBERRY_YOGA_REF "v3.2.1" ...)` -- a default that came back.
        def cmakeText = cmakeLists.asFile.text
        refNames.each { name ->
            if (cmakeText =~ /set\(GOLDBERRY_${name}_REF\s+"/) {
                problems << "CMakeLists.txt hard-codes GOLDBERRY_${name}_REF;"
                        + " it should read the catalog instead"
            }
        }

        // Every workflow, not just the three that build natively: example.yml
        // was pinning Blend2D to a floating `master` precisely because nothing
        // looked at it.
        workflows.each { workflow ->
            def text = workflow.text
            refNames.each { name ->
                if (text =~ /(?m)^\s*${name}_REF:/) {
                    problems << "${workflow.name} sets ${name}_REF; the superbuild reads the catalog"
                }
                if (text.contains("GOLDBERRY_${name}_REF")) {
                    problems << "${workflow.name} passes -DGOLDBERRY_${name}_REF; it no longer needs to"
                }
            }
        }

        if (problems) {
            throw new GradleException(
                    "Upstream refs must live only in gradle/libs.versions.toml:\n  "
                            + problems.unique().join('\n  ')
                            + "\n\nA second copy is a copy that can drift, and a build that"
                            + " fetches something other than what was tested. See ADR-0035.")
        }
        logger.lifecycle(
                "Upstream refs live only in the catalog; checked CMake and ${workflows.size()} workflows.")
    }
}

tasks.named('check') { dependsOn 'checkPinnedRefs' }

// `ToolResolver` decides which cmake this module runs, and it lives in
// build-logic -- a separate build, whose tests do not run just because this one
// does. Wired in here rather than left to `./gradlew -p build-logic test`,
// because a test nobody runs is a test that does not hold.
tasks.named('check') { dependsOn gradle.includedBuild('build-logic').task(':test') }

// --- Host build --------------------------------------------------------------

def cmakeConfigure = tasks.register('cmakeConfigure', Exec) {
    group = nativeGroup
    description = "Configures the libgoldberry superbuild for ${hostTarget.id}."

    dependsOn checkToolchain
    inputs.dir cmakeSourceDir
    // The refs are not passed on the command line any more, so the catalog is
    // an input in its own right: bumping a pin has to reconfigure, or CMake
    // would keep building the last ref out of its cache. This is what the
    // per-ref input properties used to do -- same guarantee, one input, and it
    // covers a ref this build file does not know the name of (ADR-0035).
    inputs.file catalogFile
    // These two change the generated configuration without changing a single
    // input file, so without them a retarget would not re-configure.
    inputs.property 'targetId', hostTarget.id
    inputs.property 'depsDir', depsDir.map { it.absolutePath }
    // Toggling this changes what the library can do without changing an input
    // file, exactly like the two above.
    inputs.property 'allowDegradedPlatform', allowDegradedPlatform
    // A different compiler is a different configuration, cache and all.
    inputs.property 'compiler', msvcExecutable?.absolutePath ?: ''

    // Not `outputs.dir cmakeWorkDir`. That directory used to hold `_deps` as
    // well -- 7,500-odd files and 350 MB -- and Gradle fingerprinted the lot on
    // both sides of every run, which is its own several-second silent pause.
    // These two files are what "configured" actually means.
    outputs.file cmakeWorkDir.map { it.file('CMakeCache.txt') }
    outputs.file cmakeWorkDir.map { it.file('build.ninja') }

    // Absolute cmake, and an absolute CMAKE_MAKE_PROGRAM. Handing CMake the Ninja
    // this build resolved keeps the two agreeing: `checkToolchain` would
    // otherwise pass on a Ninja found in a conventional directory that CMake,
    // searching only the PATH, then failed to find (ADR-0040).
    def configureArguments = [
            '-S', cmakeSourceDir.asFile.absolutePath,
            '-B', cmakeWorkDir.get().asFile.absolutePath,
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_INSTALL_PREFIX=${installDir.get().asFile.absolutePath}".toString(),
            "-DGOLDBERRY_TARGET_ID=${hostTarget.id}".toString(),
            "-DFETCHCONTENT_BASE_DIR=${depsDir.get().absolutePath}".toString(),
            // No -DGOLDBERRY_*_REF: the superbuild reads gradle/libs.versions.toml
            // itself, which is the whole of ADR-0035.
    ]
    if (allowDegradedPlatform) {
        // The other half of the property above. Without this the toolchain check
        // would wave the missing headers through and CMake would stop on them a
        // minute later, which is a worse version of the same error.
        configureArguments << '-DGOLDBERRY_REQUIRE_PLATFORM_INTEGRATION=OFF'
    }
    if (ninjaExecutable != null) {
        configureArguments << "-DCMAKE_MAKE_PROGRAM=${ninjaExecutable.absolutePath}".toString()
    }
    if (msvcExecutable != null) {
        // By path, for the reason `msvcExecutable` exists at all: a search would
        // find MinGW first on a machine that has both.
        configureArguments.addAll(WindowsToolchain.cmakeArguments(msvcExecutable.toPath()))
    }
    // `?: 'cmake'` only to keep configuration from failing when no toolchain is
    // installed at all -- checkToolchain runs first and reports it properly.
    commandLine([cmakeExecutable?.absolutePath ?: 'cmake'] + configureArguments)

    // The first configure clones seven repositories and prints nothing useful
    // while it does. Say so before the silence rather than after it -- being
    // told "this takes minutes" is the difference between waiting and killing
    // the build (ADR-0038).
    doFirst {
        def cache = depsDir.get()
        if (!new File(cache, 'harfbuzz-src').isDirectory()) {
            logger.lifecycle("""\
                Goldberry: first native configure for ${hostTarget.id}.

                Cloning Blend2D, AsmJit, Yoga, HarfBuzz, SDL3, md4c and libwebp into
                  ${cache}
                -- about 330 MB, typically a few minutes on a warm connection.

                The cache survives `./gradlew clean`; `./gradlew :natives:cleanNativeDeps`
                is what discards it.""".stripIndent())
        }
    }
}

tasks.register('cleanNativeDeps', Delete) {
    group = nativeGroup
    description = 'Discards the cached upstream sources, forcing a fresh clone.'
    delete depsDir
}

def cmakeBuild = tasks.register('cmakeBuild', Exec) {
    group = nativeGroup
    description = "Builds libgoldberry for ${hostTarget.id}."

    dependsOn cmakeConfigure
    inputs.dir cmakeSourceDir
    // The generated configuration, not just the CMake sources: a version bump
    // re-configures, and re-configuring has to re-link.
    inputs.files cmakeConfigure
    outputs.dir installDir

    commandLine cmakeExecutable?.absolutePath ?: 'cmake',
            '--build', cmakeWorkDir.get().asFile.absolutePath,
            '--target', 'install'
}

// --- Packaging (§15 classifier jars) ----------------------------------------

nativeTargets.each { target ->
    tasks.register("nativeJar${taskSuffix(target.id)}", Jar) {
        group = nativeGroup
        description = "Packages libgoldberry for ${target.id} as a classifier jar."

        archiveBaseName = 'goldberry-natives'
        archiveClassifier = target.id

        def sourceDir = artifactsDir.map { new File(it, target.id) }
        // The layout here is what NativeLibrary.resourcePath() looks for;
        // NativeLibraryTest asserts the same literal from the Java side.
        from(sourceDir) {
            include target.library
            into "io/github/digitalsmile/goldberry/natives/${target.id}"
        }

        // An empty natives jar is worse than a missing one: it fails at load time
        // on a user's machine instead of here.
        doFirst {
            def library = new File(sourceDir.get(), target.library)
            if (!library.isFile()) {
                throw new GradleException(
                        "No ${target.library} for ${target.id} in ${sourceDir.get()}.\n" +
                                "Build it on a ${target.id} runner and download it there, " +
                                "or pass -Pgoldberry.artifactsDir=<dir>.")
            }
        }
    }
}

tasks.register('nativeJars') {
    group = nativeGroup
    description = 'Packages all four classifier jars from -Pgoldberry.artifactsDir.'
    dependsOn nativeTargets.collect { "nativeJar${taskSuffix(it.id)}" }
}

// The classifier jars ride the `goldberry-natives` publication, but only when a
// run hands over all four libraries with -Pgoldberry.artifactsDir -- which is
// `publish.yml`, after every platform's job has uploaded one. Anywhere else there
// is at most the host's library, and a publication missing three platforms is
// not a smaller release but a broken one: every jar's `doFirst` above refuses it.
//
// All four in one upload, never one per runner. A snapshot's classifiers are
// listed in the `maven-metadata.xml` its upload writes, so four uploads would
// leave the metadata naming whichever platform finished last (ADR-0334).
if (providers.gradleProperty('goldberry.artifactsDir').isPresent()) {
    publishing.publications.withType(MavenPublication).configureEach { publication ->
        nativeTargets.each { target ->
            publication.artifact(tasks.named("nativeJar${taskSuffix(target.id)}"))
        }
    }
}

// Staging step so a local `cmakeBuild` feeds the host's classifier jar without
// a manual copy.
tasks.register('stageHostArtifact', Copy) {
    group = nativeGroup
    description = 'Copies the locally built library into the artifacts directory.'

    dependsOn cmakeBuild
    from(installDir.map { it.dir('lib') }) {
        include hostTarget.library
    }
    into artifactsDir.map { new File(it, hostTarget.id) }
}

// --- Tests -------------------------------------------------------------------

// The library under test, when it is not the one this machine builds.
//
// This is how CI verifies the *published* artifact: the Linux legs build inside
// the manylinux container, and a library built anywhere else is a different
// binary (ADR-0012, ADR-0016). Accepted as either -D or -P, because -D is what
// NativeLibrary documents for a plain JVM run and -P is what reaches for the
// hand first in Gradle.
def externalLibrary = providers.systemProperty('goldberry.native.library')
        .orElse(providers.gradleProperty('goldberry.native.library'))

// Turns the "no library, skip quietly" default into a hard failure. CI sets it,
// because a verification job that skips is a green tick over an unverified
// artifact -- the one outcome worse than a red one (ADR-0016).
def nativeRequired = providers.systemProperty('goldberry.native.required')
        .orElse(providers.gradleProperty('goldberry.native.required'))
        .map { Boolean.parseBoolean(it) }
        .getOrElse(false)

// JEP 472: restricted native access is a warning from the unnamed module in
// Java 25 and an error in a later release.
//
// ALL-UNNAMED rather than the module name, because Gradle runs whitebox tests on
// the classpath -- the test classes need package-private access to the code under
// test, so they are not loaded as the named module. Consumers of the published
// artifact use --enable-native-access=io.github.digitalsmile.goldberry.natives,
// which is why the module descriptor exists (ADR-0007).
// The benchmarks are downcalls too, so they need the library and the JEP 472
// permission exactly as the tests do. Without this `:natives:benchmark` reports
// SKIPPED -- which reads as "nothing to measure" rather than as "no library".
tasks.named('benchmark') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'goldberry.native.library',
            externalLibrary.getOrElse(
                    installDir.get().dir('lib').file(hostTarget.library).asFile.absolutePath)
    systemProperty 'goldberry.native.required', nativeRequired
}

tasks.named('test') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    // Falls back to the locally built library rather than one unpacked from a
    // classifier jar. Set unconditionally: whether the file exists is decided at
    // execution time by NativeLibrary.isAvailable(), so the tests skip cleanly
    // when it is absent. Testing for it here instead would read the filesystem
    // during configuration, before cmakeBuild has had a chance to run.
    systemProperty 'goldberry.native.library',
            externalLibrary.getOrElse(
                    installDir.get().dir('lib').file(hostTarget.library).asFile.absolutePath)
    systemProperty 'goldberry.native.required', nativeRequired

    // The library is an INPUT, not merely something built first. `dependsOn
    // cmakeBuild` orders the two and nothing more, so a rebuilt libgoldberry
    // left these tests UP-TO-DATE -- which is the worst possible outcome for the
    // one check the hand-written bindings rest on (ADR-0010). Bumping an
    // upstream would have reported a green layout verification that had not run
    // against the library it was verifying.
    //
    // Optional, because the file legitimately does not exist on a machine with
    // no native toolchain; the tests skip cleanly there.
    inputs.files(providers.provider {
        var library = file(externalLibrary.getOrElse(
                installDir.get().dir('lib').file(hostTarget.library).asFile.absolutePath))
        library.isFile() ? [library] : []
    }).withPropertyName('nativeLibrary').optional()
}

// --- Wiring into the root build ----------------------------------------------
//
// `./gradlew build` builds libgoldberry for this machine too. "If not already
// built" comes free: cmakeBuild declares the install directory as its output, so
// Gradle skips it when it is up to date.
//
// The trade-off is deliberate and worth stating: a plain `./gradlew build` now
// needs a C/C++ toolchain, which the native tasks were originally kept out of
// `build` to avoid. `-Pgoldberry.skipNative=true` restores the Java-only build.
// The CI Java jobs pass it, because a separate job builds the natives properly
// on each platform and the Java job exists for fast feedback.
def skipNative = providers.gradleProperty('goldberry.skipNative')
        .map { Boolean.parseBoolean(it) }
        .getOrElse(false)

if (skipNative) {
    logger.info('Goldberry: skipping the native build (-Pgoldberry.skipNative=true)')
} else {
    tasks.named('assemble') { dependsOn cmakeBuild }
    // So the layout verification actually runs locally rather than skipping --
    // it is the check the hand-written bindings rest on (ADR-0010).
    //
    // Unless a library was handed to us. Being given one to verify is the whole
    // reason CI's verify jobs exist, and those runners have no C/C++ toolchain:
    // building here would fail in checkToolchain before a single test ran, and
    // succeeding would be worse still -- it would verify a library built on the
    // wrong machine while the downloaded artifact sat unread (ADR-0016).
    if (externalLibrary.present) {
        logger.info("Goldberry: verifying ${externalLibrary.get()}; not building a native library")
    } else {
        tasks.named('test') { dependsOn cmakeBuild }
    }
}

// ============================================================================
// No Error Prone here (docs/testing.md §2)
//
// Two reasons, and the second is the one that settles it:
//
//  - This module is hand-written FFM bindings -- downcall handles, layout
//    tables, `@SuppressWarnings("restricted")` and pointers resized against a
//    verified extent. Almost every check Error Prone has either does not apply
//    or fires on the idiom the whole module is made of.
//  - It crashes. `Blend2dContext.contextTransform` makes the plugin throw an
//    unhandled exception rather than report a finding, and a static analyser
//    that cannot analyse the file is not a gate.
//
// The module is not unchecked: its contract is the layout probe agreeing across
// four platforms, which is a stronger statement than any of these checks make --
// the same argument §3 uses for keeping :natives out of the coverage gates.
// ============================================================================
tasks.withType(JavaCompile).configureEach {
    options.errorprone.enabled = false
}
