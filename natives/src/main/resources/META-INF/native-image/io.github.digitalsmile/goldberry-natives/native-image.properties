# What an image of anything using :natives has to be told, travelling with the
# module rather than written out by every application that builds one -- the
# arrangement ADR-0160 arrived at for resources, applied to class initialisation.
#
# --initialize-at-build-time=...Downcalls
#     The whole reason downcalls are not 450x slower in an image than on the
#     JVM. Downcalls handles are unbound and depend on nothing but a
#     FunctionDescriptor, so they can be linked while the image is being built --
#     and only then are they constants the compiler can lower into a direct call
#     to the generated stub. Initialised at run time instead, every one of them
#     is an interpreted lambda form and the frame loop runs at a third of its
#     speed (ADR-0161).
#
# --initialize-at-run-time=...NativeLibrary
#     The opposite obligation, for the opposite reason: it dlopens libgoldberry
#     in its initialiser, which must happen in the process that runs and not in
#     the builder.
Args = --initialize-at-build-time=io.github.digitalsmile.goldberry.natives.Downcalls \
       --initialize-at-run-time=io.github.digitalsmile.goldberry.natives.NativeLibrary
