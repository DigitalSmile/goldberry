# What an image of anything using :natives has to be told, travelling with the
# module rather than written out by every application that builds one -- the
# arrangement ADR-0160 arrived at for resources, applied to class initialisation.
#
# --initialize-at-build-time=<the ...calls packages>
#     The whole reason downcalls are not 450x slower in an image than on the
#     JVM. A holder's FD_<symbol> handle is unbound and depends on nothing but a
#     FunctionDescriptor, so it can be linked while the image is being built --
#     and only then is it a constant the compiler can lower into a direct call to
#     the generated stub. Initialised at run time instead, every one of them is an
#     interpreted lambda form and the frame loop runs at a third of its speed
#     (ADR-0161).
#
#     These are PACKAGES, and they have to be: a holder is a nested class, and
#     naming its enclosing class does not cover it -- measured at 4537 ns/call
#     against 8 (ADR-0173). Naming a hundred and thirty-four nested classes is not
#     a maintainable list, and naming the *binding* packages instead would
#     build-time initialise Sdl and Blend2D, whose holder idiom dlopens the
#     library in the builder. So the holders live in packages that contain nothing
#     else, and these are those packages: a holder added tomorrow is covered by
#     the package that already exists.
#
#     Downcalls itself is named too. It holds the shared Linker, and a holder's
#     initialiser calls Downcalls.link.
#
#     This list is now checked rather than remembered: NativeImagePropertiesTest
#     reads this file and ForeignSurface.holderClassNames() and requires the two
#     to agree. It was written from memory once, and md4c.calls and webp.calls
#     were missing from it for as long as they had existed -- which does not fail
#     a build or a run, it just makes every Markdown parse and every WebP decode
#     in an image take the 450x path (ADR-0161).
#
#     ...desktop.calls is the one holder package deliberately NOT here, and the
#     test names it with this reason: PortalSettings binds libdbus in a static
#     initialiser and keeps the addresses in a static field, so initialising it
#     in the builder either fails the build with a MemorySegment in the image
#     heap or -- worse -- bakes the build machine's D-Bus into the image. Every
#     other ...calls package holds nothing but unbound handles.
#
# --initialize-at-run-time=...NativeLibrary
#     The opposite obligation, for the opposite reason: it dlopens libgoldberry
#     in its initialiser, which must happen in the process that runs and not in
#     the builder.
Args = --initialize-at-build-time=io.github.digitalsmile.goldberry.natives.Downcalls \
       --initialize-at-build-time=io.github.digitalsmile.goldberry.natives.calls \
       --initialize-at-build-time=io.github.digitalsmile.goldberry.natives.sdl.calls \
       --initialize-at-build-time=io.github.digitalsmile.goldberry.natives.yoga.calls \
       --initialize-at-build-time=io.github.digitalsmile.goldberry.natives.blend2d.calls \
       --initialize-at-build-time=io.github.digitalsmile.goldberry.natives.harfbuzz.calls \
       --initialize-at-build-time=io.github.digitalsmile.goldberry.natives.platform.calls \
       --initialize-at-build-time=io.github.digitalsmile.goldberry.natives.md4c.calls \
       --initialize-at-build-time=io.github.digitalsmile.goldberry.natives.webp.calls \
       --initialize-at-run-time=io.github.digitalsmile.goldberry.natives.NativeLibrary
