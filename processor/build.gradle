plugins {
    id 'java'
}

description = 'Goldberry annotation processor: turns @Bind/@Action into explicit registry code'

// Not `goldberry.java-conventions`, and not published as a module of the
// toolkit. This is a **build-time** tool like :assets: it runs inside javac, it
// never reaches an application's runtime classpath, and it has no module-info
// because an annotation processor is loaded by the compiler rather than by the
// module system (ADR-0096).
group = 'io.github.digitalsmile'
version = providers.gradleProperty('goldberryVersion').get()

def catalog = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')
def javaVersion = catalog.findVersion('java').get().requiredVersion as int

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

dependencies {
    testImplementation platform(catalog.findLibrary('junit-bom').get())
    testImplementation catalog.findLibrary('junit-jupiter').get()
    testRuntimeOnly catalog.findLibrary('junit-platform-launcher').get()
    testImplementation project(':core')
    // The *generated* `actions(...)` names `Actions`, which lives in :widgets --
    // so a test that compiles generated output needs it. An application that
    // uses only @Bind does not: `actions()` is generated only when there is an
    // @Action to put in it (ADR-0096).
    testImplementation project(':widgets')

    // For the annotation types only. The processor reads them as *elements*
    // through javax.lang.model and never loads one -- but it names them, and a
    // string would be a name nothing checks.
    compileOnly project(':core')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // The processor is compiled as plain classpath code: it is not part of the
    // module graph, so there is nothing here for JPMS to enforce.
    options.compilerArgs << '-Xlint:all,-serial' << '-Werror'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
}

tasks.withType(PublishToMavenRepository).configureEach { enabled = false }
