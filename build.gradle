plugins {
    // Aggregates every module's coverage into one report (docs/testing.md §3).
    // The root applies it and nothing else: it has no source of its own, which is
    // exactly the shape this plugin is for.
    id 'jacoco-report-aggregation'
}

// The root project is a container only. Shared configuration lives in the
// `goldberry.java-conventions` precompiled script plugin under `build-logic/`,
// which each module applies explicitly -- no cross-project `subprojects {}`
// configuration, so modules stay independently understandable and the build
// stays compatible with Gradle's project-isolation direction.

description = 'Goldberry -- a fast and modern UI toolkit for Java'

// ============================================================================
// Licence disclosure (ADR-0015)
//
// Keeps THIRD-PARTY-NOTICES.md and licenses/ from drifting apart. A dependency
// added to one and not the other is a build failure rather than something
// noticed at release time -- the same discipline the native symbol list and the
// struct layout probe apply elsewhere.
// ============================================================================
tasks.register('checkLicenses') {
    group = 'verification'
    description = 'Verifies that THIRD-PARTY-NOTICES.md and licenses/ agree.'

    def noticesFile = file('THIRD-PARTY-NOTICES.md')
    def licensesDir = file('licenses')
    def releaseCheck = providers.gradleProperty('goldberry.releaseCheck')
            .map { Boolean.parseBoolean(it) }
            .getOrElse(false)

    inputs.file noticesFile
    inputs.dir licensesDir
    inputs.property 'releaseCheck', releaseCheck

    doLast {
        def problems = []

        // Every licences/<name>.txt referenced by the notices must exist...
        def referenced = (noticesFile.text =~ /licenses\/([A-Za-z0-9._-]+\.txt)/)
                .collect { it[1] } as Set
        def present = licensesDir.listFiles()
                .findAll { it.name.endsWith('.txt') }
                .collect { it.name } as Set

        (referenced - present).each {
            problems << "THIRD-PARTY-NOTICES.md references licenses/${it}, which does not exist"
        }
        // ...and every file present must be referenced, so nothing rots unnoticed.
        (present - referenced).each {
            problems << "licenses/${it} exists but THIRD-PARTY-NOTICES.md never references it"
        }

        if (!problems.isEmpty()) {
            throw new GradleException(
                    "Licence disclosure is inconsistent:\n  " + problems.join('\n  '))
        }

        // Files still carrying the marker have no verbatim upstream text. That is
        // expected until the component is actually vendored, and unacceptable at
        // release -- so it warns by default and fails under -Pgoldberry.releaseCheck.
        def notVendored = licensesDir.listFiles()
                .findAll { it.name.endsWith('.txt') && it.text.contains('NOT-VENDORED') }
                .collect { it.name }
                .sort()

        if (notVendored.isEmpty()) {
            logger.lifecycle("Licence disclosure OK: ${present.size()} components, all vendored.")
            return
        }

        def message = "${notVendored.size()} of ${present.size()} licence files still " +
                "need their verbatim upstream text:\n  " + notVendored.join('\n  ')
        if (releaseCheck) {
            throw new GradleException(
                    message + "\n\nVendor them from the pinned upstream revisions before publishing.")
        }
        logger.warn("WARNING: ${message}\n" +
                "  (fails the build under -Pgoldberry.releaseCheck=true)")
    }
}

// ============================================================================
// The example
//
// :example is a subproject now (ADR-0023), so `./gradlew run` finds its `run`
// task the same way `./gradlew test` finds every module's tests, and IDEs import
// it with the rest. Nothing to delegate.
// ============================================================================

// ============================================================================
// Coverage, aggregated (docs/testing.md §3)
//
// One XML and one HTML for the whole project, so "is this line reached by
// anything" is a question with a single answer -- a line covered by :widgets'
// tests and not by :core's is covered.
//
// `:natives` is deliberately absent. Its module is generated FFM bindings whose
// real test is the layout probe agreeing across four platforms, not a line
// count; including it would put thousands of trivially-uncovered accessor lines
// into the denominator and make every other module's figure meaningless
// (testing.md §3, "exclusions").
//
// `:assets` and `:weaver` are build-time tools rather than shipped modules. The
// weaver is included anyway -- testing.md is explicit that the weaver *itself* is
// covered normally, and only its *output* classes are excluded, those having no
// source to map back to.
// ============================================================================
dependencies {
    jacocoAggregation project(':common')
    jacocoAggregation project(':core')
    jacocoAggregation project(':widgets')
    jacocoAggregation project(':gpu')
    jacocoAggregation project(':weaver')
    jacocoAggregation project(':example')
}

reporting {
    reports {
        testCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = 'test'
        }
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs every module\'s tests and writes one aggregated coverage report.'
    dependsOn tasks.named('testCodeCoverageReport')
    doLast {
        logger.lifecycle('Coverage report: ' +
                "${layout.buildDirectory.get()}/reports/jacoco/testCodeCoverageReport/html/index.html")
    }
}

// ============================================================================
// Blessing every module's goldens at once (docs/testing.md §5)
//
// The per-module task is in the conventions plugin; this is the one a
// contributor actually types.
// ============================================================================
tasks.register('blessGoldens') {
    group = 'verification'
    description = 'Rewrites every golden image in the project from what the code draws.'
    dependsOn subprojects.collect { ":${it.name}:blessGoldens" }
    doLast {
        logger.lifecycle('Goldens rewritten. `git diff --stat` is the review: ' +
                'an image that changed and should not have is the only thing this cannot tell you.')
    }
}
