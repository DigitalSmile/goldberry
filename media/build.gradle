import dev.goldberry.build.ToolResolver
import dev.goldberry.build.publish.CorrespondingSource
import dev.goldberry.build.publish.UpstreamSource
import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'goldberry.java-conventions'
    // `audio-player` is a @Markup widget, so this module declares a catalog of
    // its own and a KDL document finds it through the module path (ADR-0131),
    // as :html's `markdown-view` is found.
    id 'goldberry.weave'
    // Published as goldberry-media, optional in the umbrella (ADR-0495). It
    // arrives together with its natives -- FFmpeg as `ffmpeg-<target>`
    // classifiers, below -- because a goldberry-media with no FFmpeg to load is a
    // jar that fails on every machine that adds it.
    id 'goldberry.publish'
}

description = 'Goldberry media: audio and video playback over FFmpeg, driven from Java'

// The GPU lane's test helpers are :gpu's and :natives' test classes, so both
// are configured before this module's dependencies name their source sets.
evaluationDependsOn(':natives')
evaluationDependsOn(':gpu')

// ============================================================================
// goldberry-media (docs/goldberry-media.md, ADR-0460, ADR-0461)
//
// The second module in the build that binds native code itself, and the only one
// whose libraries are not libgoldberry. FFmpeg is LGPL-2.1+ and must stay
// dynamically linked and replaceable, so it cannot be folded into the toolkit's
// one static library the way md4c and libwebp were; it is five shared objects
// built by a superbuild of its own (media/src/main/cmake), loaded by
// `FfmpegLibraries`, and bound by hand in `…media.ffi`.
//
// Nothing in :core or :widgets depends on this module. The engine packages use
// none of the toolkit; `…media.view` builds its widgets from :widgets' controls.
// ============================================================================
dependencies {
    // Logging (ADR-0174).
    implementation project(':common')

    // SDL's audio stream, exported to this module alone (ADR-0461): the desktop
    // audio sink. Not `api`: no type of :natives appears in this module's surface.
    implementation project(':natives')

    // The widgets `audio-player` is built from. `api` because an `AudioPlayer` is
    // a `Widget`, and whoever holds one has to be able to say so.
    api project(':widgets')

    // Video on the GPU (docs/gpu-plan.md, phase 6; ADR-0484): `video-view`
    // shows its pictures through :gpu's video layer when :gpu is on the module
    // path, and on the CPU when it is not. `requires static`, so compile-only:
    // an application that ships no GPU module plays video all the same.
    compileOnly project(':gpu')

    // Element trees without a window, and the golden-image helpers (ADR-0050).
    testImplementation testFixtures(project(':core'))

    // The tests see :gpu, as an application that ships it does: the GPU path
    // where a frame has a GPU surface, and the CPU path everywhere else.
    // `gpuTest` below draws video on a real device with :gpu's harness, and
    // runs on :natives' first-thread launcher.
    testImplementation project(':gpu')
    testImplementation rootProject.project(':gpu').sourceSets.test.output
    testImplementation rootProject.project(':natives').sourceSets.test.output
    testImplementation libs.junit.platform.launcher
}

// ============================================================================
// The media superbuild (docs/goldberry-media.md §2)
//
// FFmpeg and dav1d for THIS machine, the local development path -- the same
// arrangement :natives has for libgoldberry (ADR-0012). It is not part of
// `./gradlew build`: it needs meson, pkg-config and make on top of CMake and
// Ninja, and a first run compiles FFmpeg. Run it on purpose:
//
//   ./gradlew :media:ffmpegBuild
//
// and the tests below find the result by themselves.
// ============================================================================
def hostTargetId = project(':natives').ext.hostNativeTargetId
def superbuildSource = layout.projectDirectory.dir('src/main/cmake')
def superbuildWorkDir = layout.buildDirectory.dir("ffmpeg/${hostTargetId}/cmake")
def superbuildInstallDir = layout.buildDirectory.dir("ffmpeg/${hostTargetId}/install")
def catalogFile = rootProject.layout.projectDirectory.file('gradle/libs.versions.toml')

// Outside build/, like :natives' clones, so `clean` does not throw away a
// FFmpeg checkout (ADR-0038).
def depsDir = providers.gradleProperty('goldberry.media.depsDir')
        .map { file(it) }
        .orElse(layout.projectDirectory.dir(".deps/${hostTargetId}").asFile)

// Every tool by absolute path, for the reason :natives gives (ADR-0040): a
// Gradle daemon started by an IDE carries launchd's PATH forever, and a tool the
// check can see must be the tool the build runs.
def toolPath = providers.environmentVariable('PATH')
        .orElse(providers.environmentVariable('Path'))
        .getOrElse('')
def resolveTool = { String name ->
    def override = providers.gradleProperty("goldberry.${name}")
            .orElse(providers.systemProperty("goldberry.${name}"))
    var found = ToolResolver.resolve(
            override.getOrElse(name),
            toolPath,
            System.getProperty('os.name', ''),
            System.getProperty('user.home', ''))
    return found.isPresent() ? found.get().toFile() : null
}

def superbuildTools = [
        cmake       : resolveTool('cmake'),
        ninja       : resolveTool('ninja'),
        meson       : resolveTool('meson'),
        'pkg-config': resolveTool('pkg-config'),
        make        : resolveTool('make'),
]
// dav1d's x86 assembly is nasm's: without it meson's configure fails on an x64
// host, long after this check could have said so.
if (hostTargetId.endsWith('-x64')) {
    superbuildTools.nasm = resolveTool('nasm')
}
// FFmpeg's configure is a shell script, which Windows has to be told how to run.
if (hostTargetId.startsWith('windows-')) {
    superbuildTools.sh = resolveTool('sh')
}

def checkMediaToolchain = tasks.register('checkMediaToolchain') {
    group = 'native'
    description = 'Verifies that the tools the FFmpeg superbuild needs are installed.'
    doLast {
        def missing = superbuildTools.findAll { name, executable -> executable == null }.keySet()
        if (!missing.isEmpty()) {
            def hint = switch (ToolResolver.familyOf(System.getProperty('os.name', ''))) {
                case ToolResolver.Family.MACOS -> 'brew install cmake ninja meson pkg-config nasm'
                case ToolResolver.Family.WINDOWS -> 'see docs/media-plan.md, "Local toolchain"'
                default -> 'sudo apt install cmake ninja-build meson pkg-config nasm make    (Debian/Ubuntu)'
            }
            throw new GradleException("""\
                Missing tools for the FFmpeg superbuild: ${missing.join(', ')}

                  ${hint}

                A tool installed somewhere unconventional can be named directly,
                e.g. -Pgoldberry.meson=/path/to/meson.""".stripIndent())
        }
        logger.lifecycle("FFmpeg superbuild toolchain OK for ${hostTargetId}:\n" +
                superbuildTools.collect { name, executable -> "  ${name.padRight(11)} ${executable}" }.join('\n'))
    }
}

// The hardware decoders (phase 5, ADR-0470): on where they need nothing but the
// OS (VideoToolbox, D3D11), off on Linux, where VAAPI would make libavutil need
// libva. -Pgoldberry.media.hwaccel=true|false overrides either way.
def hwaccel = providers.gradleProperty('goldberry.media.hwaccel')
        .map { it.toBoolean() }
        .getOrElse(!hostTargetId.startsWith('linux-'))

def ffmpegConfigure = tasks.register('ffmpegConfigure', Exec) {
    group = 'native'
    description = "Configures the FFmpeg + dav1d superbuild for ${hostTargetId}."
    dependsOn checkMediaToolchain

    inputs.dir superbuildSource
    inputs.file catalogFile
    inputs.property 'targetId', hostTargetId
    inputs.property 'hwaccel', hwaccel
    outputs.file superbuildWorkDir.map { it.file('CMakeCache.txt') }

    def arguments = [
            '-S', superbuildSource.asFile.absolutePath,
            '-B', superbuildWorkDir.get().asFile.absolutePath,
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_INSTALL_PREFIX=${superbuildInstallDir.get().asFile.absolutePath}".toString(),
            "-DGOLDBERRY_TARGET_ID=${hostTargetId}".toString(),
            "-DGOLDBERRY_MEDIA_DEPS_DIR=${depsDir.get().absolutePath}".toString(),
            "-DGOLDBERRY_MEDIA_HWACCEL=${hwaccel ? 'ON' : 'OFF'}".toString(),
    ]
    // Handed over by path so the superbuild's ExternalProjects run the same
    // executables this build checked, rather than searching a PATH of their own.
    [ninja: 'CMAKE_MAKE_PROGRAM', meson: 'GOLDBERRY_MESON', 'pkg-config': 'GOLDBERRY_PKG_CONFIG', make: 'GOLDBERRY_MAKE',
     sh: 'GOLDBERRY_SH']
            .each { tool, variable ->
                if (superbuildTools[tool] != null) {
                    arguments << "-D${variable}=${superbuildTools[tool].absolutePath}".toString()
                }
            }
    commandLine([superbuildTools.cmake?.absolutePath ?: 'cmake'] + arguments)

    doFirst {
        if (!new File(depsDir.get(), 'ffmpeg-src').isDirectory()) {
            logger.lifecycle("""\
                goldberry-media: first FFmpeg superbuild for ${hostTargetId}.

                Cloning FFmpeg and dav1d into
                  ${depsDir.get()}
                and compiling both -- several minutes the first time.""".stripIndent())
        }
    }
}

tasks.register('ffmpegBuild', Exec) {
    group = 'native'
    description = "Builds FFmpeg + dav1d for ${hostTargetId}, with the layout probe and the size gate."
    dependsOn ffmpegConfigure
    inputs.dir superbuildSource
    outputs.dir superbuildInstallDir
    commandLine superbuildTools.cmake?.absolutePath ?: 'cmake',
            '--build', superbuildWorkDir.get().asFile.absolutePath,
            '--target', 'install'
}

// ============================================================================
// The natives jar: goldberry-media's `ffmpeg-<classifier>` (goldberry-media.md §2)
//
// What `FfmpegLibraries` unpacks when no -Dgoldberry.media.libdir is set: the
// five libraries and the layout file under
// dev/goldberry/media/natives/<classifier>/ -- the literal
// `FfmpegPlatform.resourceDirectory()` returns -- and ffmpeg-NOTICE.txt under
// META-INF/, beside the licence texts every Goldberry jar carries.
//
// One task per target, as `:natives` has. The host's reads the superbuild's
// install directory; any target reads `-Pgoldberry.media.artifactsDir=<dir>/<id>`
// when CI hands over what every runner built.
// ============================================================================
def mediaTargets = ['linux-x64', 'linux-aarch64', 'windows-x64', 'macos-aarch64']
def mediaArtifactsDir = providers.gradleProperty('goldberry.media.artifactsDir').map { file(it) }
def taskSuffix = { String id -> id.split('-').collect { it.capitalize() }.join('') }

mediaTargets.each { target ->
    tasks.register("ffmpegNativesJar${taskSuffix(target)}", Jar) {
        group = 'native'
        description = "Packages FFmpeg for ${target} as goldberry-media's ffmpeg-${target} classifier."

        archiveBaseName = 'goldberry-ffmpeg-natives'
        archiveClassifier = target
        destinationDirectory = layout.buildDirectory.dir('ffmpeg-natives')

        def sourceDir = mediaArtifactsDir.isPresent()
                ? mediaArtifactsDir.map { new File(it, target) }
                : (target == hostTargetId ? superbuildInstallDir.map { it.dir('lib').asFile } : null)

        if (sourceDir != null) {
            from(sourceDir) {
                exclude 'ffmpeg-NOTICE.txt'
                into "dev/goldberry/media/natives/${target}"
            }
            from(sourceDir) {
                include 'ffmpeg-NOTICE.txt'
                into 'META-INF'
            }
        }
        // licenses/ffmpeg.txt and licenses/dav1d.txt arrive with the rest of
        // licenses/, which the conventions put in every jar's META-INF.

        // An empty natives jar fails on a user's machine; a missing one fails here.
        doFirst {
            if (sourceDir == null || !new File(sourceDir.get(), 'ffmpeg-layout.properties').isFile()) {
                throw new GradleException("No FFmpeg build for ${target}. " +
                        (target == hostTargetId
                                ? 'Run ./gradlew :media:ffmpegBuild first.'
                                : "Build it on a ${target} runner and pass -Pgoldberry.media.artifactsDir=<dir>."))
            }
        }
    }
}

def hostNativesJar = tasks.named("ffmpegNativesJar${taskSuffix(hostTargetId)}")

// ============================================================================
// The corresponding source: goldberry-media's `ffmpeg-sources` (ADR-0508)
//
// LGPL-2.1 §4 lets FFmpeg's object code be distributed only with its complete
// corresponding source, or with equivalent access to it from the same place, and
// a snapshot on Central is a distribution like a release. So the binaries above
// never go out without this jar beside them, under the same coordinates:
// FFmpeg and dav1d at exactly the pinned tags, the superbuild that compiles
// them, the licence texts, and a README.txt on rebuilding and relinking.
//
// The trees come from git -- the repositories and tags the superbuild clones,
// checked against the commits pinned beside the tags, which the superbuild
// checks too -- so this is the source that was built and not a tarball that
// shares a version number. It needs git and the network, once; it does not need
// FFmpeg built, so the Java-only publishing job makes it.
// ============================================================================
// The clones outlive `clean`, as the superbuild's do (ADR-0038);
// -Pgoldberry.media.sourcesDir puts them elsewhere.
def sourcesCloneDir = providers.gradleProperty('goldberry.media.sourcesDir')
        .map { file(it) }
        .orElse(layout.projectDirectory.dir('.deps/sources').asFile)
def upstreamSources = [
        new UpstreamSource('ffmpeg', 'https://git.ffmpeg.org/ffmpeg.git',
                libs.versions.ffmpeg.get(), libs.versions.ffmpegCommit.get()),
        new UpstreamSource('dav1d', 'https://code.videolan.org/videolan/dav1d.git',
                libs.versions.dav1d.get(), libs.versions.dav1dCommit.get()),
]
def gitExecutable = resolveTool('git')?.absolutePath ?: 'git'

def sourceArchives = upstreamSources.collectEntries { source ->
    def archive = layout.buildDirectory.file("ffmpeg-sources/${source.directory()}.tar")
    def clone = new File(sourcesCloneDir.get(), "${source.name()}.git")
    def task = tasks.register("${source.name()}SourceArchive") {
        group = 'native'
        description = "Takes ${source.name()} ${source.tag()} from git as a tar, for the ffmpeg-sources classifier."
        inputs.property 'repository', source.repository()
        inputs.property 'tag', source.tag()
        inputs.property 'commit', source.commit()
        outputs.file archive
        doLast {
            source.archive(gitExecutable, clone.toPath(), archive.get().asFile.toPath())
        }
    }
    [(task): archive]
}

// The targets whose notices this jar quotes: those packaged beside it.
def noticeDir = { String target ->
    mediaArtifactsDir.isPresent()
            ? new File(mediaArtifactsDir.get(), target)
            : (target == hostTargetId ? superbuildInstallDir.get().dir('lib').asFile : null)
}
def noticedTargets = mediaTargets.findAll {
    noticeDir(it) != null && new File(noticeDir(it), 'ffmpeg-NOTICE.txt').isFile()
}

tasks.register('ffmpegSourcesJar', Jar) {
    group = 'native'
    description = "Packages FFmpeg's and dav1d's source and build recipe as goldberry-media's ffmpeg-sources classifier."

    archiveBaseName = 'goldberry-media'
    archiveClassifier = CorrespondingSource.SOURCES
    destinationDirectory = layout.buildDirectory.dir('ffmpeg-sources')

    def ffmpeg = upstreamSources[0]
    def dav1d = upstreamSources[1]
    def readme = [
            VERSION      : project.version.toString(),
            TARGETS      : noticedTargets.isEmpty()
                    ? 'none packaged with this build of the jar'
                    : noticedTargets.collect { "ffmpeg-${it}".toString() }.join(', '),
            FFMPEG_TAG   : ffmpeg.tag(),
            FFMPEG_COMMIT: ffmpeg.commit(),
            FFMPEG_DIR   : ffmpeg.directory(),
            DAV1D_TAG    : dav1d.tag(),
            DAV1D_COMMIT : dav1d.commit(),
            DAV1D_DIR    : dav1d.directory(),
    ]
    // A filter's tokens are not an input by themselves.
    inputs.property 'readme', readme

    sourceArchives.each { task, archive ->
        dependsOn task
        from(tarTree(archive))
    }
    // The trees keep the modes git gave them, because FFmpeg's configure and its
    // helpers are scripts an `unzip` has to find executable. Everything else is
    // 0644 whatever this machine's umask, so the jar is the same wherever it is
    // made. (`useFileSystemPermissions()` cannot be scoped to one `from`: on a
    // child spec it applies to the whole archive.)
    useFileSystemPermissions()
    dirPermissions { unix('rwxr-xr-x') }
    def trees = upstreamSources.collect { it.directory() + '/' }
    eachFile { details ->
        if (!trees.any { details.path.startsWith(it) }) {
            details.permissions { unix('rw-r--r--') }
        }
    }
    // The one file not from git: FFmpeg's version.sh reads it where there is no
    // .git, as its release tarballs do, so a rebuild reports the same version.
    from(resources.text.fromString("${ffmpeg.tag()}\n")) {
        rename { 'VERSION' }
        into ffmpeg.directory()
        eachFile { it.permissions { unix('rw-r--r--') } }
    }
    from(superbuildSource) { into 'recipe/media/src/main/cmake' }
    from(catalogFile) { into 'recipe/gradle' }
    from(rootProject.file('licenses')) {
        include 'ffmpeg.txt', 'dav1d.txt'
        into 'licenses'
    }
    noticedTargets.each { target ->
        from(noticeDir(target)) {
            include 'ffmpeg-NOTICE.txt'
            into "notices/${target}"
        }
    }
    from('src/ffmpeg-sources') {
        include 'README.txt'
        filter(ReplaceTokens, tokens: readme)
    }
}

// The natives ride the goldberry-media publication as `ffmpeg-<target>`
// classifiers, as libgoldberry rides goldberry-natives, but only when a run hands
// over FFmpeg builds with -Pgoldberry.media.artifactsDir: publish.yml, once, with
// every runner's build in hand (ADR-0334, ADR-0495).
//
// A snapshot carries the targets the Media workflow built. A release is
// permanent, and one missing a target would leave that platform's users with a
// player that cannot load FFmpeg under a version nobody can re-release, so it
// refuses. Without -Pgoldberry.media.artifactsDir no classifier is attached,
// which is what `publishToMavenLocal` on a laptop wants.
if (mediaArtifactsDir.isPresent()) {
    def built = mediaTargets.findAll { new File(mediaArtifactsDir.get(), "${it}/ffmpeg-layout.properties").isFile() }
    def missing = mediaTargets - built
    if (!project.version.toString().endsWith('-SNAPSHOT') && !missing.isEmpty()) {
        throw new GradleException("A release of goldberry-media needs FFmpeg for every target; " +
                "-Pgoldberry.media.artifactsDir has none for ${missing.join(', ')} (ADR-0495).")
    }
    if (!missing.isEmpty()) {
        logger.warn("goldberry-media: this snapshot carries FFmpeg for ${built.join(', ') ?: 'no target'}, " +
                "not for ${missing.join(', ')}")
    }
    publishing.publications.withType(MavenPublication).configureEach { publication ->
        built.each { target ->
            publication.artifact(tasks.named("ffmpegNativesJar${taskSuffix(target)}")) {
                classifier = "ffmpeg-${target}"
            }
        }
        // And their source beside them, or `goldberry.publish` refuses the lot
        // (CorrespondingSource, ADR-0508).
        if (!built.isEmpty()) {
            publication.artifact(tasks.named('ffmpegSourcesJar')) {
                classifier = CorrespondingSource.SOURCES
            }
        }
    }
}

// ============================================================================
// What a native image of this module has to be told (ADR-0339)
//
// Generated from the bindings rather than traced from a run, exactly as
// `:natives:foreignMetadata` does: every holder is initialised, so every
// descriptor is recorded, and none of it needs FFmpeg -- linking a descriptor
// needs no library. The file travels in the jar under META-INF/native-image/.
// ============================================================================
def foreignMetadataDir = layout.buildDirectory.dir('generated/foreign-metadata')
def foreignMetadataFile = foreignMetadataDir.map {
    it.file('META-INF/native-image/dev.goldberry/goldberry-media/reachability-metadata.json')
}

def foreignMetadata = tasks.register('foreignMetadata', JavaExec) {
    group = 'build'
    description = 'Writes the foreign-call registrations an image of this module needs, from the bindings.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.goldberry.media.nativeimage.MediaForeignMetadata'
    // Linking a descriptor is restricted, and the generator links every one.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    inputs.files(sourceSets.main.output.classesDirs).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(foreignMetadataDir)
    argumentProviders.add({ [foreignMetadataFile.get().asFile.absolutePath] } as CommandLineArgumentProvider)
}

tasks.named('jar') {
    from(foreignMetadata)
}

tasks.register('cleanMediaDeps', Delete) {
    group = 'native'
    description = 'Discards the cached FFmpeg and dav1d sources.'
    delete depsDir, sourcesCloneDir
}

// ============================================================================
// Tests
//
// Most of this module is testable with no FFmpeg at all -- the I/O SPI, the codec
// vocabulary, the layout table against the committed probe output. What needs the
// libraries skips without them, and says so; `-Pgoldberry.media.required=true`
// turns the skip into a failure for a job whose purpose is to verify them, since a
// verification that skips is a green tick over nothing (ADR-0016).
// ============================================================================
def libraryDirectory = providers.systemProperty('goldberry.media.libdir')
        .orElse(providers.gradleProperty('goldberry.media.libdir'))
        .orElse(superbuildInstallDir.map { it.dir('lib').asFile.absolutePath })

def hostNativeLibrary = project(':natives').ext.hostNativeLibrary
def externalNativeLibrary = providers.systemProperty('goldberry.native.library')
def skipNative = providers.gradleProperty('goldberry.skipNative').map { Boolean.parseBoolean(it) }.getOrElse(false)

tasks.withType(Test).configureEach {
    // JEP 472, for the upcall stubs and the library lookups. ALL-UNNAMED because
    // whitebox tests run on the class path.
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    // libgoldberry, for the SDL audio sink's tests: the library this build
    // produced, as :html's tests take it.
    systemProperty 'goldberry.native.library',
            externalNativeLibrary.orElse(hostNativeLibrary.map { it.asFile.absolutePath }).get()
    // SDL's dummy driver: it consumes audio in real time and plays nothing, so the
    // tests are silent, and they run on a CI runner with no sound card.
    environment 'SDL_AUDIO_DRIVER', 'dummy'

    // Not for the jar test below, whose whole point is that nothing names a
    // directory and FFmpeg is found on the class path.
    if (name != 'testNativesJar') {
        systemProperty 'goldberry.media.libdir', libraryDirectory.get()
    }

    // A golden that has to be rewritten is rewritten by a property, forwarded as
    // :html forwards it.
    ['goldberry.golden.update', 'goldberry.golden.scales', 'goldberry.golden.scales.report'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }
    // `goldberry.platform.required` does for the system decoders what
    // `goldberry.media.required` does for FFmpeg, for a job whose purpose is
    // them: each system's tests fail on that system only (ADR-0489).
    ['goldberry.media.required', 'goldberry.platform.required'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }

    // The libraries are an input, so a rebuilt FFmpeg re-runs the tests rather
    // than leaving them UP-TO-DATE and green against libraries they never saw.
    inputs.files(providers.provider {
        var directory = file(libraryDirectory.get())
        directory.isDirectory() ? fileTree(directory) : files()
    }).withPropertyName('ffmpegLibraries').optional()
}

// The tests tagged `natives-jar` load FFmpeg the way an application does: from
// goldberry-media's FFmpeg classifier on the class path, unpacked into a temporary
// directory, with no -Dgoldberry.media.libdir. A JVM of their own, because
// `FfmpegLibraries` loads once per process and the ordinary test task has
// already loaded from the install directory.
tasks.named('test') {
    useJUnitPlatform { excludeTags 'natives-jar', 'gpu' }
}

// ============================================================================
// The GPU lane (docs/gpu-plan.md, phase 6; ADR-0484)
//
// Video drawn through :gpu's layer on a real device: decoded by FFmpeg,
// composited and read back, against the CPU's goldens. Tagged `gpu`, and run
// the way :gpu's and :natives' are, on the JVM's first thread, which macOS's
// Cocoa needs for a Metal device (ADR-0475). Without a device the tests skip,
// unless -Pgoldberry.gpu.required=true says the lane has one.
// ============================================================================
def gpuTest = tasks.register('gpuTest', JavaExec) {
    group = 'verification'
    description = 'Runs this module\'s GPU tests on the JVM\'s first thread, as macOS needs.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.goldberry.natives.sdl.gpu.GpuTestLauncher'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (hostTargetId.startsWith('macos-')) {
        jvmArgs '-XstartOnFirstThread'
    }
    environment 'SDL_AUDIO_DRIVER', 'dummy'
    systemProperty 'goldberry.native.library',
            externalNativeLibrary.orElse(hostNativeLibrary.map { it.asFile.absolutePath }).get()
    systemProperty 'goldberry.media.libdir', libraryDirectory.get()
    ['goldberry.native.required', 'goldberry.gpu.required', 'goldberry.gpu.videoDriver',
     'goldberry.golden.update', 'goldberry.media.required'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }
    def summary = layout.buildDirectory.file('gpu-test/summary.txt')
    inputs.files(sourceSets.test.runtimeClasspath).withPropertyName('testClasspath')
    inputs.files(providers.provider {
        var directory = file(libraryDirectory.get())
        directory.isDirectory() ? fileTree(directory) : files()
    }).withPropertyName('ffmpegLibraries').optional()
    outputs.file(summary)
    argumentProviders.add({
        [summary.get().asFile.absolutePath, 'dev.goldberry.media']
    } as CommandLineArgumentProvider)
}

tasks.named('check') { dependsOn gpuTest }

// The 4K60 run (docs/gpu-plan.md, phase 6): a minute of 4K60 VP9 on the
// platform's video engine, shown by a video-view in a real, composited window.
// Needs the clip media/src/test/fixtures/make-4k60.sh makes. Run on purpose and
// read by a person; not part of `check`.
//
//   ./gradlew :media:videoPresentProbe [-Pgoldberry.probe.clip=<file>] [-Pgoldberry.gpu=off]
// The probe logs through Logback, which the tests do not have, so the
// launcher's frame and present lines reach its output.
def probeRuntime = configurations.create('probeRuntime')
dependencies {
    add('probeRuntime', libs.logback.classic)
}

tasks.register('videoPresentProbe', JavaExec) {
    group = 'verification'
    description = 'Plays a minute of 4K60 video in a window and reports dropped pictures and CPU time (docs/gpu-plan.md, phase 6).'
    classpath = sourceSets.test.runtimeClasspath + probeRuntime
    mainClass = 'dev.goldberry.media.view.VideoPresentProbe'
    workingDir = projectDir
    systemProperty 'logback.configurationFile', file('src/test/probe/logback.xml').absolutePath
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (hostTargetId.startsWith('macos-')) {
        jvmArgs '-XstartOnFirstThread'
    }
    systemProperty 'goldberry.native.library',
            externalNativeLibrary.orElse(hostNativeLibrary.map { it.asFile.absolutePath }).get()
    systemProperty 'goldberry.media.libdir', libraryDirectory.get()
    systemProperty 'goldberry.log.level', providers.gradleProperty('goldberry.log.level').getOrElse('info')
    ['goldberry.probe.clip', 'goldberry.gpu', 'goldberry.gpu.composite'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }
    outputs.upToDateWhen { false }
}

// The same tests with no :gpu on the class path, as an application that ships
// no GPU module runs (ADR-0484): video-view draws on the CPU, and every test
// that is not the GPU lane's passes the same. `goldberry.test.gpuModule` tells
// the one test that looks for :gpu which answer to expect.
def testWithoutGpu = tasks.register('testWithoutGpu', Test) {
    group = 'verification'
    description = 'Runs the tests with :gpu off the class path, as an application without it.'
    testClassesDirs = sourceSets.test.output.classesDirs
    def gpuBuild = rootProject.project(':gpu').layout.buildDirectory.get().asFile.toPath()
    classpath = sourceSets.test.runtimeClasspath.filter { !it.toPath().startsWith(gpuBuild) }
    useJUnitPlatform { excludeTags 'natives-jar', 'gpu' }
    // The GPU lane's class names :gpu's types in its methods' signatures, and
    // discovery reflects on them before any tag is read; it is not loaded here.
    exclude '**/VideoOnGpuTest*'
    systemProperty 'goldberry.test.gpuModule', 'absent'
}

tasks.named('check') { dependsOn testWithoutGpu }

// Decided when the build is configured, because the jar task it would depend on
// refuses to package nothing -- which is right for a release and wrong for a
// contributor who never built FFmpeg. The cost: `ffmpegBuild check` in one
// invocation on a fresh machine skips this test; the next `check` runs it.
def hostFfmpegBuilt = new File(libraryDirectory.get(), 'ffmpeg-layout.properties').isFile()

def testNativesJar = tasks.register('testNativesJar', Test) {
    group = 'verification'
    description = 'Loads FFmpeg from the host natives jar, as an application would.'
    testClassesDirs = sourceSets.test.output.classesDirs
    useJUnitPlatform { includeTags 'natives-jar' }
    if (hostFfmpegBuilt) {
        dependsOn hostNativesJar
        classpath = sourceSets.test.runtimeClasspath + files(hostNativesJar.flatMap { it.archiveFile })
    } else {
        classpath = sourceSets.test.runtimeClasspath
        onlyIf('the host FFmpeg has been built') { false }
    }
}

tasks.named('check') { dependsOn testNativesJar }

// The jar test's coverage counts: it is the only test that takes the unpack
// path. So does the run without :gpu, the only one that finds no GPU module.
// The conventions read every .exec in build/jacoco, so the reports have to run
// after both.
tasks.withType(JacocoReportBase).configureEach { dependsOn testNativesJar, 'testWithoutGpu' }

// ============================================================================
// Coverage floor (docs/testing.md §3)
//
// Measured with FFmpeg loaded on 2026-09-23, after phase 6: 89.5% of lines,
// 78.9% of branches (phase 3 closed at 88.9% and 77.1%, phase 2 at 85.9% and
// 74.4%).
// The floor sits just under both, as :html's does. Without FFmpeg every native
// test skips and the figure falls by a third, a gate no Java-only build could
// pass, so it applies only where the libraries are there -- `:html`'s condition,
// for this module's library (ADR-0338). What is left uncovered is mostly the
// loader's unpack path, which `testNativesJar` covers in a JVM of its own.
//
// The system decoders (ADR-0493) are counted where they run. Another system's
// package is never reached here, and a floor over it would measure the
// operating system rather than the tests; this system's is counted only when
// -Pgoldberry.platform.required=true says the job has its decoders installed,
// which is the rule `:media-platform`'s own floor kept.
// ============================================================================
def hostSystem = hostTargetId.substring(0, hostTargetId.indexOf('-'))
def platformRequired = providers.gradleProperty('goldberry.platform.required')
        .orElse(providers.systemProperty('goldberry.platform.required'))
        .map { Boolean.parseBoolean(it) }
        .getOrElse(false)
def uncountedSystems = ['linux', 'macos', 'windows'].findAll { !(platformRequired && it == hostSystem) }

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    onlyIf('FFmpeg is built for this machine') {
        new File(libraryDirectory.get(), 'ffmpeg-layout.properties').isFile()
    }
    classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
        uncountedSystems.each { exclude "dev/goldberry/media/platform/${it}/**" }
    })
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 0.88 }
            limit { counter = 'BRANCH'; minimum = 0.77 }
        }
    }
}

// The SDL sink's tests need libgoldberry, and must run against the one this
// build made; the same wiring :html has.
if (!skipNative && !externalNativeLibrary.isPresent()) {
    tasks.withType(Test).configureEach { dependsOn ':natives:cmakeBuild' }
    gpuTest.configure { dependsOn ':natives:cmakeBuild' }
}
