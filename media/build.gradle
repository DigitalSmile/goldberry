import dev.goldberry.build.ToolResolver
import dev.goldberry.build.natives.NativeTarget
import dev.goldberry.build.toolchain.ToolLookup

plugins {
    id 'goldberry.java-conventions'
    // `audio-player` is a @Markup widget, so this module declares a catalog of
    // its own and a KDL document finds it through the module path,
    // as :html's `markdown-view` is found.
    id 'goldberry.weave'
    // Published as goldberry-media, optional in the umbrella. It
    // arrives together with its natives -- libgoldberry-media as `natives-<target>`
    // classifiers, below -- because a goldberry-media with no decoder to load is
    // a jar that fails on every machine that adds it.
    id 'goldberry.publish'
    // The SDL audio sink's tests load libgoldberry.
    id 'goldberry.native-tests'
}

description = 'Goldberry media: audio and video playback, demuxed in Java and decoded by the reference codecs'

// ============================================================================
// goldberry-media
// https://goldberry.dev/docs/components/media.html#the-module
//
// The second module in the build that binds native code itself, and the only one
// whose library is not libgoldberry: libgoldberry-media, the reference decoders
// (dav1d, libvpx, Opus, Vorbis, FLAC, minimp3) and libyuv linked into one
// shared object by a superbuild of its own (media/src/main/cmake), so that an
// application which plays no media carries none of it. Loaded by
// `MediaNatives`, and bound by hand in `…media.ffm`. The demuxers, the clock
// and the I/O are Java.
//
// Nothing in :core or :widgets depends on this module. The engine packages use
// none of the toolkit; `…media.view` builds its widgets from :widgets' controls.
// ============================================================================
dependencies {
    // Logging.
    implementation project(':common')

    // SDL's audio stream, exported to this module alone: the desktop
    // audio sink. Not `api`: no type of :natives appears in this module's surface.
    implementation project(':natives')

    // The widgets `audio-player` is built from. `api` because an `AudioPlayer` is
    // a `Widget`, and whoever holds one has to be able to say so.
    api project(':widgets')

    // Video on the GPU: `video-view`
    // shows its pictures through :gpu's video layer when :gpu is on the module
    // path, and on the CPU when it is not. `requires static`, so compile-only:
    // an application that ships no GPU module plays video all the same.
    compileOnly project(':gpu')

    // Element trees without a window, and the golden-image helpers.
    testImplementation testFixtures(project(':core'))

    // The tests see :gpu, as an application that ships it does: the GPU path
    // where a frame has a GPU surface, and the CPU path everywhere else.
    // `gpuTest` below draws video on a real device with :gpu's harness, and
    // runs on :natives' first-thread launcher; both are test fixtures.
    testImplementation project(':gpu')
    testImplementation testFixtures(project(':gpu'))
    testImplementation testFixtures(project(':natives'))
    testImplementation libs.junit.platform.launcher
}

// ============================================================================
// The media superbuild
// https://goldberry.dev/docs/components/media.html#bringing-a-codec
//
// libgoldberry-media for THIS machine, the local development path -- the same
// arrangement :natives has for libgoldberry. It is not part of
// `./gradlew build`: it needs meson and make on top of CMake and Ninja, nasm on
// x86, and a first run clones and compiles seven upstreams. Run it on purpose:
//
//   ./gradlew :media:nativesBuild
//
// and the tests below find the result by themselves.
// ============================================================================
def hostTarget = nativeTests.host
def hostTargetId = hostTarget.id()
def superbuildSource = layout.projectDirectory.dir('src/main/cmake')
def superbuildWorkDir = layout.buildDirectory.dir("media-natives/${hostTargetId}/cmake")
// `NativeTarget.mediaInstallDir()`, which is where :example's `run` looks too.
def superbuildInstallDir = layout.buildDirectory.dir(hostTarget.mediaInstallDir())
def catalogFile = rootProject.layout.projectDirectory.file('gradle/libs.versions.toml')

// Outside build/, like :natives' clones, so `clean` does not throw away seven
// checkouts.
def depsDir = providers.gradleProperty('goldberry.media.depsDir')
        .map { file(it) }
        .orElse(layout.projectDirectory.dir(".deps/${hostTargetId}").asFile)

// Every tool by absolute path, for the reason :natives gives: a
// Gradle daemon started by an IDE carries launchd's PATH forever, and a tool the
// check can see must be the tool the build runs.
def tools = ToolLookup.from(providers)
def resolveTool = { String name -> tools.fileOrNull(name) }

def superbuildTools = [
        cmake: resolveTool('cmake'),
        ninja: resolveTool('ninja'),
        meson: resolveTool('meson'),
        make : resolveTool('make'),
]
// dav1d's and libvpx's x86 assembly is nasm's: without it their configure steps
// fail on an x64 host, long after this check could have said so.
if (hostTargetId.endsWith('-x64')) {
    superbuildTools.nasm = resolveTool('nasm')
}
// libvpx's configure is a shell script, which Windows has to be told how to run.
if (hostTargetId.startsWith('windows-')) {
    superbuildTools.sh = resolveTool('sh')
}

def checkMediaToolchain = tasks.register('checkMediaToolchain') {
    group = 'native'
    description = 'Verifies that the tools the media superbuild needs are installed.'
    doLast {
        def missing = superbuildTools.findAll { name, executable -> executable == null }.keySet()
        if (!missing.isEmpty()) {
            def hint = switch (ToolResolver.familyOf(System.getProperty('os.name', ''))) {
                case ToolResolver.Family.MACOS -> 'brew install cmake ninja meson nasm'
                case ToolResolver.Family.WINDOWS -> 'install MSYS2 and, in its UCRT64 shell, pacman -S mingw-w64-ucrt-x86_64-{toolchain,cmake,ninja,meson,nasm} make'
                default -> 'sudo apt install cmake ninja-build meson nasm make    (Debian/Ubuntu)'
            }
            throw new GradleException("""\
                Missing tools for the media superbuild: ${missing.join(', ')}

                  ${hint}

                A tool installed somewhere unconventional can be named directly,
                e.g. -Pgoldberry.meson=/path/to/meson.""".stripIndent())
        }
        logger.lifecycle("media superbuild toolchain OK for ${hostTargetId}:\n" +
                superbuildTools.collect { name, executable -> "  ${name.padRight(11)} ${executable}" }.join('\n'))
    }
}

// One configure task and one build task per flavour of the library: the one
// that ships, and the sanitizer build below, each with a work directory, an
// install directory and a deps directory of its own.
def registerSuperbuild = { String suffix, String flavour, workDir, installDir, deps, List<String> extraArguments ->
    def configure = tasks.register("nativesConfigure${suffix}", Exec) {
        group = 'native'
        description = "Configures the libgoldberry-media superbuild for ${hostTargetId}${flavour}."
        dependsOn checkMediaToolchain

        inputs.dir superbuildSource
        inputs.file catalogFile
        inputs.property 'targetId', hostTargetId
        inputs.property 'extraArguments', extraArguments
        outputs.file workDir.map { it.file('CMakeCache.txt') }

        def arguments = [
                '-S', superbuildSource.asFile.absolutePath,
                '-B', workDir.get().asFile.absolutePath,
                '-G', 'Ninja',
                '-DCMAKE_BUILD_TYPE=Release',
                "-DCMAKE_INSTALL_PREFIX=${installDir.get().asFile.absolutePath}".toString(),
                "-DGOLDBERRY_TARGET_ID=${hostTargetId}".toString(),
                "-DGOLDBERRY_MEDIA_DEPS_DIR=${deps.get().absolutePath}".toString(),
        ] + extraArguments
        // Handed over by path so the superbuild's ExternalProjects run the same
        // executables this build checked, rather than searching a PATH of their own.
        [ninja: 'CMAKE_MAKE_PROGRAM', meson: 'GOLDBERRY_MESON', make: 'GOLDBERRY_MAKE', sh: 'GOLDBERRY_SH']
                .each { tool, variable ->
                    if (superbuildTools[tool] != null) {
                        arguments << "-D${variable}=${superbuildTools[tool].absolutePath}".toString()
                    }
                }
        commandLine([superbuildTools.cmake?.absolutePath ?: 'cmake'] + arguments)

        doFirst {
            if (!new File(deps.get(), 'dav1d-src').isDirectory()) {
                logger.lifecycle("""\
                    goldberry-media: first media superbuild for ${hostTargetId}${flavour}.

                    Cloning dav1d, libvpx, Opus, libogg, libvorbis, libtheora, FLAC, libyuv and minimp3 into
                      ${deps.get()}
                    and compiling them -- several minutes the first time.""".stripIndent())
            }
        }
    }

    tasks.register("nativesBuild${suffix}", Exec) {
        group = 'native'
        description = "Builds libgoldberry-media for ${hostTargetId}${flavour}, with the layout probe" +
                (extraArguments.isEmpty() ? ' and the size gate.' : '.')
        dependsOn configure
        inputs.dir superbuildSource
        outputs.dir installDir
        commandLine superbuildTools.cmake?.absolutePath ?: 'cmake',
                '--build', workDir.get().asFile.absolutePath,
                '--target', 'install'
    }
}

registerSuperbuild('', '', superbuildWorkDir, superbuildInstallDir, depsDir, [])

// ============================================================================
// The sanitizer build
// https://goldberry.dev/docs/components/media.html#the-module
//
// libgoldberry-media with AddressSanitizer compiled into every upstream and
// into our own file: what `sanitizerTest` below runs the decoders against, so
// that a read past the end of a packet or a picture is reported where it
// happens rather than wherever the corruption surfaces. Linux only, with GCC's
// runtime preloaded into the test JVM. Its own work, install and deps
// directories: nothing of it can reach the library that ships.
//
//   ./gradlew :media:nativesBuildAsan [-Pgoldberry.media.sanitize=address,undefined]
// ============================================================================
def sanitizers = providers.gradleProperty('goldberry.media.sanitize').getOrElse('address')
// linux-x64-asan, linux-x64-asan-ubsan: each combination builds apart, so
// trying UBSan does not throw away the AddressSanitizer build.
def sanitizerFlavour = sanitizers.split(',')
        .collect { it.trim() == 'address' ? 'asan' : it.trim() == 'undefined' ? 'ubsan' : it.trim() }
        .sort()
        .join('-')
def asanTargetId = "${hostTargetId}-${sanitizerFlavour}"
def asanWorkDir = layout.buildDirectory.dir("media-natives/${asanTargetId}/cmake")
def asanInstallDir = layout.buildDirectory.dir("media-natives/${asanTargetId}/install")
def asanDepsDir = providers.gradleProperty('goldberry.media.asanDepsDir')
        .map { file(it) }
        .orElse(layout.projectDirectory.dir(".deps/${asanTargetId}").asFile)

registerSuperbuild('Asan', " with -fsanitize=${sanitizers}", asanWorkDir, asanInstallDir, asanDepsDir,
        ["-DGOLDBERRY_MEDIA_SANITIZE=${sanitizers}".toString()])

// ============================================================================
// The natives jar: goldberry-media's `natives-<target>`
// https://goldberry.dev/docs/contributing/releasing.html#where-things-go
//
// What `MediaNatives` unpacks when no -Dgoldberry.media.libdir is set: the
// library and the layout file under dev/goldberry/media/natives/<target>/ --
// the literal `MediaPlatform.resourceDirectory()` returns -- and
// media-NOTICE.txt under META-INF/, beside the licence texts every Goldberry
// jar carries.
//
// One task per target, as `:natives` has. The host's reads the library the
// tests load (below); any target reads `-Pgoldberry.media.artifactsDir=<dir>/<id>`
// when CI hands over what every runner built.
// ============================================================================
// The library the tests load, and the host's natives jar packages: the one
// -Pgoldberry.media.libdir names (CI hands over a runner's build that way, with
// nothing built here), else the superbuild's.
def libraryDirectory = providers.systemProperty('goldberry.media.libdir')
        .orElse(providers.gradleProperty('goldberry.media.libdir'))
        .orElse(superbuildInstallDir.map { it.dir('lib').asFile.absolutePath })
def mediaTargets = NativeTarget.ALL.collect { it.id() }
def mediaArtifactsDir = providers.gradleProperty('goldberry.media.artifactsDir').map { file(it) }
def taskSuffix = { String id -> id.split('-').collect { it.capitalize() }.join('') }
def layoutFileName = 'media-layout.properties'

mediaTargets.each { target ->
    tasks.register("nativesJar${taskSuffix(target)}", Jar) {
        group = 'native'
        description = "Packages libgoldberry-media for ${target} as goldberry-media's natives-${target} classifier."

        archiveBaseName = 'goldberry-media-natives'
        archiveClassifier = target
        destinationDirectory = layout.buildDirectory.dir('media-natives-jars')

        def sourceDir = mediaArtifactsDir.isPresent()
                ? mediaArtifactsDir.map { new File(it, target) }
                : (target == hostTargetId ? libraryDirectory.map { file(it) } : null)

        if (sourceDir != null) {
            from(sourceDir) {
                exclude 'media-NOTICE.txt'
                into "dev/goldberry/media/natives/${target}"
            }
            from(sourceDir) {
                include 'media-NOTICE.txt'
                into 'META-INF'
            }
        }
        // The licence texts arrive with the rest of licenses/, which the
        // conventions put in every jar's META-INF.

        // An empty natives jar fails on a user's machine; a missing one fails here.
        doFirst {
            if (sourceDir == null || !new File(sourceDir.get(), layoutFileName).isFile()) {
                throw new GradleException("No libgoldberry-media build for ${target}. " +
                        (target == hostTargetId
                                ? 'Run ./gradlew :media:nativesBuild first.'
                                : "Build it on a ${target} runner and pass -Pgoldberry.media.artifactsDir=<dir>."))
            }
        }
    }
}

def hostNativesJar = tasks.named("nativesJar${taskSuffix(hostTargetId)}")

// The natives ride the goldberry-media publication as `natives-<target>`
// classifiers, as libgoldberry rides goldberry-natives, but only when a run hands
// over builds with -Pgoldberry.media.artifactsDir: publish.yml, once, with every
// runner's build in hand.
//
// A snapshot carries the targets the Media workflow built. A release is
// permanent, and one missing a target would leave that platform's users with a
// player that cannot load its natives under a version nobody can re-release, so
// it refuses. Without -Pgoldberry.media.artifactsDir no classifier is attached,
// which is what `publishToMavenLocal` on a laptop wants.
if (mediaArtifactsDir.isPresent()) {
    def built = mediaTargets.findAll { new File(mediaArtifactsDir.get(), "${it}/${layoutFileName}").isFile() }
    def missing = mediaTargets - built
    if (!project.version.toString().endsWith('-SNAPSHOT') && !missing.isEmpty()) {
        throw new GradleException("A release of goldberry-media needs libgoldberry-media for every target; " +
                "-Pgoldberry.media.artifactsDir has none for ${missing.join(', ')}.")
    }
    if (!missing.isEmpty()) {
        logger.warn("goldberry-media: this snapshot carries natives for ${built.join(', ') ?: 'no target'}, " +
                "not for ${missing.join(', ')}")
    }
    publishing.publications.withType(MavenPublication).configureEach { publication ->
        built.each { target ->
            publication.artifact(tasks.named("nativesJar${taskSuffix(target)}")) {
                classifier = "natives-${target}"
            }
        }
    }
}

// ============================================================================
// What a native image of this module has to be told
// https://goldberry.dev/docs/native.html#two-metadata-directories-traced-and-written
//
// Generated from the bindings rather than traced from a run, exactly as
// `:natives:foreignMetadata` does: every holder is initialised, so every
// descriptor is recorded, and none of it needs the library -- linking a
// descriptor needs no library. The file travels in the jar under META-INF/native-image/.
// ============================================================================
def foreignMetadataDir = layout.buildDirectory.dir('generated/foreign-metadata')
def foreignMetadataFile = foreignMetadataDir.map {
    it.file('META-INF/native-image/dev.goldberry/goldberry-media/reachability-metadata.json')
}

def foreignMetadata = tasks.register('foreignMetadata', JavaExec) {
    group = 'build'
    description = 'Writes the foreign-call registrations an image of this module needs, from the bindings.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.goldberry.media.nativeimage.MediaForeignMetadata'
    // Linking a descriptor is restricted, and the generator links every one.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    inputs.files(sourceSets.main.output.classesDirs).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(foreignMetadataDir)
    argumentProviders.add({ [foreignMetadataFile.get().asFile.absolutePath] } as CommandLineArgumentProvider)
}

tasks.named('jar') {
    from(foreignMetadata)
}

tasks.register('cleanMediaDeps', Delete) {
    group = 'native'
    description = 'Discards the cached upstream sources and their builds.'
    delete depsDir
}

// ============================================================================
// Tests
//
// Most of this module is testable with no natives at all -- the I/O SPI, the
// demuxers, the codec vocabulary, the layout table against the committed probe
// output. What needs the library skips without it, and says so;
// `-Pgoldberry.media.required=true` turns the skip into a failure for a job whose
// purpose is to verify it, since a verification that skips is a green tick over
// nothing.
// ============================================================================
def asanLibraryDirectory = providers.gradleProperty('goldberry.media.asanLibdir')
        .orElse(asanInstallDir.map { it.dir('lib').asFile.absolutePath })

def skipNative = providers.gradleProperty('goldberry.skipNative').map { Boolean.parseBoolean(it) }.getOrElse(false)

// libgoldberry, JEP 472 and the forwarded properties come from
// `goldberry.native-tests`; libgoldberry-media is this module's own.
//
// While FFmpeg is still being taken out, its bindings read
// `goldberry.media.ffmpegLibdir`, pointed at what an earlier `ffmpegBuild` left
// on this machine; their tests skip where there is none.
def ffmpegLibraryDirectory = layout.buildDirectory.dir("ffmpeg/${hostTargetId}/install/lib").get().asFile
tasks.withType(Test).configureEach {
    // SDL's dummy driver: it consumes audio in real time and plays nothing, so the
    // tests are silent, and they run on a CI runner with no sound card.
    environment 'SDL_AUDIO_DRIVER', 'dummy'

    // Not for the jar test below, whose whole point is that nothing names a
    // directory and the library is found on the class path, nor for the
    // sanitizer lane, which names the sanitizer build's.
    def testedLibrary = name == 'sanitizerTest' ? asanLibraryDirectory : libraryDirectory
    if (name != 'testNativesJar') {
        systemProperty 'goldberry.media.libdir', testedLibrary.get()
    }
    if (ffmpegLibraryDirectory.isDirectory()) {
        systemProperty 'goldberry.media.ffmpegLibdir', ffmpegLibraryDirectory.absolutePath
    }

    // How hard the robustness tests mutate: rounds per fixture and kind of
    // damage, and the seed they start from. The sanitizer lane raises the rounds.
    ['goldberry.media.fuzz.rounds', 'goldberry.media.fuzz.seed'].each { property ->
        var value = providers.systemProperty(property).orElse(providers.gradleProperty(property))
        if (value.present) {
            systemProperty property, value.get()
        }
    }

    // The library is an input, so a rebuilt one re-runs the tests rather than
    // leaving them UP-TO-DATE and green against a library they never saw.
    inputs.files(providers.provider {
        var directory = file(testedLibrary.get())
        directory.isDirectory() ? fileTree(directory) : files()
    }).withPropertyName('mediaNatives').optional()
}

// The tests tagged `natives-jar` load the library the way an application does:
// from goldberry-media's natives classifier on the class path, unpacked into a
// temporary directory, with no -Dgoldberry.media.libdir. A JVM of their own,
// because `MediaNatives` loads once per process and the ordinary test task has
// already loaded from the install directory.
tasks.named('test') {
    useJUnitPlatform { excludeTags 'natives-jar', 'gpu' }
}

// ============================================================================
// The GPU lane
// https://goldberry.dev/docs/contributing/testing.html#the-gpu-tests
//
// Video drawn through :gpu's layer on a real device: decoded in software,
// composited and read back, against the CPU's goldens. Tagged `gpu`, and run
// the way :gpu's and :natives' are, on the JVM's first thread, which macOS's
// Cocoa needs for a Metal device. Without a device the tests skip,
// unless -Pgoldberry.gpu.required=true says the lane has one.
// ============================================================================
nativeTests.gpuTests('dev.goldberry.media').configure {
    environment 'SDL_AUDIO_DRIVER', 'dummy'
    systemProperty 'goldberry.media.libdir', libraryDirectory.get()
    if (ffmpegLibraryDirectory.isDirectory()) {
        systemProperty 'goldberry.media.ffmpegLibdir', ffmpegLibraryDirectory.absolutePath
    }
    inputs.files(providers.provider {
        var directory = file(libraryDirectory.get())
        directory.isDirectory() ? fileTree(directory) : files()
    }).withPropertyName('mediaNatives').optional()
}

// The 4K60 run: a minute of 4K60 VP9 on the
// platform's video engine, shown by a video-view in a real, composited window.
// Needs the clip media/src/test/fixtures/make-4k60.sh makes. Run on purpose and
// read by a person; not part of `check`.
//
//   ./gradlew :media:videoPresentProbe [-Pgoldberry.probe.clip=<file>] [-Pgoldberry.gpu=off]
// The probe logs through Logback, which the tests do not have, so the
// launcher's frame and present lines reach its output.
def probeRuntime = configurations.create('probeRuntime')
dependencies {
    add('probeRuntime', libs.logback.classic)
}

nativeTests.probe('videoPresentProbe', 'dev.goldberry.media.view.VideoPresentProbe',
        'Plays a minute of 4K60 video in a window and reports dropped pictures and CPU time.').configure {
    classpath += probeRuntime
    workingDir = projectDir
    systemProperty 'logback.configurationFile', file('src/benchmark/probe/logback.xml').absolutePath
    systemProperty 'goldberry.media.libdir', libraryDirectory.get()
    if (ffmpegLibraryDirectory.isDirectory()) {
        systemProperty 'goldberry.media.ffmpegLibdir', ffmpegLibraryDirectory.absolutePath
    }
    systemProperty 'goldberry.log.level', providers.gradleProperty('goldberry.log.level').getOrElse('info')
    ['goldberry.probe.clip', 'goldberry.gpu', 'goldberry.gpu.composite'].each { name ->
        var value = providers.systemProperty(name).orElse(providers.gradleProperty(name))
        if (value.present) {
            systemProperty name, value.get()
        }
    }
}

// The same tests with no :gpu on the class path, as an application that ships
// no GPU module runs: video-view draws on the CPU, and every test
// that is not the GPU lane's passes the same. `goldberry.test.gpuModule` tells
// the one test that looks for :gpu which answer to expect.
def testWithoutGpu = tasks.register('testWithoutGpu', Test) {
    group = 'verification'
    description = 'Runs the tests with :gpu off the class path, as an application without it.'
    testClassesDirs = sourceSets.test.output.classesDirs
    def gpuBuild = layout.settingsDirectory.dir('gpu/build').asFile.toPath()
    classpath = sourceSets.test.runtimeClasspath.filter { !it.toPath().startsWith(gpuBuild) }
    // The robustness tests touch no widget and no GPU; running their thousands
    // of mutated inputs a second time here would find nothing the first run did not.
    useJUnitPlatform { excludeTags 'natives-jar', 'gpu', 'robustness' }
    // The GPU lane's classes name :gpu's types in their fields and methods'
    // signatures, and discovery reflects on them before any tag is read; they
    // are not loaded here.
    exclude '**/*OnGpuTest*'
    systemProperty 'goldberry.test.gpuModule', 'absent'
}

tasks.named('check') { dependsOn testWithoutGpu }

// Decided when the build is configured, because the jar task it would depend on
// refuses to package nothing -- which is right for a release and wrong for a
// contributor who never built the natives. The cost: `nativesBuild check` in one
// invocation on a fresh machine skips this test; the next `check` runs it.
def hostNativesBuilt = new File(libraryDirectory.get(), layoutFileName).isFile()

def testNativesJar = tasks.register('testNativesJar', Test) {
    group = 'verification'
    description = 'Loads libgoldberry-media from the host natives jar, as an application would.'
    testClassesDirs = sourceSets.test.output.classesDirs
    useJUnitPlatform { includeTags 'natives-jar' }
    if (hostNativesBuilt) {
        dependsOn hostNativesJar
        classpath = sourceSets.test.runtimeClasspath + files(hostNativesJar.flatMap { it.archiveFile })
    } else {
        classpath = sourceSets.test.runtimeClasspath
        onlyIf('the host media natives have been built') { false }
    }
}

tasks.named('check') { dependsOn testNativesJar }

// The jar test's coverage counts: it is the only test that takes the unpack
// path. So does the run without :gpu, the only one that finds no GPU module.
// The conventions read every .exec in build/jacoco, so the reports have to run
// after both.
tasks.withType(JacocoReportBase).configureEach { dependsOn testNativesJar, 'testWithoutGpu' }

// ============================================================================
// The sanitizer lane
// https://goldberry.dev/docs/components/media.html#the-module
//
// The decoders' tests and the robustness tests, whose mutated packets and
// files are what an untrusted download feeds the codecs, against the sanitizer
// build (`nativesBuildAsan` above), with many more rounds of mutation than
// `test` runs. Not part of `check`: it needs that build, and GCC's libasan to
// preload. Linux only.
//
//   ./gradlew :media:nativesBuildAsan :media:sanitizerTest [-Pgoldberry.media.fuzz.rounds=64]
//
// The JVM is not instrumented, so libasan has to be first in the process
// (LD_PRELOAD) and has to leave alone the signals HotSpot uses itself: SIGSEGV
// for its null checks and safepoint polls, SIGBUS, SIGFPE for division by
// zero, SIGILL. Leak detection is off, since the JVM's own allocations are
// never freed at exit. A finding stops the JVM, and its report is written
// under build/sanitizer/, which `sanitizerReport` prints and fails on.
//
// With `-Pgoldberry.media.sanitize=address,undefined`, UBSan's reports are fatal
// too, except the upstreams' own in src/test/sanitizer/ubsan.supp. GCC's UBSan
// beside ASan writes to the JVM's standard error, not to a file, so its report
// is in the task's output.
// ============================================================================
def sanitizerReports = layout.buildDirectory.dir('sanitizer')
def sanitizerRounds = providers.systemProperty('goldberry.media.fuzz.rounds')
        .orElse(providers.gradleProperty('goldberry.media.fuzz.rounds'))
        .getOrElse('48')
def asanRuntime = providers.gradleProperty('goldberry.media.asanRuntime')
        .orElse(providers.exec { commandLine 'gcc', '-print-file-name=libasan.so' }
                .standardOutput.asText.map { it.trim() })

def sanitizerReport = tasks.register('sanitizerReport') {
    group = 'verification'
    description = 'Prints what the sanitizer lane reported, and fails when it reported anything.'
    def reports = sanitizerReports
    def lane = tasks.named('sanitizerTest')
    doLast {
        def found = reports.get().asFile.listFiles()?.findAll { it.isFile() && it.length() > 0 } ?: []
        if (!found.isEmpty()) {
            found.each { report -> logger.error("${report.name}:\n${report.text}") }
            throw new GradleException("The sanitizers reported ${found.size()} finding(s); see above, " +
                    "or ${reports.get().asFile}.")
        }
        if (lane.get().state.failure != null) {
            logger.lifecycle('The sanitizers wrote no report file. A UBSan finding goes to the test JVM\'s ' +
                    'standard error instead: look for "runtime error" in sanitizerTest\'s output above.')
        } else {
            logger.lifecycle('The sanitizers reported nothing.')
        }
    }
}

tasks.register('sanitizerTest', Test) {
    group = 'verification'
    description = 'Runs the decoders and the robustness tests against the sanitizer build of libgoldberry-media.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { excludeTags 'natives-jar', 'gpu' }
    filter {
        includeTestsMatching 'dev.goldberry.media.robustness.*'
        includeTestsMatching 'dev.goldberry.media.decoder.*'
        includeTestsMatching 'dev.goldberry.media.ffm.*'
    }
    // A lane whose whole purpose is the library fails rather than skips without it.
    systemProperty 'goldberry.media.required', 'true'
    systemProperty 'goldberry.media.fuzz.rounds', sanitizerRounds
    // What `SanitizerLaneTest` checks the process for: the lane is only as good
    // as the library it really loaded.
    systemProperty 'goldberry.media.sanitizer', sanitizers
    // Run in one invocation with the build, as CI does, the build goes first;
    // run alone, the lane tests what is there.
    mustRunAfter 'nativesBuildAsan'
    finalizedBy sanitizerReport

    def reports = sanitizerReports
    def runtime = asanRuntime
    def address = sanitizers.contains('address')
    def suppressions = layout.projectDirectory.file('src/test/sanitizer/ubsan.supp')
    inputs.file(suppressions).withPropertyName('ubsanSuppressions')
    doFirst {
        if (!System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('linux')) {
            throw new GradleException('The sanitizer lane runs on Linux.')
        }
        def directory = reports.get().asFile
        directory.deleteDir()
        directory.mkdirs()
        if (address) {
            def runtimeFile = new File(runtime.get())
            if (!runtimeFile.isAbsolute() || !runtimeFile.exists()) {
                throw new GradleException("No libasan at '${runtime.get()}'; pass -Pgoldberry.media.asanRuntime=<path>.")
            }
            environment 'LD_PRELOAD', runtimeFile.canonicalPath
        }
        environment 'ASAN_OPTIONS', [
                'detect_leaks=0',
                'handle_segv=0',
                'handle_sigbus=0',
                'handle_sigfpe=0',
                'handle_sigill=0',
                'allow_user_segv_handler=1',
                'detect_stack_use_after_return=0',
                'allocator_may_return_null=1',
                'halt_on_error=1',
                "log_path=${new File(directory, 'asan')}",
        ].join(':')
        environment 'UBSAN_OPTIONS', [
                'print_stacktrace=1',
                'halt_on_error=1',
                "suppressions=${suppressions.asFile.absolutePath}",
                "log_path=${new File(directory, 'ubsan')}",
        ].join(':')
    }
}

